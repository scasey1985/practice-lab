  "m-s-13":"A 90° counter-clockwise rotation about the origin sends (x, y) to (−y, x).\nHere x = 4 and y = 1.\nNew x = −y = −1\nNew y = x = 4\nAnswer: (−1, 4).\nSketch it if you forget the rule: (4, 1) is right and slightly up; turning a quarter turn counter-clockwise swings it up and slightly left. ✓",
  "m-s-14":"A dilation multiplies every LENGTH by the scale factor.\nSides: 5 × 3 = 15 cm\nArea before: 5 × 5 = 25 cm²\nArea after: 15 × 15 = 225 cm²\n225 ÷ 25 = 9, which is 3².\nAnswer: sides ×3, area ×9.\nThe rule: area scales by the factor SQUARED — because both dimensions grew.",
  "m-s-15":"Count the properties of each option:\nSquare-based pyramid: 5 faces, 5 vertices, 8 edges.\nTriangular prism: 2 triangles + 3 rectangles = 5 faces; 3 vertices at each end = 6; 3 edges per triangle + 3 joining = 9 edges ✓\nCylinder: curved, no vertices.\nRectangular prism: 6 faces, 8 vertices, 12 edges.\nAnswer: triangular prism. (The pyramid matches on faces but not on vertices or edges — check all three.)",

  /* ===== math: financial ===== */
  "m-f-01":"The rate says 1 CAD buys 0.74 USD, and you are starting with Canadian dollars.\n100 × 0.74 = 74\nAnswer: 74 USD.\nCheck the direction: each dollar buys less than a dollar's worth, so the answer should be smaller than 100. ✓",
  "m-f-02":"The rate says 1 USD costs 1.35 CAD, and you want the Canadian cost of 250 USD.\n250 × 1.35 = 337.50\nAnswer: CAD $337.50.\nCheck: each US dollar costs more than one Canadian dollar, so the answer should be bigger than 250. ✓",
  "m-f-03":"Simple interest is calculated on the ORIGINAL $800 every year — it never grows.\nOne year: 800 × 0.03 = $24\nTwo years: 24 × 2 = $48\nAnswer: $48.\nThe question asked for the interest earned, not the final balance ($848).",
  "m-f-04":"Compound means each year's interest is added, then the next year is calculated on the new balance.\nYear 1: 1000 × 1.05 = $1050\nYear 2: 1050 × 1.05 = $1102.50\nAnswer: $1102.50.\nSimple interest would have given $1100 — the extra $2.50 is interest earned on the first year's interest.",
  "m-f-05":"With simple interest, the interest is always worked out on the starting amount, so you earn the same every year.\nWith compound interest, the interest is added to the balance, so next year's calculation starts from a bigger number — and the gap widens every year.\nAnswer: interest is earned on interest already added, not just on the original amount.\nThe rate itself does not change, and taxes have nothing to do with it.",
  "m-f-06":"Get both down to the price of ONE bar.\n$5.40 ÷ 3 = $1.80 each\n$8.75 ÷ 5 = $1.75 each\n$1.75 < $1.80\nAnswer: 5 for $8.75.\nThe bigger pack costs more in total but less per bar — total price alone never answers a value question.",
  "m-f-07":"Two steps, in this order.\nDiscount first: 25% off means you pay 75%. 48 × 0.75 = $36.00\nThen tax on the SALE price: 36 × 1.13 = $40.68\nAnswer: $40.68.\nTax is charged on what you actually pay, so taking the discount first matters. Adding 13% to $48 first would overcharge you.",
  "m-f-08":"Work out both totals for the same usage — 6 transactions.\nAccount A: flat $4.00, no matter how many → $4.00\nAccount B: 6 × $0.75 = $4.50\n$4.00 < $4.50, so A wins by $0.50.\nAnswer: Account A, by $0.50.\nWorth noticing: at 5 transactions they tie, and below 5 Account B is cheaper. The better account depends on how you use it.",
  "m-f-09":"Ask what each source gains if you follow its advice.\nA sponsored video from a lender: they profit from your loan → not neutral.\nA social media comment: anonymous, no accountability.\nAn ad promising fast returns: marketing, and a classic warning sign.\nA bank's education site or a government consumer agency: regulated, accountable, no direct stake in your individual choice ✓\nAnswer: the financial guide from a bank's education site or a government consumer agency.",
  "m-f-10":"Do the maths first: $240 ÷ $15 = 16 weeks on plan.\nAt $8 a week: 240 ÷ 8 = 30 weeks — nearly double.\nNow check the options: an automatic transfer protects the deposit, tracking keeps you honest, and telling a friend adds accountability. All three help.\nOnly the unplanned spending reduces what actually goes in.\nAnswer: unplanned spending cutting the weekly deposit to $8.",

  /* ===== science: ecosystems ===== */
  "s-b-01":"Abiotic means never living. Test each:\nFrogs — alive ✗\nAlgae — alive (a producer) ✗\nWater temperature — a physical condition, never alive ✓\nBacteria — alive ✗\nAnswer: water temperature.\nOther abiotic factors in a pond: sunlight, dissolved oxygen, pH, depth.",
  "s-b-02":"A decomposer breaks down dead material and returns nutrients to the soil.\nHawk eating a mouse — consumer ✗\nFungus breaking down a fallen log — decomposer ✓\nMaple tree making sugar from sunlight — producer ✗\nDeer eating leaves — consumer (herbivore) ✗\nAnswer: the fungus.\nWithout decomposers, nutrients would stay locked in dead matter and the cycle would stop.",
  "s-b-03":"In a food chain, the arrow always points from the organism being eaten TO the organism eating it — because that is the direction the energy travels.\ngrass → grasshopper means energy moves from the grass into the grasshopper.\nAnswer: the direction energy is transferred.\nA common misreading is 'eats' pointing at the prey — that is backwards.",
  "s-b-04":"Trace outward from the missing link in BOTH directions.\nFrogs eat grasshoppers. Fewer frogs → less predation → grasshopper numbers rise.\nSnakes eat frogs. Fewer frogs → less food → snake numbers fall.\nGrass would come under more pressure from the extra grasshoppers, but not vanish immediately.\nAnswer: grasshoppers increase and snakes decrease.",
  "s-b-05":"Matter is not created or destroyed — the same atoms are reused endlessly.\nCarbon moves air → plant → animal → decomposer → back to air and soil.\nThat reuse is what lets an ecosystem keep going without a fresh supply of raw material, which is what sustainability means here.\nAnswer: the same nutrients are reused again and again rather than running out.\nEnergy is the opposite: it flows through once and is lost as heat, which is why sunlight has to keep arriving.",
  "s-b-06":"The single deciding question: was there soil to begin with?\nGlacier-scraped bare rock has no soil, so the process starts from nothing — lichens break down rock into the first thin soil, then mosses, then plants.\nThat is PRIMARY succession, and it takes a very long time.\nAnswer: primary succession.\nSecondary succession is what follows a fire or an abandoned farm, where soil and seeds survive — much faster.",
  "s-b-07":"Populations grow until something runs short. Whatever runs short is a limiting factor — food, water, shelter, space, or disease.\nThe number the ecosystem can support long-term is its carrying capacity.\nAnswer: carrying capacity.\nBiodiversity is the variety of species; biomass is the total mass of living material — related ideas, but not what the question describes.",
  "s-b-08":"Planting one crop repeatedly is monoculture. Trace what it changes:\nHabitat variety drops → fewer species, including pollinators and pest predators.\nA pest specialized to that crop meets an unbroken food supply and spreads easily.\nThe same soil nutrients get drawn down year after year.\nAnswer: reduced biodiversity and greater vulnerability to a single pest or disease.\nRestoring strategies: crop rotation, cover crops, mixed planting, buffer strips.",
  "s-b-09":"Mitigating means reducing the harm at its source, not just moving it around.\nSalting more often does not reduce total salt.\nWidening roads and plowing later do not change how much salt reaches the creek.\nCalibrated spreaders and pre-wetting achieve the same de-icing with less salt — less salt applied means less running into the water.\nAnswer: calibrated spreaders and pre-wetting.",
  "s-b-10":"Two-Eyed Seeing is an approach credited to Mi'kmaw Elder Albert Marshall: learning to see with the strengths of Indigenous knowledges in one eye and the strengths of Western science in the other, using both together.\nIt is not about choosing between them or ranking one above the other.\nAnswer: bringing Indigenous knowledge and Western science together, using the strengths of both.\nExample in practice: cultural burning, long used by many First Nations, is now studied by fire scientists for reducing wildfire risk.",

  /* ===== science: matter ===== */
  "s-c-01":"The four ideas of particle theory:\n1. All matter is made of tiny particles.\n2. All particles of one pure substance are identical; different substances have different particles.\n3. Particles are always moving, and move faster when heated.\n4. There is space between particles, and they attract each other.\nSo: particles in a solid vibrate — they are not motionless. Heating makes particles move faster and spread apart; the particles themselves do not expand. Gas particles are not heavier.\nAnswer: all particles of one substance are identical, and they are always moving.",
  "s-c-02":"A pure substance is one kind of particle throughout — an element or a compound.\nOcean water: water + dissolved salts and minerals → mixture\nDistilled water: water only, everything else removed → pure ✓\nAir: nitrogen, oxygen, argon, CO₂ → mixture\nSteel: iron plus carbon and other metals → mixture (an alloy)\nAnswer: distilled water.",
  "s-c-03":"Heterogeneous means the different parts can be told apart.\nSalt in water: dissolves completely, looks the same throughout → homogeneous\nItalian dressing that separates: oil and vinegar visibly split → heterogeneous ✓\nClear apple juice: uniform → homogeneous\nAir: uniform mixture of gases → homogeneous\nAnswer: Italian salad dressing.\nEvery solution is homogeneous by definition — that is what dissolving means.",
  "s-c-04":"Three things speed up dissolving, all by increasing contact between particles:\nHeating — particles move faster and collide more.\nStirring — brings fresh solvent to the solute.\nCrushing into smaller pieces — more surface exposed.\nColder water slows it. Larger crystals slow it. Adding more sugar does not make it dissolve faster.\nAnswer: stirring the mixture.",
  "s-c-05":"A saturated solution is holding all the solute it can at that temperature — add more and it sits undissolved at the bottom.\nAnswer: no more solute will dissolve at that temperature.\nTemperature matters: warming the solvent usually raises how much can dissolve, so a saturated solution can become unsaturated simply by heating it.",
  "s-c-06":"Water dissolves a wider range of substances than almost any other liquid, which is why it earned the nickname.\nBut it is a nickname, not a fact — oil, wax and many plastics do not dissolve in water at all.\nAnswer: it dissolves a very wide range of substances, more than most other liquids.\nThis property is why water carries nutrients through your body, and also why it carries pollutants through an ecosystem.",
  "s-c-07":"The salt is DISSOLVED, so a filter will not catch it — the particles pass straight through the paper.\nDistillation boils the water off, then cools the vapour back into liquid in a separate container. You recover both the salt (left behind) and the water (condensed).\nAnswer: distillation.\nPlain evaporation would also leave the salt, but the water escapes as vapour and is lost — the question asked to recover the water too.",
  "s-c-08":"Look for a physical property that differs. Iron is magnetic; sand is not.\nHold a magnet over the mixture and the iron filings jump to it, leaving the sand.\nAnswer: a magnet.\nEvaporation needs a dissolved substance, chromatography separates dissolved dyes, and neither sand nor iron dissolves in water.",
  "s-c-09":"A compound contains two or more DIFFERENT kinds of atom chemically joined.\nCopper (Cu) — one kind of atom → element\nOxygen (O₂) — two atoms, but both oxygen → still an element\nCarbon dioxide (CO₂) — carbon AND oxygen → compound ✓\nGold (Au) — one kind of atom → element\nAnswer: carbon dioxide.\nThe test is how many different capital letters appear in the formula, not how many atoms.",
  "s-c-10":"Assessing means weighing real costs and benefits, not just describing the product.\nThe metals in a phone are mined, often in small quantities from large amounts of ore — that means habitat disruption, water use, and effects on the health and rights of nearby communities. At end of life, e-waste can leach into soil and water.\nAnswer: mining and disposal can damage ecosystems and affect the health and rights of communities near those sites.\nA strong answer names the whole life cycle: extraction, use, and disposal.",

  /* ===== science: structures ===== */
  "s-d-01":"A solid structure is made from a solid mass of material and relies largely on its own weight to do its job. A dam holds back water precisely because it is a heavy, solid wall.\nFrame structure: a skeleton of joined parts (bicycle, roof truss).\nShell structure: a thin curved outer layer (egg, canoe, dome).\nAnswer: solid structure.",
  "s-d-02":"A structure tips when its centre of gravity passes outside its base.\nSitting low means the centre of gravity is low, so the car can lean a long way before that happens. A wide track adds to the effect by widening the base.\nAnswer: to lower its centre of gravity and make it more stable in turns.\nSitting low does not change the car's mass at all.",
  "s-d-03":"To describe a force completely you need four things:\nMagnitude — how big, in newtons.\nDirection — which way it acts.\nPoint of application — exactly where on the structure.\nPlane of application — the plane it acts in.\nThe missing one here is direction.\nAnswer: direction.",
  "s-d-04":"A static (dead) load is constant and permanent — it does not change from moment to moment. The bridge's own beams and deck are always there, always weighing the same.\nDynamic (live) loads vary: traffic, crowds, wind, snow, earthquakes.\nAnswer: static load.\nEngineers design for both, but dynamic loads are harder because they change and can build up rhythmically.",
  "s-d-05":"No single bend broke the bracket — that rules out simple overloading.\nRepeated loading below the breaking strength creates microscopic cracks that grow slightly with every cycle until the remaining metal cannot carry the load. That is metal FATIGUE.\nAnswer: metal fatigue.\nCorrosion is chemical damage, torsion is twisting, and buckling is sudden collapse under compression — none of them describes damage accumulating over many cycles.",
  "s-d-06":"Picture the beam bending downward into a shallow U.\nThe top surface is being pushed inward — the material is squeezed → COMPRESSION.\nThe bottom surface is being pulled outward — the material is stretched → TENSION.\nAnswer: compression on top, tension on the bottom.\nThis is why steel reinforcing bars in a concrete beam sit near the bottom: concrete is strong in compression but weak in tension, so the steel handles the stretching.",
  "s-d-07":"A symmetrical design shares the load evenly on both sides of the centre line, so neither side carries much more than the other. It also makes the forces easier to calculate and the structure easier to build.\nAnswer: it helps distribute forces evenly so no one side carries much more load.\nAsymmetric structures can work, but they need counterweights or extra anchoring to balance.",
  "s-d-08":"Suitability depends on the conditions the material will face — there is no single 'best' material.\nAn Ontario bench faces rain, snow, road salt and dozens of freeze-thaw cycles a year. Water that soaks in and then freezes expands and splits the material apart.\nAnswer: its resistance to moisture and freeze-thaw cycles.\nStrength on day one means nothing if the material rots or cracks in two seasons.",
  "s-d-09":"Keeping a structure safe over time means finding problems before they become failures.\nScheduled inspections look for cracks, corrosion, deflection and loose fasteners, and compare measurements against previous years — a crack that GREW is the signal.\nAnswer: scheduled inspections looking for cracks, corrosion and deflection.\nPaint, railings and speed limits do not tell you anything about the structure's condition.",
  "s-d-10":"Ergonomic design fits the object to the human body so it can be used without strain.\nThe markers of good posture: screen at eye level (neutral neck), back supported, feet flat on the floor, wrists straight.\nAnswer: screen at eye level with the chair adjusted so feet rest flat.\nA smaller desk, a bed, or a dark room all make the position or the visibility worse.",

  /* ===== science: heat ===== */
  "s-e-01":"Heat is energy of particle motion. In a solid, particles are locked in position but vibrating.\nAdd heat and they vibrate faster and harder, pushing each other slightly further apart — which is why solids expand when heated.\nAnswer: they vibrate faster and move slightly further apart.\nThe particles themselves never get bigger and never change into something else. That is the misconception this question is checking.",
  "s-e-02":"Concrete expands as it warms and contracts as it cools.\nOn a hot day a long deck grows measurably longer. With nowhere to go, the sections would press against each other hard enough to crack or buckle upward.\nExpansion joints leave room for that movement.\nAnswer: to allow for thermal expansion in hot weather.\nThe same reasoning explains gaps in railway tracks and loops in long pipelines.",
  "s-e-03":"The spoon is in direct contact with the hot soup. Energy passes from particle to particle along the metal, without the metal itself flowing anywhere.\nThat is conduction, and metals are especially good at it.\nAnswer: conduction.\nConvection needs a moving fluid; radiation needs no contact at all. Here the contact is the whole point — which is why pot handles are wood or plastic, poor conductors.",
  "s-e-04":"Air warmed by the heater becomes less dense and rises. Cooler, denser air sinks to take its place, gets warmed in turn, and rises — a continuous circulating loop called a convection current.\nPut the heater at the floor and that loop sweeps the whole room. Put it at the ceiling and the warm air simply stays up there with nothing to drive circulation.\nAnswer: warm air rises and cool air sinks, setting up a convection current.",
  "s-e-05":"Radiation travels as waves and needs no material to pass through — which is how the Sun's energy crosses empty space to reach us.\nHow much a surface absorbs depends on its colour and finish: dark, dull surfaces absorb more; light, shiny surfaces reflect more.\nThe black container absorbs more of the Sun's radiation, so its water warms faster.\nAnswer: the black one warms faster, because dark surfaces absorb more radiation.",
  "s-e-06":"While ice is melting, the energy you add goes into breaking the attractions holding particles in place — not into speeding them up.\nTemperature measures how fast particles move, so it does not rise while the state is changing. The graph shows a flat plateau at 0°C until all the ice has melted, then starts climbing again.\nAnswer: a flat section, because the energy is going into changing state.\nThe same plateau appears at 100°C during boiling.",
  "s-e-07":"Follow the energy. Sunlight passes through the atmosphere and warms Earth's surface. The warmed surface radiates that energy back outward as infrared.\nGreenhouse gases absorb some of that outgoing infrared and re-radiate it in all directions — including back down — so it takes longer to escape to space and the atmosphere stays warmer.\nAnswer: they absorb and re-radiate heat radiated from Earth's surface, keeping more of it in the atmosphere.\nThey do not block incoming sunlight — that is the part people usually get backwards.",
  "s-e-08":"Burning fossil fuels — gasoline in vehicles, natural gas for heating, coal for electricity — releases carbon dioxide that had been locked underground for millions of years.\nAnswer: burning fossil fuels for transportation and heating.\nOther significant human sources: methane from landfills and livestock, and nitrous oxide from some fertilizers. Planting trees does the opposite — it removes CO₂.",
  "s-e-09":"Insulation traps still air, which conducts heat poorly, so less heat escapes through the attic.\nLess heat lost means the furnace runs less. That is less fuel or electricity burned, which lowers the bill AND lowers emissions — a benefit in two dimensions, which is what 'social and environmental' is asking for.\nAnswer: less energy is needed for heating, which lowers both costs and emissions.\nNote that insulation SLOWS conduction; it never stops it completely.",
  "s-e-10":"Renewable sources replenish on a human timescale; non-renewable ones do not.\nWind — renewable ✓ | Natural gas — formed over millions of years, non-renewable ✓\nThe other options all place a fossil fuel in the renewable slot or a renewable in the non-renewable slot.\nAnswer: wind (renewable), natural gas (non-renewable).\nOther renewables: solar, hydro, geothermal, tidal. Other non-renewables: coal, oil, uranium.",

  /* ===== language: conventions ===== */
  "l-c-01":"A semicolon joins two COMPLETE sentences. Test each option by covering the semicolon:\n'The rink was closed' ✓ / 'so we went home' — needs the 'so', and the semicolon already does that job ✗\n'The rink was closed' ✓ / 'we went home' ✓ — both stand alone ✓\n'and dark' — a fragment ✗\n'because of the storm' — a fragment ✗\nAnswer: The rink was closed; we went home.",
  "l-c-02":"A colon introducing a quotation must follow a COMPLETE sentence.\n'Coach said' — not a complete sentence ✗\n'Her rule was simple' — subject and verb, stands alone ✓\n'She asked' — not complete ✗\n'We packed' — not complete before the list ✗\nAnswer: Her rule was simple: “Late is a decision.”\nWith an incomplete lead-in like 'Coach said', use a comma instead: Coach said, “Be early.”",
  "l-c-03":"However is a conjunctive ADVERB, not a conjunction — it cannot hold two sentences together with only a comma. That error is called a comma splice.\nJoining two independent clauses: semicolon before, comma after.\n'The bus was late' + 'we still made it' are both complete, so:\nAnswer: The bus was late; however, we still made it.\nSplitting into two sentences also works: The bus was late. However, we still made it.",
  "l-c-04":"'With a quick glove save' modifies the verb stopped — it tells HOW the goalie stopped the puck. That makes it adverbial.\nTest by moving it: 'With a quick glove save, the goalie stopped the puck.' Still works ✓\nAnswer: an adverbial phrase.\nA predicate noun or adjective would follow a linking verb, and an indirect object would answer 'to whom' — neither fits here.",
  "l-c-05":"Find the verb: handed.\nHanded WHAT? the map → direct object.\nHanded to WHOM? her brother → indirect object ✓\nAnswer: indirect object.\nThe giveaway is the position: an indirect object sits between the verb and the direct object, with no preposition in front of it.",
  "l-c-06":"Felt is a linking verb here — it connects the subject to a description rather than showing an action done to something.\n'Slick' describes the ice (the subject), so it is a predicate adjective.\nAnswer: predicate adjective.\nIf it renamed the subject with a noun — 'The ice was a hazard' — that would be a predicate noun.",
  "l-c-07":"A complex sentence needs one independent clause plus at least one SUBORDINATE clause.\n'Mira checked the time and zipped her bag' — one subject, two verbs, no subordinate clause → simple ✗\n'Because the snow was falling hard, Mira checked the time' — 'Because…' cannot stand alone ✓ → complex ✓\n'Mira checked the time; the bus was late' — two independent clauses → compound ✗\n'Mira checked the time' → simple ✗\nAnswer: Because the snow was falling hard, Mira checked the time.",
  "l-c-08":"You want ONE complex sentence, so one part has to become a subordinate clause.\nAdding 'and' makes it compound, not complex ✗\nAdding 'When' turns the first idea into a subordinate clause AND shows the time relationship ✓\nA comma alone between two complete sentences is a comma splice ✗\nA semicolon makes it compound ✗\nAnswer: When the truck slowed down, Mira recognized her neighbour.",
  "l-c-09":"A dash marks a sudden break, an interruption, or an emphatic pause. Here the sentence stops short at the moment she stops — the punctuation performs the hesitation.\nAnswer: to mark a sudden break or pause for effect.\nAn ellipsis (…) is what shows words omitted from a quotation or a voice trailing off. Different mark, different job.",
  "l-c-10":"'Shivering' is built from the verb shiver but it is not the sentence's action — 'checked' is. Instead it describes Mira.\nA verb form working as a describing word is a participle.\nAnswer: a participle acting as a modifier.\nIf it were part of the verb it would need a helper: 'Mira WAS shivering at the bus stop.'",

  /* ===== language: reading ===== */
  "l-r-01":"The rule 'Late is a decision' is printed on every sheet the coach hands out — she knows it well. It surfaces in her mind at the exact moment she realizes she might be late through no fault of her own.\nThat tension is the point: the rule treats lateness as a choice, and she can feel it being applied to a situation she did not choose.\nAnswer: she is worried that arriving late will be judged as her own choice, not bad luck.\nNothing in the passage suggests quitting, forgetting the time, or planning an excuse.",
  "l-r-02":"'Fools people into thinking it is harmless' does the work. The snow is described as deceptive — pretending to be one thing while being another.\nA neutral description ('the snow fell lightly') would carry none of that warning.\nAnswer: to create tension by hinting the snow is more of a threat than it appears.\nThis is foreshadowing delivered through word choice: the reader is told to worry before Mira admits she is worried.",
  "l-r-03":"Check the pronouns: 'Mira had run the numbers', 'her stick bag', 'She thought about' — third person, not I or you.\nNow check whose mind you can enter. You get Mira's calculations and her thoughts about the coach's rule. You get nothing from inside the sighing woman or Mr. Okafor — only what they do and say.\nOne character's thoughts = LIMITED.\nAnswer: third person, limited to Mira.",
  "l-r-04":"Sighing does nothing to make a bus arrive. The narrator describes it 'as though sighing were a form of transit' — pointing out the gap between what the woman is doing and what would actually help.\nStating that gap dryly, without commenting further, is verbal irony used for humour.\nAnswer: irony used for a wry, humorous effect.\nForeshadowing would hint at a later event; symbolism would make the sighing stand for a larger idea. Neither is happening here.",
  "l-r-05":"Track the shape of the whole passage: a careful plan (eleven minutes is enough) → a disruption she did not control (the snow) → an unexpected rescue (the neighbour's truck).\nAn answer that covers all three parts is the main idea.\nAnswer: a careful plan is disrupted by something outside a character's control, and rescued by an unexpected offer of help.\nWatch out for 'she misses her tryout' — the passage never says that. She gets in the truck; the outcome is left open.",
  "l-r-06":"The article does three things: says what the escarpment is (a long rock ridge), explains how it formed (hard dolostone resisting erosion), and explains why it stayed forested (too steep to farm or build on).\nThe main idea has to hold all of that together.\nAnswer: it is a long rock ridge shaped by erosion, and its steep slope helped preserve it.\n'A mountain range' contradicts the text outright — the article says it was not pushed up. Dolostone hardness and the UNESCO designation are supporting details, not the main point.",
  "l-r-07":"The article states it directly: the escarpment 'is the edge of a much older layer of hard rock — dolostone — that has resisted erosion while the softer shale and sandstone beneath it wore away.'\nIt also rules out an alternative in the same paragraph: 'it was not pushed up.'\nAnswer: a hard layer of dolostone resisted erosion while softer rock beneath it wore away.\nWhen the text states something explicitly, match the wording rather than picking what sounds geologically plausible.",
  "l-r-08":"The text gives you a reason the slope was left alone: it is 'difficult to farm and expensive to build on'. It never says conservation was the motive.\nCombine that with what you know — people clear land when it pays to clear it — and the inference follows: the forest survived largely because clearing it was not worth the cost.\nAnswer: the land was left alone largely for practical and economic reasons, not only for conservation ones.\nThe UNESCO designation came in 1990, long after the forest had already survived.",
  "l-r-09":"Look at purpose and features rather than subject.\nNo characters, no plot → not narrative.\nNo argument, nothing it wants you to agree with → not persuasive.\nNo steps to follow → not procedural.\nIt explains a topic using facts and examples → expository ✓\nAnswer: expository.",
  "l-r-10":"The second paragraph sets up a cause and traces its result: the hard dolostone resisted erosion WHILE the softer rock beneath wore away, and the RESULT is 'a long step in the landscape'.\nThat is cause and effect.\nAnswer: cause and effect.\nNo dates or sequence (not chronological), no problem being solved, no questions posed.",

  /* ===== language: critical thinking ===== */
  "l-t-01":"An early detail is planted — the canoe leaks — and it looks minor at the time. Five chapters later it becomes the thing that sinks the boat.\nA hint dropped early that prepares the reader for a later event is foreshadowing.\nAnswer: foreshadowing.\nSymbolism would mean the canoe stands for a bigger idea; a flashback looks backward in time. Neither describes planting a clue ahead of the payoff.",
  "l-t-02":"One mention of a watch is just an object. Appearing at EVERY hard decision is a deliberate pattern, and the pattern is the signal that it carries meaning.\nIt belonged to the grandmother, and it shows up when the character must choose — so it stands for what has been handed down to her and what she owes it.\nAnswer: a symbol of inherited responsibility.\nA red herring misleads, a simile compares using like or as, and an adverbial phrase is a grammar term — none apply.",
  "l-t-03":"Separate what can be checked from what is being judged.\n'Voted 6–3' — verifiable ✓\n'Construction begins in April' — verifiable ✓\n'Two residents spoke against' — verifiable ✓\n'Only a handful of stubborn holdouts opposed the obviously necessary arena' — 'stubborn', 'holdouts' and 'obviously necessary' are all judgements dressed as reporting ✗\nAnswer: the sentence about stubborn holdouts.\nLoaded words are the fingerprint of bias.",
  "l-t-04":"Two fixes are needed. Strip the loaded words — 'stubborn holdouts' becomes 'residents who opposed it'; 'obviously necessary' becomes a statement of what the proposal is. Then include the actual reasons the opponents gave, so readers can weigh the issue themselves.\nAnswer: replace the loaded words with neutral description and include the reasons the opponents gave.\nAdding equally loaded language for the other side does not fix bias — it doubles it. And deleting the sentence removes information rather than reporting it fairly.",
  "l-t-05":"Each text feature has a job. A bibliography lists the sources the writer used, which lets a reader go check them and judge whether the claims hold up.\nAnswer: to list the sources the writer used, so readers can verify and follow up.\nA glossary defines difficult words; a summary or abstract condenses the ideas; acknowledgements thank people. Naming the right job is what the question is testing.",
  "l-t-06":"A phone-shaped bar that grows with each age group is instantly readable — you grasp the comparison before reading a single number. That is the strength.\nThe risk is that scaling a picture makes it taller AND wider, so doubling the height quadruples the area the eye actually sees. The gap looks bigger than the data supports.\nAnswer: it makes the comparison instantly readable, though the shape can also exaggerate the difference.\nA strong answer names both the contribution and the distortion.",
  "l-t-07":"'Gathered' and 'swarmed' describe the same event. Swarmed carries connotations of insects, threat and disorder; gathered sounds calm and ordinary.\nNeither report is factually false — the difference is entirely in the feeling the word carries.\nAnswer: word choice shaping the reader's impression.\nThis is connotation at work, and it is one of the quietest ways a text steers you.",
  "l-t-08":"Two agreeing sources are not automatically right — they may both be repeating a single original claim, which makes them one source, not two.\nThe method is to check each one: who created it, when, what evidence it offers, and what they gain from the claim.\nAnswer: check who created each source, when, and what evidence each one offers.\nGoing with the majority is counting, not evaluating — and discarding all three throws away work you have already done.",
  "l-t-09":"Separate topic from message. The topic is accessibility features in a school. The message is what the film SAYS about that topic.\nBy pairing the changes with three students moving through an ordinary day, the film shows accessibility deciding who can actually take part — not as an add-on but as the condition for participation.\nAnswer: accessibility as something that changes who can fully take part.\nA message should be a claim you could agree or disagree with, not just a subject heading.",
  "l-t-10":"Predicting is a way of monitoring your own understanding, not a contest to be right first time.\nWhen chapter ten contradicts your prediction, the useful move is to revise it AND notice which clue misled you — that second part is what improves your reading.\nAnswer: adjust the prediction to fit the new evidence and note what caused the change.\nIgnoring evidence defeats the purpose, and skipping to the end skips the thinking."
};

  {id:"fd-11", subj:"math", topic:"fracdec", code:"B2.6", type:"mc",

  /* ============ SCIENCE — ECOSYSTEMS (current unit) ============ */
  {id:"eco-01", subj:"science", topic:"ecosystems", code:"B2.1", type:"mc",
   q:"Which statement best describes an ecosystem?",
   choices:["A network of interactions among living organisms and their environment","A group of animals of the same species","All the plants growing in one area","The weather conditions of a region"], a:0,
   why:"An ecosystem includes the living things, the non-living surroundings, AND the interactions that connect them. A group of one species is a population."},
  {id:"eco-02", subj:"science", topic:"ecosystems", code:"B2.1", type:"mc",
   q:"Which of these is an interaction between a BIOTIC and an ABIOTIC part of an ecosystem?",
   choices:["A tree's roots drawing water up from the soil","A wolf hunting a deer","Two birds competing for a nesting site","Rain falling onto a rock"], a:0,
   why:"The tree is living and the water and soil are non-living, so that crosses the biotic–abiotic line. Wolf/deer and bird/bird are biotic–biotic; rain on rock is abiotic–abiotic."},
  {id:"eco-03", subj:"science", topic:"ecosystems", code:"B2.2", type:"mc",
   q:"Which list contains ONLY abiotic factors?",
   choices:["Sunlight, soil pH, air temperature","Sunlight, soil pH, earthworms","Water, moss, temperature","Oxygen, bacteria, rainfall"], a:0,
   why:"Earthworms, moss and bacteria are all living, which makes the other lists mixed. Abiotic means never living."},
  {id:"eco-04", subj:"science", topic:"ecosystems", code:"B2.2", type:"mc",
   q:"A region gets far less rainfall than usual for two years. What is the most likely chain of effects?",
   choices:["Fewer plants grow, so herbivores have less food and their numbers fall","Plants grow faster because there is more sunlight","Only the abiotic parts are affected","Decomposers increase because the soil is dry"], a:0,
   why:"An abiotic change ripples through the biotic parts. Less water limits plant growth, which limits the herbivores that depend on them, and then their predators."},
  {id:"eco-05", subj:"science", topic:"ecosystems", code:"B2.2", type:"mc",
   q:"Dead leaves lying on a forest floor are classified as:",
   choices:["Biotic, because they came from a living organism","Abiotic, because they are no longer alive","Neither biotic nor abiotic","Abiotic, because they are on the ground"], a:0,
   why:"Biotic covers things that are living OR were once living, including dead material and waste. That matter is exactly what decomposers work on."},
  {id:"eco-06", subj:"science", topic:"ecosystems", code:"B2.3", type:"mc",
   q:"In a pond ecosystem, which organism is the PRODUCER?",
   choices:["Algae","Tadpole","Heron","Pond snail"], a:0,
   why:"Producers make their own food using sunlight through photosynthesis. Everything else in the list has to eat something."},
  {id:"eco-07", subj:"science", topic:"ecosystems", code:"B2.3", type:"mc",
   q:"What would happen to an ecosystem if all its decomposers disappeared?",
   choices:["Dead material would pile up and nutrients would stay locked inside it","Plants would grow faster with less competition","Nothing — decomposers only matter in soil","Predators would increase"], a:0,
   why:"Decomposers release nutrients from dead matter back into the soil. Without them the nutrient cycle stalls and producers eventually run short."},
  {id:"eco-08", subj:"science", topic:"ecosystems", code:"B2.3", type:"mc",
   q:"In the chain lettuce → rabbit → fox, the rabbit is the:",
   choices:["Primary consumer","Producer","Secondary consumer","Decomposer"], a:0,
   why:"The primary (first) consumer eats the producer. The fox, which eats the rabbit, is the secondary consumer."},
  {id:"eco-09", subj:"science", topic:"ecosystems", code:"B2.4", type:"mc",
   q:"What does a food WEB show that a food CHAIN does not?",
   choices:["That most organisms eat and are eaten by several different species","The exact number of each animal","How fast energy moves","Which species is most important"], a:0,
   why:"A chain is one straight path. A web layers many chains together, showing that most species have several food sources and several predators — which is why real ecosystems are harder to disturb than a single chain suggests."},
  {id:"eco-10", subj:"science", topic:"ecosystems", code:"B2.4", type:"mc",
   q:"Roughly how much of the energy at one level of a food chain is passed on to the next level?",
   choices:["About 10%","About 50%","About 90%","All of it"], a:0,
   why:"Around 90% of the energy is used for the organism's own living and lost as heat, so only about 10% is available to whatever eats it. That is why food chains rarely have more than four or five links."},
  {id:"eco-11", subj:"science", topic:"ecosystems", code:"B2.4", type:"num",
   q:"Producers in a meadow capture 10 000 units of energy. Using the 10% rule, how many units reach the SECONDARY consumers?", a:100,
   why:"10% of 10 000 is 1000 at the primary consumers, and 10% of that is 100 at the secondary consumers."},
  {id:"eco-12", subj:"science", topic:"ecosystems", code:"B2.4", type:"mc",
   q:"In a food WEB, a disease wipes out one species of insect. Compared with a single food chain, what is the likely result?",
   choices:["Other species are affected, but predators with alternative prey can survive the loss","Nothing at all changes","The whole web collapses immediately","Only plants are affected"], a:0,
   why:"That is the value of a web: alternative food sources buffer the loss. A species with only one food source is far more vulnerable — which is why biodiversity makes an ecosystem more resilient."},
  {id:"eco-13", subj:"science", topic:"ecosystems", code:"B2.4", type:"mc",
   q:"In the chain algae → insect larva → small fish → osprey, which organism is the TERTIARY consumer?",
   choices:["The osprey","The small fish","The insect larva","The algae"], a:0,
   why:"Count up from the producer: algae (producer), larva (primary), small fish (secondary), osprey (tertiary)."},
  {id:"eco-14", subj:"science", topic:"ecosystems", code:"B2.5", type:"mc",
   q:"Which process returns water to the atmosphere directly from plants?",
   choices:["Transpiration","Condensation","Precipitation","Infiltration"], a:0,
   why:"Transpiration is water evaporating from leaves. Condensation forms clouds, precipitation brings water down, and infiltration soaks it into the ground."},
  {id:"eco-15", subj:"science", topic:"ecosystems", code:"B2.5", type:"mc",
   q:"Which process REMOVES carbon dioxide from the air?",
   choices:["Photosynthesis","Cellular respiration","Combustion","Decomposition"], a:0,
   why:"Plants take in CO₂ to build sugars. Respiration, burning and decomposition all release it — which is why cutting forests and burning fuels push the balance one way."},
  {id:"eco-16", subj:"science", topic:"ecosystems", code:"B2.5", type:"mc",
   q:"Nitrogen makes up most of the air, yet plants cannot use it straight from the atmosphere. What makes it available to them?",
   choices:["Bacteria convert nitrogen into forms plants can absorb","Sunlight breaks it down in the leaves","It dissolves directly into the roots","Wind blows it into the soil"], a:0,
   why:"Nitrogen-fixing bacteria, many living in the roots of legumes like clover and beans, convert atmospheric nitrogen into usable compounds. It is why crop rotation with legumes restores soil."},
  {id:"eco-17", subj:"science", topic:"ecosystems", code:"B2.6", type:"mc",
   q:"A forest burns, but the soil and many seeds survive. Grasses appear the following spring, then shrubs, then young trees. This is:",
   choices:["Secondary succession","Primary succession","Eutrophication","Carrying capacity"], a:0,
   why:"Soil survived, so this is secondary succession — much faster than starting from bare rock, because the seed bank and nutrients are already in place."},
  {id:"eco-18", subj:"science", topic:"ecosystems", code:"B2.6", type:"mc",
   q:"Which organisms are typically the PIONEER species on bare rock?",
   choices:["Lichens and mosses","Maple trees","Grasses and wildflowers","Shrubs"], a:0,
   why:"Lichens can live on bare rock and slowly break it down, creating the first thin layer of soil. Only then can mosses, grasses and eventually trees take hold."},
  {id:"eco-19", subj:"science", topic:"ecosystems", code:"B2.6", type:"mc",
   q:"What does it mean when an ecosystem reaches a stable, mature stage of succession?",
   choices:["The mix of species stays relatively steady unless something disturbs it","No new organisms are ever born","All succession stops permanently","Only one species remains"], a:0,
   why:"A mature community is in a rough balance — species are still living and dying, but the overall makeup holds steady until a disturbance like fire, storm or clearing resets it."},
  {id:"eco-20", subj:"science", topic:"ecosystems", code:"B2.7", type:"mc",
   q:"A deer population grows past what its woodland can support. What happens next?",
   choices:["Competition for food increases and the population falls back","The carrying capacity rises to match","The deer become producers","Nothing — populations can grow without limit"], a:0,
   why:"Beyond carrying capacity there is not enough food, water or shelter. Competition, hunger and disease bring the numbers back down, often overshooting downward before settling."},
  {id:"eco-21", subj:"science", topic:"ecosystems", code:"B2.7", type:"mc",
   q:"Which is a limiting factor for fish living in a lake?",
   choices:["The amount of dissolved oxygen in the water","The colour of the lake bed","The number of clouds overhead","The name of the lake"], a:0,
   why:"Dissolved oxygen is a genuine constraint — when it drops, fish suffocate. Limiting factors can be abiotic (oxygen, temperature, space) or biotic (food, predators, disease)."},
  {id:"eco-22", subj:"science", topic:"ecosystems", code:"B2.8", type:"mc",
   q:"A fishery catches fish faster than they can reproduce for many years. What is the likely outcome, and what strategy addresses it?",
   choices:["The stock collapses; catch limits and protected seasons let it recover","The fish grow larger; no action is needed","Other species disappear first; nothing can be done","The fish move deeper; deeper nets solve it"], a:0,
   why:"Harvesting beyond the replacement rate shrinks the breeding population until it cannot rebuild. Quotas, size limits and closed seasons are the standard tools for restoring balance."},
  {id:"eco-23", subj:"science", topic:"ecosystems", code:"B2.8", type:"mc",
   q:"A wetland was drained decades ago for farmland. Which action would best RESTORE the ecosystem?",
   choices:["Re-flooding the area and replanting native wetland species","Planting a single fast-growing crop","Adding fertilizer to the soil","Building a drainage ditch"], a:0,
   why:"Restoration means rebuilding the conditions the ecosystem needs — here, the water and the native plants that depend on it. Wetlands then filter water and provide habitat again."},
  {id:"eco-24", subj:"science", topic:"ecosystems", code:"B1.1", type:"mc",
   q:"A pesticide sprayed on crops is absorbed by insects, which are eaten by small birds, which are eaten by hawks. Where is the chemical found in the HIGHEST concentration?",
   choices:["In the hawks","In the insects","In the crops","It is equal at every level"], a:0,
   why:"This is bioaccumulation. Each predator eats many contaminated organisms and the chemical builds up in its body, so concentrations climb at each step of the chain — top predators carry the heaviest load."},
  {id:"eco-25", subj:"science", topic:"ecosystems", code:"B1.1", type:"mc",
   q:"Why can an invasive species spread so quickly in a new ecosystem?",
   choices:["It often has no natural predators or diseases there to keep its numbers down","It is always larger than native species","It reproduces only in winter","It cannot eat native food sources"], a:0,
   why:"In its home range, predators, parasites and competitors hold a species in check. Moved somewhere new without them, it can outcompete native species — zebra mussels in the Great Lakes are a local example."},
  {id:"eco-26", subj:"science", topic:"ecosystems", code:"B1.1", type:"mc",
   q:"A new highway is built through a forest. Beyond the trees removed, what is the main ecological impact?",
   choices:["Habitat fragmentation — animal populations are split and cut off from each other","The forest grows back thicker","Only noise levels change","Soil becomes more fertile"], a:0,
   why:"Fragmentation isolates populations, shrinks territory and blocks migration routes, which reduces genetic diversity over time. It is often a bigger problem than the area of trees actually cleared."},
  {id:"eco-27", subj:"science", topic:"ecosystems", code:"B1.2", type:"mc",
   q:"Which measure best MITIGATES the effect of a highway cutting through wildlife habitat?",
   choices:["Wildlife overpasses and underpasses that reconnect the two sides","Lowering the speed limit at night","Adding more streetlights","Planting flowers along the shoulder"], a:0,
   why:"Mitigation should address the actual harm. Crossings restore the connection between separated populations — the core problem — while also cutting collisions."},
  {id:"eco-28", subj:"science", topic:"ecosystems", code:"B1.3", type:"mc",
   q:"Many First Nations follow a principle of taking only what is needed and leaving enough for the population to renew itself. How does this support sustainability?",
   choices:["Harvesting stays within the ecosystem's ability to replenish, so the resource lasts","It increases the carrying capacity of the land","It removes the need for any monitoring","It applies only to plants"], a:0,
   why:"Harvesting at or below the replacement rate keeps the population stable indefinitely. It is the same principle that modern fisheries management arrived at through stock collapses."}
];

    "Expect a BIGGER answer when you divide by a fraction under 1."],
    ex:"Calculate 4/5 ÷ 2/3.\nKeep 4/5, change ÷ to ×, flip 2/3 to 3/2\n4/5 × 3/2 = 12/10\nSimplify by 2 → 6/5 = 1 1/5\n\nCheck the size: 2/3 is less than 1, so the answer should be bigger than 4/5 ✓"},
  "frac-divide-whole":{title:"Dividing with whole numbers and fractions", steps:[
    "Write the whole number over 1 so both are fractions.",
    "Then Keep–Change–Flip as usual.",
    "Whole ÷ fraction gives a bigger answer; fraction ÷ whole gives a smaller one.",
    "Read it as a question: 'how many of these fit into that?'"],
    ex:"Calculate 8 ÷ 2/5.\nHow many two-fifths fit into 8?\n8/1 × 5/2 = 40/2 = 20\n\nNow the other way: 2/5 ÷ 8\n2/5 × 1/8 = 2/40 = 1/20 — much smaller, as expected."},
  "frac-word":{title:"Fraction word problems", steps:[
    "'Of' almost always means multiply — 2/3 of a cup, half of the class.",
    "'How many fit', 'cut into pieces', 'shared equally' means divide.",
    "Before calculating, decide whether the answer should be bigger or smaller than what you started with.",
    "Check your answer against that prediction."],
    ex:"A board is 6 1/4 m long. How many 5/8 m pieces can be cut from it?\n'How many fit' → divide.\n6 1/4 = 25/4\n25/4 ÷ 5/8 = 25/4 × 8/5 = 200/20 = 10 pieces\nPrediction check: the pieces are small, so the count should be large ✓"},
  "frac-reason":{title:"Reasoning about size without calculating", steps:[
    "Multiplying by a fraction LESS than 1 makes the answer smaller than the starting number.",
    "Multiplying by a number greater than 1 makes it bigger.",
    "Dividing by a fraction less than 1 makes the answer BIGGER — because you are counting how many small pieces fit.",
    "Use this as a check on every fraction answer you get."],
    ex:"Predict, then check:\n2/3 × 15 → less than 15 (it is 10) ✓\n15 ÷ 2/3 → more than 15 (it is 22.5) ✓\n1 1/2 × 15 → more than 15 (it is 22.5) ✓"},
  "frac-area":{title:"Area with fractional sides", steps:[
    "Area of a rectangle is still length × width, even when the sides are fractions.",
    "Multiply straight across and simplify.",
    "The units are square units — m², cm².",
    "If both sides are under 1 m, the area will be smaller than either side."],
    ex:"A garden bed is 3/4 m by 2/5 m.\nA = 3/4 × 2/5 = 6/20 = 3/10 m²\nBoth sides are under a metre, so an area under 1 m² makes sense ✓"},
  "dec-multiply":{title:"Multiplying decimals", steps:[
    "Ignore the decimal points and multiply as whole numbers.",
    "Count the total number of decimal places in BOTH numbers you multiplied.",
    "Put that many decimal places in your answer, counting from the right.",
    "Estimate first so you can tell if the point landed in the right spot."],
    ex:"Calculate 2.5 × 0.6.\nEstimate: about 2.5 × 0.5 ≈ 1.2\nIgnore the points: 25 × 6 = 150\nDecimal places: 1 + 1 = 2 → 1.50\nAnswer: 1.5 — and it matches the estimate ✓"},
  "dec-divide":{title:"Dividing decimals", steps:[
    "Dividing by a whole number: divide as usual and keep the decimal point lined up.",
    "Dividing BY a decimal: shift the point in both numbers the same number of places until the divisor is a whole number.",
    "Then divide normally.",
    "Check by multiplying your answer back."],
    ex:"Calculate 7.2 ÷ 0.8.\nShift both one place right: 72 ÷ 8\n72 ÷ 8 = 9\nCheck: 9 × 0.8 = 7.2 ✓\n\nAnd 7.2 ÷ 8 (a whole divisor) = 0.9 — a very different answer, so read the question carefully."},
  "dec-estimate":{title:"Estimating with decimals", steps:[
    "Round each number to something friendly — usually the nearest whole number.",
    "Multiply or divide the rounded numbers in your head.",
    "Use the estimate to check that your exact answer is in the right ballpark.",
    "This is how you catch a misplaced decimal point."],
    ex:"Estimate 7.8 × 3.2.\nRound: 8 × 3 = 24\nSo the exact answer should be near 24 (it is 24.96).\nIf you had calculated 2.496 or 249.6, the estimate tells you the point is wrong."},
  "dec-money":{title:"Decimals with money", steps:[
    "Money always shows exactly two decimal places.",
    "Multiply or add as usual, then write the answer with two places.",
    "Estimate to the nearest dollar first as a check.",
    "Watch for answers like 7.3 — in money that is $7.30."],
    ex:"Four drinks at $1.85 each.\nEstimate: 4 × $2 = about $8\n185 × 4 = 740 → two decimal places → $7.40 ✓"},
  "dec-benchmark":{title:"Decimal and fraction equivalents worth memorizing", steps:[
    "0.5 = 1/2 · 0.25 = 1/4 · 0.75 = 3/4 · 0.2 = 1/5 · 0.1 = 1/10 · 0.125 = 1/8",
    "Spotting one of these turns a hard multiplication into an easy fraction.",
    "0.25 × a number is the same as dividing by 4.",
    "0.5 × a number is the same as halving it."],
    ex:"Calculate 0.75 × 60.\n0.75 = 3/4\nQuarter of 60 = 15\nThree quarters = 45\nFar faster than long multiplication."},
  "dec-place":{title:"Placing the decimal point", steps:[
    "The digits of the answer come from the whole-number multiplication.",
    "The decimal point's position comes from counting decimal places in the question.",
    "Total places in the factors = places in the answer.",
    "Always estimate to confirm."],
    ex:"You know 36 × 15 = 540.\nSo 3.6 × 1.5: one place + one place = two places → 5.40 = 5.4\nAnd 0.36 × 1.5: two places + one place = three places → 0.540 = 0.54\nSame digits every time — only the point moves."},

  "ecosystem-network":{title:"What an ecosystem actually is", steps:[
    "An ecosystem = all the living things in an area + the non-living surroundings + the interactions between them.",
    "The interactions are the part people forget — an ecosystem is a network, not a list.",
    "Levels build up: organism → population (one species) → community (all species) → ecosystem (community + environment).",
    "Interactions can be biotic–biotic, biotic–abiotic, or abiotic–abiotic."],
    ex:"A pond: the frogs, algae and bacteria are biotic; the water, sunlight and temperature are abiotic.\nA frog eating an insect is a biotic–biotic interaction.\nAlgae using sunlight to make food is biotic–abiotic.\nAll the frogs together are a population; every living thing in the pond is the community."},
  "abiotic-effects":{title:"How abiotic changes ripple through an ecosystem", steps:[
    "Start with what changed — rainfall, temperature, sunlight, oxygen.",
    "Ask which producers are affected first, since they depend directly on abiotic conditions.",
    "Follow the chain upward: fewer producers means fewer primary consumers, then fewer predators.",
    "Answer in a sequence, not a single fact — that is what 'describe the interactions' is asking for."],
    ex:"A lake warms over a summer.\nWarm water holds less dissolved oxygen.\nFish that need high oxygen become stressed and move or die.\nTheir predators lose food; algae may bloom without the same grazing pressure.\nOne abiotic change, effects at every level."},
  "consumer-levels":{title:"Counting consumer levels", steps:[
    "Always start from the producer — it is not a consumer at all.",
    "The organism that eats the producer is the PRIMARY consumer.",
    "Next up is secondary, then tertiary.",
    "Herbivore, carnivore and omnivore describe WHAT an organism eats; primary/secondary describe WHERE it sits in the chain."],
    ex:"grass → grasshopper → frog → snake → hawk\ngrass = producer\ngrasshopper = primary consumer (herbivore)\nfrog = secondary consumer\nsnake = tertiary consumer\nhawk = quaternary consumer, and the top predator here."},
  "food-web":{title:"Food webs and why they matter", steps:[
    "A food chain is one path; a food web joins many chains together.",
    "Most organisms appear in several chains — several foods, several predators.",
    "That overlap is what makes an ecosystem resilient: lose one species and others can shift.",
    "When a question asks about removing a species, look at how many links it has."],
    ex:"If a hawk eats mice, rabbits AND snakes, losing the mice is a setback but not a disaster.\nIf a predator eats only one prey species, losing it is fatal for the predator.\nMore connections = more stability. That is the argument for biodiversity in one sentence."},
  "energy-pyramid":{title:"Energy transfer and the 10% rule", steps:[
    "Only about 10% of the energy at one level reaches the next level.",
    "The other 90% is used for the organism's own life processes and lost as heat.",
    "This is why food chains are short and why top predators are rare.",
    "To calculate through levels, multiply by 0.1 for each step up."],
    ex:"Producers capture 50 000 units of energy.\nPrimary consumers: 10% → 5000\nSecondary consumers: 10% of that → 500\nTertiary consumers: → 50\nFrom 50 000 down to 50 in three steps — the pyramid shape is the energy loss made visible."},
  "water-cycle":{title:"The water cycle", steps:[
    "Evaporation: liquid water becomes vapour from oceans, lakes and soil.",
    "Transpiration: water vapour released from plant leaves.",
    "Condensation: vapour cools and forms clouds.",
    "Precipitation: rain or snow falls; then runoff flows to rivers, or infiltration soaks into groundwater."],
    ex:"Water leaves a lake by evaporation and a forest by transpiration (together: evapotranspiration).\nIt condenses into cloud, falls as rain, runs off into a creek, and returns to the lake.\nSame water, endlessly reused — which is the whole point of a cycle."},
  "carbon-cycle":{title:"The carbon cycle", steps:[
    "Photosynthesis REMOVES carbon dioxide from the air and stores the carbon in plants.",
    "Respiration, decomposition and combustion RELEASE it back.",
    "Carbon also sits in long-term stores: oceans, soil, rock, and fossil fuels underground.",
    "Burning fossil fuels moves carbon from a store that was locked away into the air, faster than the cycle removes it."],
    ex:"A tree takes in CO₂ and builds wood.\nA deer eats leaves and breathes out CO₂.\nThe tree falls, decomposers release more CO₂.\nEach step is balanced — until carbon buried for millions of years is burned and added on top."},
  "nitrogen-cycle":{title:"The nitrogen cycle", steps:[
    "Nitrogen gas makes up about 78% of the air, but plants cannot use it in that form.",
    "Nitrogen-fixing bacteria convert it into compounds plants can absorb through their roots.",
    "Animals get nitrogen by eating plants; decomposers return it to the soil.",
    "Legumes such as clover, peas and beans host these bacteria, which is why they enrich soil."],
    ex:"A farmer plants clover after a corn crop.\nBacteria in the clover roots fix nitrogen into the soil.\nNext season's corn has more available nitrogen and needs less fertilizer.\nThat is crop rotation working with the cycle instead of against it."},
  "pioneer-species":{title:"Pioneer species", steps:[
    "Pioneer species are the first to colonize bare ground.",
    "On bare rock (primary succession) that means lichens, then mosses.",
    "They break rock down and add organic matter, creating the first soil.",
    "Only once soil exists can grasses, shrubs and trees follow."],
    ex:"A lava flow cools into bare rock.\nLichens grow on the surface and slowly etch it.\nDead lichen plus rock particles = thin soil.\nMosses take hold, then grasses, then shrubs, then trees — each stage making the next one possible."},
  "climax-community":{title:"A mature, stable community", steps:[
    "Succession moves through stages until the community stops changing much.",
    "At that point the species mix is relatively steady — organisms still live and die, but the overall makeup holds.",
    "A disturbance (fire, storm, clearing, flood) resets the process.",
    "Stable does not mean frozen; it means in balance."],
    ex:"A southern Ontario forest ends up dominated by maple and beech — shade-tolerant trees whose seedlings can grow beneath the adults.\nThat mix persists for a long time, until a storm opens a gap and faster-growing species rush in."},
  "harvesting":{title:"Harvesting within limits", steps:[
    "Every population has a rate at which it can replace what is removed.",
    "Harvesting at or below that rate is sustainable; above it, the population shrinks each year.",
    "Overharvesting removes the breeders, so recovery gets harder the longer it continues.",
    "Standard tools: quotas, size limits, closed seasons, protected areas, gear restrictions."],
    ex:"A lake trout population can replace about 1000 fish a year.\nCatching 800 is sustainable indefinitely.\nCatching 2000 works for a while, then the stock crashes — and even stopping entirely takes years to rebuild, because so few breeders are left."},
  "restoration":{title:"Restoring a damaged ecosystem", steps:[
    "Identify what was actually lost — water, soil, native species, connections between habitats.",
    "Restore the CONDITIONS first; the species follow.",
    "Native species matter: they fit the local food web, non-natives may not.",
    "Then monitor, because restoration is slow and does not always work first time."],
    ex:"A drained wetland is restored by blocking the drainage ditches so water returns, then replanting native cattails and sedges.\nAmphibians and birds come back on their own once the habitat exists.\nPlanting a non-native fast-growing crop instead would give green cover but not a functioning wetland."},
  "bioaccumulation":{title:"Bioaccumulation up a food chain", steps:[
    "A persistent chemical enters an organism faster than it can be broken down or excreted.",
    "A predator eats many contaminated prey, so it takes in all of their accumulated load.",
    "Concentration therefore INCREASES at each step up the chain.",
    "Top predators — hawks, eagles, large fish, and people eating them — carry the highest levels."],
    ex:"Pesticide sprayed at low concentration on a field.\nEach insect carries a tiny amount.\nA bird eats hundreds of insects → a moderate amount.\nA hawk eats dozens of birds → a heavy load.\nThis is what nearly wiped out peregrine falcons and bald eagles under DDT."},
  "invasive-species":{title:"Invasive species", steps:[
    "An invasive species is one introduced to an ecosystem where it does not naturally occur.",
    "It spreads because its usual predators, parasites and competitors are absent.",
    "Effects: it outcompetes natives for food and space, and can alter the habitat itself.",
    "It usually arrives through human activity — shipping, trade, gardening, dumped aquariums."],
    ex:"Zebra mussels reached the Great Lakes in ship ballast water.\nWith no natural controls they multiplied enormously, filtering out the plankton native fish depend on and clogging water intake pipes.\nEmerald ash borer and garlic mustard are two more local examples."},
  "fragmentation":{title:"Habitat fragmentation", steps:[
    "A road, pipeline or development splits a continuous habitat into separated pieces.",
    "Each piece supports fewer individuals, and populations become isolated from each other.",
    "Isolation reduces genetic diversity and blocks seasonal migration.",
    "Mitigation reconnects the pieces: wildlife overpasses, underpasses, culverts, habitat corridors."],
    ex:"A highway cuts a forest in two.\nThe trees actually removed are a narrow strip — but deer, turtles and amphibians on one side can no longer reach the other.\nA vegetated overpass restores the connection, which is why Ontario and Alberta both build them."},
  "mitigation":{title:"Assessing a mitigation measure", steps:[
    "Name the harm precisely before judging the fix.",
    "A good mitigation addresses that harm at its source, not a side effect.",
    "Weigh how effective it is, what it costs, and whether it creates new problems.",
    "'Assess the effectiveness' expects a judgement with a reason, not a list of options."],
    ex:"Harm: road salt running into a creek and raising chloride levels.\nWeak fix: salting more often — same or more salt reaches the water.\nStrong fix: pre-wetted brine and calibrated spreaders — same de-icing with materially less salt applied.\nThe strong fix wins because it reduces the source."}
};
