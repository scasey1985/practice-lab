function answerRows(src, dayFilter){
  return (src.answerLog || []).map(function(a){
    const q = qById(a.i);
    if(!q) return null;
    const d = new Date(a.t);
    const day = dayKey(d);
    if(dayFilter && day !== dayFilter) return null;
    const clean = function(t){ return String(t).replace(/<[^>]+>/g, ""); };
    let correct;
    if(q.type === "mc") correct = q.choices[q.a];
    else if(q.type === "num") correct = String(q.a);
    else correct = q.model;
    return {day:day, time:d.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"}), t:a.t,
      subj:q.subj, topic:q.topic, code:q.code, type:q.type,
      question:clean(q.q), given:clean(a.g || ""), correct:clean(correct), r:a.r};
  }).filter(Boolean);
}
function resultLabel(r){ return r === 1 ? "Right" : r === 0.5 ? "Partly" : "Not yet"; }

let wrongFilter = "all";
let wrongStatus = "open";
function wrongRows(src){
  return (src.wrongLog || []).map(function(w){
    const q = qById(w.id);
    if(!q) return null;
    const clean = function(t){ return String(t).replace(/<[^>]+>/g, ""); };
    let correct;
    if(q.type === "mc") correct = q.choices[q.a];
    else if(q.type === "num") correct = String(q.a);
    else correct = q.model;
    return {
      at:w.at, day:dayKey(new Date(w.at)), subj:q.subj, topic:q.topic, code:q.code, type:q.type, id:q.id,
      question:clean(q.q), given:clean(w.given || ""), correct:clean(correct), rating:w.rating, fixed:!!w.fixed
    };
  }).filter(Boolean).reverse();
}
function renderWrongDb(src){
  const all = wrongRows(src);
  const byStatus = all.filter(function(r){ return wrongStatus === "all" || (wrongStatus === "open" ? !r.fixed : r.fixed); });
  const rows = byStatus.filter(function(r){ return wrongFilter === "all" || r.subj === wrongFilter; });
  const openN = all.filter(function(r){ return !r.fixed; }).length;
  const fixedN = all.length - openN;
  let html = '<div class="card pad stack"><div><h2>Mistakes to review</h2>' +
    '<p class="muted">' + (imported
      ? 'Every question missed, with her answer and the right one. Ones she later got right move to Fixed.'
      : 'Every question you missed, with the right answer. Get one right later and it moves to Fixed.') + '</p></div>';
  if(all.length){
    html += '<div class="fixstats"><span><b>' + openN + '</b> still to fix</span><span><b>' + fixedN + '</b> fixed</span></div>';
  }
  html += '<div class="row">' + [["open","To fix"],["fixed","Fixed"],["all","All"]].map(function(f){
    return '<button class="filt stat' + (wrongStatus === f[0] ? ' on' : '') + '" data-s="' + f[0] + '">' + f[1] + '</button>';
  }).join("") + '</div>';
  html += '<div class="row">' + ["all","math","science","language"].map(function(f){
    const n = f === "all" ? byStatus.length : byStatus.filter(function(r){ return r.subj === f; }).length;
    return '<button class="filt' + (wrongFilter === f ? ' on' : '') + '" data-f="' + f + '">' + (f === "all" ? "Every subject" : SUBJECTS[f].name) + ' · ' + n + '</button>';
  }).join("") + '</div>';
  if(!imported && openN){
    html += '<div class="row"><button class="primary" id="retryBtn">Have another go at these</button></div>';
  }
  if(!rows.length){
    html += '<p class="muted">' + (!all.length ? 'No mistakes logged yet.' : wrongStatus === "open" ? 'Nothing left to fix here. Nice.' : 'Nothing here for this filter.') + '</p>';
  } else {
    let lastDay = null;
    html += '<div class="wdb">';
    rows.slice(0, 200).forEach(function(r){
      if(r.day !== lastDay){ html += '<div class="wday">' + esc(fmtDay(r.day)) + '</div>'; lastDay = r.day; }
      const meta = TOPICS[r.topic];
      html += '<div class="wrow' + (r.fixed ? ' isfixed' : '') + '">' +
        '<div class="wmeta"><span class="tag" style="--tone:' + SUBJECTS[r.subj].tone + ';--tonesoft:' + SUBJECTS[r.subj].soft + '">' +
          esc(meta ? meta.name : r.topic) + ' · ' + esc(r.code) + '</span>' +
          (r.fixed ? '<span class="fixedtag">Fixed</span>' : '') +
          (r.rating ? '<span class="wrate">self-rated: ' + esc(r.rating) + '</span>' : '') + '</div>' +
        '<div class="wq">' + esc(r.question) + '</div>' +
        '<div class="wans"><span class="wl">' + (imported ? 'Her answer' : 'Your answer') + '</span><span class="wgiven">' + (r.given ? esc(r.given) : '<em>left blank</em>') + '</span></div>' +
        '<div class="wans"><span class="wl">' + (r.type === "write" ? "Strong answer" : "Right answer") + '</span><span class="wright">' + esc(r.correct) + '</span></div>' +
        '</div>';
    });
    html += '</div>';
    html += '<div class="row"><button class="soft" id="copyWrong">Copy as spreadsheet</button></div><div id="wrongSlot"></div>';
  }
  html += '</div>';
  return html;
}
function allTsv(src){
  const cell = function(t){ return String(t == null ? "" : t).replace(/[\t\n\r]+/g, " ").trim(); };
  const out = [["Date","Time","Subject","Topic","Code","Question","Her answer","Correct answer","Result"].join("\t")];
  answerRows(src).forEach(function(r){
    out.push([r.day, r.time, SUBJECTS[r.subj].name, TOPICS[r.topic] ? TOPICS[r.topic].name : r.topic, r.code,
      r.question, r.given || "(blank)", r.correct, resultLabel(r.r)].map(cell).join("\t"));
  });
  return out.join("\n");
}
function copyText(text, slot, okMsg){
  const manual = function(){
    slot.innerHTML = '<p class="muted" style="margin:10px 0 8px">Select all and copy, then paste into Excel or Google Sheets:</p><textarea class="reportbox" readonly></textarea>';
    const ta = slot.querySelector("textarea"); ta.value = text; ta.focus(); ta.select();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ slot.innerHTML = '<p class="muted" style="margin-top:10px">' + okMsg + '</p>'; }).catch(manual);
  } else manual();
}
function wrongTsv(src){
  const rows = wrongRows(src).filter(function(r){
    return (wrongFilter === "all" || r.subj === wrongFilter) && (wrongStatus === "all" || (wrongStatus === "open" ? !r.fixed : r.fixed));
  });
  const cell = function(t){ return String(t == null ? "" : t).replace(/[\t\n\r]+/g, " ").trim(); };
  const out = [["Date","Subject","Topic","Code","Question","Her answer","Correct answer","Self-rating","Status"].join("\t")];
  rows.forEach(function(r){
    out.push([r.day, SUBJECTS[r.subj].name, TOPICS[r.topic] ? TOPICS[r.topic].name : r.topic, r.code,
      r.question, r.given || "(blank)", r.correct, r.rating || "", r.fixed ? "Fixed" : "Still to fix"].map(cell).join("\t"));
  });
  return out.join("\n");
}

function renderStrengths(daily){
  const keys = Object.keys(daily).sort();
  const cutoff = dayKey(new Date(Date.now() - 6 * 86400000));
  const agg = {};
  keys.forEach(function(k){
    const d = daily[k];
    Object.keys(d.topics || {}).forEach(function(t){
      const tt = topicTally(d.topics[t]);
      if(tt.c === null) return;          // older days only kept a count, not a score
      if(!agg[t]) agg[t] = {n:0, c:0, rn:0, rc:0, days:0};
      agg[t].n += tt.n; agg[t].c += tt.c; agg[t].days += 1;
      if(k >= cutoff){ agg[t].rn += tt.n; agg[t].rc += tt.c; }
    });
  });
  const list = Object.keys(agg).filter(function(t){ return TOPICS[t] && agg[t].n >= 4; }).map(function(t){
    const a = agg[t];
    const pct = Math.round(a.c / a.n * 100);
    const olderN = a.n - a.rn, olderC = a.c - a.rc;
    let trend = null;
    if(a.rn >= 3 && olderN >= 3){
      const diff = Math.round(a.rc / a.rn * 100) - Math.round(olderC / olderN * 100);
      trend = diff >= 10 ? "up" : diff <= -10 ? "down" : "flat";
    }
    return {t:t, n:a.n, pct:pct, trend:trend, days:a.days};
  });
  const got = list.filter(function(x){ return x.pct >= 75; }).sort(function(a, b){ return b.pct - a.pct; });
  const work = list.filter(function(x){ return x.pct < 60; }).sort(function(a, b){ return a.pct - b.pct; });
  const mid = list.filter(function(x){ return x.pct >= 60 && x.pct < 75; }).sort(function(a, b){ return b.pct - a.pct; });
  const row = function(x){
    const meta = TOPICS[x.t], tone = SUBJECTS[meta.subj].tone;
    const tr = x.trend === "up" ? '<span class="trend up">improving</span>' : x.trend === "down" ? '<span class="trend down">slipping</span>' : '';
    return '<div class="srow"><span class="sname">' + esc(meta.name) + tr + '</span>' +
      '<span class="mini"><i style="width:' + x.pct + '%;background:' + tone + '"></i></span>' +
      '<span class="num">' + x.pct + '% · ' + x.n + ' q</span></div>';
  };
  let html = '<div class="card pad stack"><div><h2>Strengths &amp; struggles</h2>' +
    '<p class="muted">Built from every day logged so far. Needs at least 4 questions in a topic before it shows. "Improving" compares the last 7 days with before.</p></div>';
  if(!list.length){
    html += '<p class="muted">Not enough history yet — this fills in as more days are logged.</p>';
  } else {
    if(got.length) html += '<div class="sgroup"><h3 class="sh good">Getting it</h3>' + got.map(row).join("") + '</div>';
    if(mid.length) html += '<div class="sgroup"><h3 class="sh">Nearly there</h3>' + mid.map(row).join("") + '</div>';
    if(work.length) html += '<div class="sgroup"><h3 class="sh work">Working on it</h3>' + work.map(row).join("") + '</div>';
  }
  html += '</div>';
  return html;
}

function buildReport(){
  const daily = store.daily || {};
  const keys = Object.keys(daily).sort().reverse().slice(0, 30);
  const lines = ["Practice Lab — progress report", "Generated " + new Date().toLocaleString(), ""];
  const t = store.totals;
  lines.push("Overall: " + t.answered + " questions, " + (t.answered ? Math.round(t.correct / t.answered * 100) : 0) + "% correct");
  lines.push("");
  keys.slice(0, 10).forEach(function(k){
    const d = daily[k];
    if(!d || (!d.answered && !d.secs)) return;
    const tops = Object.keys(d.topics || {}).map(function(x){
      const tt = topicTally(d.topics[x]);
      return (TOPICS[x] ? TOPICS[x].name : x) + " " + (tt.c === null ? "(" + tt.n + ")" : tt.c + "/" + tt.n);
    }).join(", ");
    lines.push(fmtDay(k) + ": " + fmtMins(d.secs) + ", " + (d.visits || 1) + " visit(s), " + (d.answered || 0) + " questions" +
      (d.answered ? " at " + Math.round(d.correct / d.answered * 100) + "%" : "") + (tops ? " — " + tops : ""));
    (d.sets || []).forEach(function(st){ lines.push("   set: " + st.title + " " + st.score + "/" + st.outOf); });
  });
  const payload = {v:1, at:new Date().toISOString(), data:{
    daily:store.daily, codes:store.codes, totals:store.totals, hints:store.hints, history:store.history, streak:store.streak,
    wrongLog:(store.wrongLog || []).slice(-300), cards:store.cards || {},
    answerLog:(store.answerLog || []).filter(function(a){ return a.t >= Date.now() - 60 * 86400000; })
  }};
  let b64 = "";
  try{ b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload)))); }catch(e){ b64 = ""; }
  lines.push("");
  lines.push("#PL7:" + b64);
  return lines.join("\n");
}

const DECK_BY_ID = {};
DECKS.forEach(function(d){ DECK_BY_ID[d.id] = d; });
const BANK_BY_ID = {};
BANK.forEach(function(q){ BANK_BY_ID[q.id] = q; });

function cleanSide(t){ return String(t).replace(/\s*\((m|f)\.\)\s*/g, " ").replace(/\s+/g, " ").trim(); }
function dirLabel(deck, dir){
  if(deck.recite) return dir === "f2b" ? "Line → what comes next" : "Line → what came before";
  if(deck.lang === "fr") return dir === "f2b" ? "French → English" : "English → French";
  return dir === "f2b" ? "Word → meaning" : "Meaning → word";
}
function cardSides(deck, i, dir){
  const c = deck.cards[i];
  const bl = deck.backLang || "en";
  return dir === "f2b" ? {front:c.f, back:c.b, frontLang:deck.lang, backLang:bl} : {front:c.b, back:c.f, frontLang:bl, backLang:deck.lang};
}
/* flashcard answers live in the same history as quiz answers */
function qById(id){
  if(BANK_BY_ID[id]) return BANK_BY_ID[id];
  if(String(id).indexOf("fc:") !== 0) return null;
  const parts = id.split(":"), deck = DECK_BY_ID[parts[1]], i = +parts[2], dir = parts[3] || "f2b";
  if(!deck || !deck.cards[i]) return null;
  const s = cardSides(deck, i, dir);
  return {id:id, subj:deck.subj, topic:deck.topic, code:"Flashcards", type:"mc",
    q:"Flashcard (" + dirLabel(deck, dir) + "): " + cleanSide(s.front), choices:[cleanSide(s.back)], a:0};
}

function deckBoxes(id){
  if(!store.cards) store.cards = {};
  if(!store.cards[id]) store.cards[id] = {};
  return store.cards[id];
}
function deckCounts(deck){
  const b = (store.cards && store.cards[deck.id]) || {};
  let fresh = 0, learning = 0, known = 0;
  deck.cards.forEach(function(_, i){
    const v = b[i];
    if(v == null) fresh++; else if(v >= 3) known++; else learning++;
  });
  return {fresh:fresh, learning:learning, known:known, n:deck.cards.length};
}
function bump(deckId, i, up){
  const b = deckBoxes(deckId);
  const v = b[i] == null ? 0 : b[i];
  b[i] = up ? Math.min(5, v + 1) : 0;
}
function pickCards(deck, n){
  const b = (store.cards && store.cards[deck.id]) || {};
  return shuffle(deck.cards.map(function(_, i){
    const v = b[i] == null ? 0.5 : b[i];
    return {i:i, w:v + Math.random() * 1.6};
  }).sort(function(a, c){ return a.w - c.w; }).slice(0, n).map(function(x){ return x.i; }));
}

/* pronunciation */
let frVoice = null;
function loadVoice(){
  try{
    const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    frVoice = vs.filter(function(v){ return /^fr[-_]CA/i.test(v.lang); })[0] || vs.filter(function(v){ return /^fr/i.test(v.lang); })[0] || null;
  }catch(e){}
}
if(window.speechSynthesis){ loadVoice(); try{ speechSynthesis.onvoiceschanged = loadVoice; }catch(e){} }
function canSpeak(){ return !!window.speechSynthesis; }
function speak(text){
  const ss = window.speechSynthesis;
  if(!ss){ sayTip(); return; }
  const t = cleanSide(text).replace(/…/g, "").replace(/\s*\/\s*/g, ", ");
  try{
    /* iPhones drop a new line of speech if cancel() runs when nothing is playing */
    if(ss.speaking || ss.pending) ss.cancel();
    if(!frVoice) loadVoice();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = frVoice ? frVoice.lang : "fr-CA";
    if(frVoice) u.voice = frVoice;
    u.rate = 0.9; u.volume = 1;
    let started = false;
    u.onstart = function(){ started = true; hideTip(); };
    u.onerror = function(){ if(!started) sayTip(); };
    if(ss.paused) ss.resume();
    ss.speak(u);
    setTimeout(function(){ if(!started && !ss.speaking) sayTip(); }, 2000);
  }catch(e){ sayTip(); }
}
function sayTip(){
  let el = document.getElementById("sayTip");
  if(!el){
    el = document.createElement("div"); el.id = "sayTip"; el.className = "saytip"; el.setAttribute("role", "status");
    document.body.appendChild(el);

  el.innerHTML = "<b>No sound?</b> Check the phone isn’t on silent (iPhone: the switch on the side) and the volume is up. " +
    "If it still won’t talk, add a French voice: Settings → Accessibility → Spoken Content → Voices → French. <u>Close</u>";
  el.hidden = false;
  clearTimeout(sayTip.t); sayTip.t = setTimeout(hideTip, 12000);
}
function hideTip(){ const el = document.getElementById("sayTip"); if(el) el.hidden = true; }
function sayBtn(text, lang){

function startLearn(d, idxs){

function renderLearn(){

  if(fc.pos >= fc.queue.length){ return finishLearn(); }

    viewEl.querySelector(".rate2").hidden = !fc.flipped; viewEl.querySelector("p.center").hidden = !fc.flipped; };
  flip.addEventListener("click", doFlip);
  flip.addEventListener("keydown", function(e){ if(e.key === " " || e.key === "Enter"){ e.preventDefault(); doFlip(); } });
  let x0 = null;

  flip.addEventListener("touchend", function(e){
    if(x0 === null || !fc.flipped) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;

  });

}
function learnRate(knew){
  const i = fc.queue[fc.pos];
  const first = !fc.seen[i];
  if(knew){
    if(first && !fc.again[i]) fc.knew++;
    bump(fc.deck.id, i, !fc.again[i]);   // cards needing a second look don't climb yet
    fc.seen[i] = true;
  } else {
    bump(fc.deck.id, i, false);
    fc.again[i] = (fc.again[i] || 0) + 1;
    if(fc.again[i] <= 2) fc.queue.splice(Math.min(fc.queue.length, fc.pos + 4), 0, i);
    else fc.seen[i] = true;
  }
  fc.pos++;
  fc.flipped = false;
  persist();
  renderLearn();
}
function finishLearn(){
  const seenN = Object.keys(fc.seen).length;
  if(seenN){
    const dr = dayRec();
    dr.sets.push({title:"Flashcards · learn: " + fc.deck.name, score:fc.knew, outOf:seenN, at:new Date().toISOString()});
    if(dr.sets.length > 20) dr.sets.shift();
    bumpStreak();
    persist();
  }
  fc.result = {kind:"learn", n:seenN, right:fc.knew, missed:Object.keys(fc.again).map(Number)};
  goScreen("fcdone");
}

/* ---------- test ---------- */
function startFcTest(d, style, only){
  const idxs = only && only.length ? shuffle(only) : pickCards(d, Math.min(10, d.cards.length));
  fc = {mode:"test", style:style, deck:d, dir:fcDir[d.id] || "f2b", queue:idxs, pos:0, answered:null, results:[]};
  goScreen("fctest");
}
function fcOptions(d, i, dir){
  const right = cleanSide(cardSides(d, i, dir).back);
  const pool = shuffle(d.cards.map(function(_, j){ return j; }).filter(function(j){ return j !== i; }));
  const out = [right];
  for(let k = 0; k < pool.length && out.length < 4; k++){
    const t = cleanSide(cardSides(d, pool[k], dir).back);
    if(out.indexOf(t) < 0) out.push(t);
  }
  return shuffle(out);
}
function normFr(t, keepAccents){
  let x = cleanSide(t).toLowerCase().replace(/[’`]/g, "'").replace(/[.!?¿¡,;:«»"]/g, "").replace(/\s+/g, " ").trim();
  if(!keepAccents) x = x.normalize("NFD").replace(/[̀-ͯ]/g, "");
  return x;
}
function stripArticle(t){ return t.replace(/^(le|la|les|l'|un|une|des)\s*/, ""); }
function markTyped(given, answer){
  const alts = cleanSide(answer).split(/\s*\/\s*/);
  let best = {r:0, note:""};
  alts.forEach(function(a){
    if(normFr(given, true) === normFr(a, true)) best = {r:1, note:""};
    else if(best.r < 1 && normFr(given) === normFr(a)) best = {r:1, note:"Right! Watch the accents: " + a};
    else if(best.r < 0.5 && stripArticle(normFr(given)) === stripArticle(normFr(a)) && stripArticle(normFr(a)) !== normFr(a)) best = {r:0.5, note:"Nearly — you need the article: " + a};
  });
  return best;
}
function renderFcTest(){
  const d = fc.deck, s = SUBJECTS[d.subj];
  if(fc.pos >= fc.queue.length) return finishFcTest();
  const i = fc.queue[fc.pos], sd = cardSides(d, i, fc.dir), card = d.cards[i];
  if(!fc.opts || fc.optsFor !== fc.pos){ fc.opts = fcOptions(d, i, fc.dir); fc.optsFor = fc.pos; }
  const a = fc.answered;

function fcAnswer(given){

  fc.results.push({i:i, r:res.r});
  bump(d.id, i, res.r === 1);
  /* same logs as the quiz: answer history + today's record */
  logAnswer({id:"fc:" + d.id + ":" + i + ":" + fc.dir, type:"mc"}, given, res.r);

}
function finishFcTest(){

/* ================= CLOUD SYNC =================
   The page can live anywhere (GitHub Pages). Progress is sent to the Sheet with a plain, cookie-free web request,
   so nobody's Google account (or age) is involved on her side. */
const API_URL = "https://script.google.com/macros/s/AKfycbwW7zbUzw5w0fFQWUhX6XoN_8zlw5L9fTyv7MJtLKLVFNGD3yYcPXlo_E8zuT7gCwtC/exec";
const ONLINE = API_URL.indexOf("https://") === 0 || ((typeof google !== "undefined" && google.script && google.script.run) ? true : false);
const MODE = (typeof SYNC_MODE !== "undefined") ? SYNC_MODE :
  (/(^|[?&])who=dad(&|$)/.test(location.search) ? "parent" : "student");
let lastSig = null, lastPushMs = 0;
function cloud(op, extra){
  const body = Object.assign({op:op}, extra || {});
  const viaFetch = function(){
    return fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body),
      credentials:"omit", redirect:"follow", cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(j){ if(!j || !j.ok) throw new Error((j && j.error) || "server said no"); return j; });
  };
  const viaRun = function(){
    return new Promise(function(res, rej){
      if(!(typeof google !== "undefined" && google.script && google.script.run)) return rej(new Error("no google.script"));
      const t = setTimeout(function(){ rej(new Error("timeout")); }, 8000);
      const r = google.script.run.withSuccessHandler(function(v){ clearTimeout(t); res(v); })
        .withFailureHandler(function(e){ clearTimeout(t); rej(e); });
      if(op === "load") r.loadState(); else r.saveState(body.json, body.rows, body.days);
    }).then(function(v){ return op === "load" ? {ok:true, state:v} : v; });
  };
  if(API_URL.indexOf("https://") !== 0) return viaRun();
  return viaFetch().catch(function(e1){ return viaRun().catch(function(){ throw e1; }); });
}
let failCount = 0;
let syncLoaded = false, syncTimer = null, syncBusy = false, syncAgain = false, lastSyncAt = null, syncErr = null;

function mergeStores(a, b){
  /* union of two copies of her progress — nothing either side has is dropped */
  a = a || {}; b = b || {};
  const aN = (a.totals && a.totals.answered) || 0, bN = (b.totals && b.totals.answered) || 0;
  const big = bN > aN ? b : a, small = big === a ? b : a;
  const out = JSON.parse(JSON.stringify(big));
  const uni = function(x, y, key){
    const seen = {}, res = [];
    (x || []).concat(y || []).forEach(function(r){ const k = key(r); if(!seen[k]){ seen[k] = res.length; res.push(r); } else if(r && r.fixed){ res[seen[k]].fixed = true; res[seen[k]].fixedAt = r.fixedAt; } });
    return res;
  };
  out.answerLog = uni(a.answerLog, b.answerLog, function(r){ return r.i + "|" + r.t; }).sort(function(p, q){ return p.t - q.t; }).slice(-6000);
  out.wrongLog = uni(a.wrongLog, b.wrongLog, function(r){ return r.id + "|" + r.at; }).sort(function(p, q){ return p.at < q.at ? -1 : 1; }).slice(-400);
  out.history = uni(a.history, b.history, function(r){ return r.at + "|" + r.title; }).sort(function(p, q){ return p.at < q.at ? 1 : -1; }).slice(0, 25);
  out.daily = out.daily || {};
  Object.keys(small.daily || {}).forEach(function(k){
    const s = small.daily[k], g = out.daily[k];
    if(!g){ out.daily[k] = s; return; }
    const score = function(r){ return (r.answered || 0) * 100000 + (r.secs || 0); };
    const keep = score(s) > score(g) ? JSON.parse(JSON.stringify(s)) : g;
    keep.sets = uni(g.sets, s.sets, function(r){ return r.at + "|" + r.title; });
    keep.visits = Math.max(g.visits || 0, s.visits || 0);
    keep.secs = Math.max(g.secs || 0, s.secs || 0);
    out.daily[k] = keep;
  });
  out.cards = out.cards || {};
  Object.keys(small.cards || {}).forEach(function(d){
    out.cards[d] = out.cards[d] || {};
    Object.keys(small.cards[d]).forEach(function(i){ out.cards[d][i] = Math.max(out.cards[d][i] || 0, small.cards[d][i]); });
  });
  out.streak = ((a.streak && a.streak.days) || 0) >= ((b.streak && b.streak.days) || 0) ? a.streak : b.streak;
  out.lastSeen = Math.max(a.lastSeen || 0, b.lastSeen || 0);
  out.syncT = Math.max(a.syncT || 0, b.syncT || 0);
  ["codes", "totals", "hints"].forEach(function(k){ if(!out[k]) out[k] = small[k] || {}; });
  return out;
}
function applyStore(s){
  store.codes = s.codes || {}; store.totals = s.totals || {answered:0, correct:0}; store.history = s.history || [];
  store.hints = s.hints || {}; store.streak = s.streak || {last:null, days:0}; store.daily = s.daily || {};
  store.lastSeen = s.lastSeen || 0; store.wrongLog = s.wrongLog || []; store.answerLog = s.answerLog || [];
  store.cards = s.cards || {}; store.syncT = s.syncT || 0;
}
function decodeReport(raw){
  const m = String(raw || "").match(/PL7:([A-Za-z0-9+/=]+)/);
  if(!m) return null;
  try{ const obj = JSON.parse(decodeURIComponent(escape(atob(m[1])))); return obj && obj.v === 1 && obj.data ? obj : null; }catch(e){ return null; }
}
function paintSync(){
  const el = document.getElementById("saveNote");
  if(!el) return;
  let bar = document.getElementById("syncBar");
  if(!ONLINE){ el.textContent = "Your progress is saved on this device."; if(bar) bar.hidden = true; return; }
  if(MODE === "parent"){
    const sa = imported && imported.data && imported.data.savedAt;
    el.textContent = "Parent view · her last save reached the cloud " + (sa ? new Date(sa).toLocaleString(undefined, {weekday:"short", hour:"numeric", minute:"2-digit"}) : "— not yet") + ".";
    const lastA = ((imported && imported.data && imported.data.answerLog) || []).slice(-1)[0];
    if(lastA) el.textContent += lastA.v === APP_BUILD ? " Her app is up to date." :
      " Her app was on an older version at her last answer" + (lastA.v ? " (" + lastA.v + ")" : "") + " — it updates itself next time she opens it; if not, have her pull down on the page to refresh.";
    if(bar) bar.hidden = true;
    return;
  }
  if(syncErr) el.textContent = "Not reaching the cloud right now — your work is kept on this phone and will upload automatically.";
  else if(!syncLoaded) el.textContent = "Connecting…";
  else if(syncBusy || syncTimer) el.textContent = "Saving…";
  else el.textContent = "✓ Saved to the cloud" + (lastSyncAt ? " · " + lastSyncAt.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"}) : "") + ".";
  /* after repeated failures, say so where she will see it */
  if(!bar){
    bar = document.createElement("div"); bar.id = "syncBar"; bar.className = "syncbar"; bar.setAttribute("role", "status");
    const shell = document.querySelector(".shell"); if(shell) shell.insertBefore(bar, shell.firstChild.nextSibling);
  }
  bar.hidden = !(syncErr && failCount >= 2);

}
function daySummaryRows(){
  const keys = Object.keys(store.daily || {}).sort().slice(-3);
  return keys.map(function(k){
    const d = store.daily[k];
    const tops = Object.keys(d.topics || {}).map(function(x){
      const tt = topicTally(d.topics[x]);
      return (TOPICS[x] ? TOPICS[x].name : x) + (tt.c === null ? "" : " " + tt.c + "/" + tt.n);
    }).join(", ");
    const sets = (d.sets || []).map(function(s){ return s.title + " " + s.score + "/" + s.outOf; }).join("; ");
    return [k, Math.round((d.secs || 0) / 60), d.visits || 0, d.answered || 0, d.correct || 0,
      d.answered ? Math.round(d.correct / d.answered * 100) : "", tops, sets];
  });
}
function pushSoon(){
  if(!ONLINE || MODE !== "student") return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ syncTimer = null; pushNow(); }, 2500);
  paintSync();
}
function pushNow(){
  if(!ONLINE || MODE !== "student" || !syncLoaded) return;
  if(syncBusy){ syncAgain = true; return; }
  /* the activity clock saves locally every ~10s; only send that to the cloud once a minute */
  const sig = (store.answerLog || []).length + "|" + Object.keys(store.daily || {}).map(function(k){ return (store.daily[k].sets || []).length; }).join(",") +
    "|" + JSON.stringify(store.cards || {}).length + "|" + (store.wrongLog || []).filter(function(w){ return w.fixed; }).length;
  if(sig === lastSig && Date.now() - lastPushMs < 60000){ paintSync(); return; }
  const since = store.syncT || 0;
  const fresh = answerRows(store).filter(function(r){ return r.t > since; });
  const rows = fresh.map(function(r){
    return [r.day, r.time, SUBJECTS[r.subj] ? SUBJECTS[r.subj].name : r.subj, TOPICS[r.topic] ? TOPICS[r.topic].name : r.topic,
      r.code, r.question, r.given, r.correct, resultLabel(r.r)];
  });
  const newT = fresh.reduce(function(m, r){ return Math.max(m, r.t); }, since);
  const snapshot = JSON.parse(JSON.stringify(store));
  snapshot.syncT = newT;
  syncBusy = true; paintSync();
  cloud("save", {json:JSON.stringify(snapshot), rows:rows, days:daySummaryRows()})
    .then(function(res){
      syncBusy = false; syncErr = null; failCount = 0;
      if(res && res.ok){ lastSig = sig; lastPushMs = Date.now(); store.syncT = Math.max(store.syncT || 0, newT); lastSyncAt = new Date(); try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }
      if(syncAgain){ syncAgain = false; pushNow(); }
      paintSync();
    })
    .catch(function(err){
      syncBusy = false; syncErr = err || true; failCount++; paintSync();
      setTimeout(pushSoon, failCount < 4 ? 15000 : 60000);
    });
}
function syncLoad(){
  if(!ONLINE) return;
  paintSync();
  cloud("load")
    .then(function(res){
      const json = res && res.state;
      let server = null;
      try{ server = json ? JSON.parse(json) : null; }catch(e){ server = null; }
      if(MODE === "parent"){
        imported = {at:new Date().toISOString(), data:server || {daily:{}, codes:{}, totals:{answered:0, correct:0}, history:[], wrongLog:[], answerLog:[]}, live:true};
        syncLoaded = true; syncErr = null;
        if(view.screen === "home"){ view.screen = "daily"; }
        render(); paintSync();
        return;
      }
      applyStore(mergeStores(store, server || {}));
      syncLoaded = true; syncErr = null; failCount = 0;
      /* arriving from the old app with progress in the link */
      const takeHash = function(h){
        const obj = decodeReport(h);
        if(obj){ applyStore(mergeStores(store, obj.data)); movedIn = true; render(); pushNow();
          try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){} }
      };
      takeHash(location.hash);
      try{ google.script.url.getLocation(function(loc){ takeHash(loc && loc.hash); }); }catch(e){}
      try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){}
      render();
      pushNow();
    })
    .catch(function(err){
      syncErr = err || true; failCount++;
      /* the server merges instead of overwriting, so it is safe to keep saving even if loading failed */
      if(MODE !== "parent") syncLoaded = true;
      paintSync();
      if(MODE !== "parent") pushSoon();
      setTimeout(syncLoad, 30000);
    });
}

    '<div class="row"><a class="primary" id="moveOut" href="#" target="_blank" rel="noopener" style="text-decoration:none">Move to the new app</a></div>' +
    '<p class="muted" id="moveOutMsg">If your progress doesn’t show up there, come back here, tap Stats → Daily log → Copy report, and paste it into the new app.</p></div>';
}
function wireMoveOut(){
  const a = document.getElementById("moveOut");
  if(!a) return;
  const rep = buildReport();
  const token = rep.slice(rep.indexOf("#PL7:") + 1);
  a.href = MOVE_URL + "#" + token;
  a.addEventListener("click", function(){ try{ navigator.clipboard.writeText(rep); }catch(e){} });
}

/* hook saving: every local save also queues a cloud save */
const _persistLocal = persist;
persist = function(){ _persistLocal(); pushSoon(); };
window.addEventListener("pagehide", function(){ if(syncTimer){ clearTimeout(syncTimer); syncTimer = null; pushNow(); } });
document.addEventListener("visibilitychange", function(){ if(document.hidden && syncTimer){ clearTimeout(syncTimer); syncTimer = null; pushNow(); } });
if(ONLINE) syncLoad();

/* ================= TODAY TRACKER ================= */
function dayBlank(){ return {visits:0, secs:0, answered:0, correct:0, hints:0, partial:0, topics:{}, sets:[], missed:[]}; }
function todayCardHtml(daily){
  const week = lastNDays(7);
  const k = week[week.length - 1];
  const d = daily[k] || dayBlank();
  const mins = Math.round((d.secs || 0) / 60);
  const pct = d.answered ? Math.round(d.correct / d.answered * 100) : null;
  const prev = week.slice(0, 6).map(function(x){ return daily[x]; }).filter(function(x){ return x && (x.answered || x.secs); });
  const avgMin = prev.length ? Math.round(prev.reduce(function(a, x){ return a + (x.secs || 0); }, 0) / prev.length / 60) : null;
  const avgQ = prev.length ? Math.round(prev.reduce(function(a, x){ return a + (x.answered || 0); }, 0) / prev.length) : null;
  const tops = Object.keys(d.topics || {}).map(function(t){
    const tt = topicTally(d.topics[t]);
    const name = TOPICS[t] ? TOPICS[t].name : t;
    const tone = TOPICS[t] ? SUBJECTS[TOPICS[t].subj].tone : "var(--brand)";
    const soft = TOPICS[t] ? SUBJECTS[TOPICS[t].subj].soft : "var(--brandsoft)";
    return '<span class="tag" style="--tone:' + tone + ';--tonesoft:' + soft + '">' + esc(name) +
      (tt.c === null ? " · " + tt.n : " · " + tt.c + "/" + tt.n) + '</span>';
  }).join(" ");
  const done = (d.sets || []).slice().reverse();
  const lastDay = Object.keys(daily).filter(function(x){ return x < k && daily[x] && (daily[x].answered || daily[x].secs); }).sort().pop();

  let html = '<div class="card pad stack todaycard">' +
    '<div class="todayhead"><div><h2>Today</h2><p class="muted">' +
      new Date().toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"}) + '</p></div>' +
      '<span class="todaypill' + (d.answered ? ' on' : '') + '">' +
      (d.answered ? "Practised" : (d.secs || d.visits) ? "Opened, no questions yet" : "Not yet today") + '</span></div>';

  if(!d.answered && !d.secs){
    html += '<p class="muted">Nothing logged yet today.' +
      (lastDay ? ' Last practice was ' + esc(fmtDay(lastDay)) + ' — ' + (daily[lastDay].answered || 0) + ' questions.' : '') + '</p>';
  } else {
    html += '<div class="statgrid">' +
      '<div class="stat"><div class="n">' + (d.answered || 0) + '</div><div class="l">questions' + (avgQ !== null ? ' · usual ' + avgQ : '') + '</div></div>' +
      '<div class="stat"><div class="n">' + (pct === null ? "–" : pct + "%") + '</div><div class="l">' + (d.correct || 0) + ' right' + (d.partial ? ' · ' + d.partial + ' partly' : '') + '</div></div>' +
      '<div class="stat"><div class="n">' + mins + '</div><div class="l">minutes' + (avgMin !== null ? ' · usual ' + avgMin : '') + '</div></div>' +
      '<div class="stat"><div class="n">' + (d.visits || 1) + '</div><div class="l">' + ((d.visits || 1) === 1 ? "visit" : "visits") + '</div></div>' +
      '</div>';
    if(tops) html += '<div><p class="muted" style="margin-bottom:6px">What ' + (imported ? "she" : "you") + ' worked on</p><div class="chips">' + tops + '</div></div>';
    if(done.length){
      html += '<div><p class="muted" style="margin-bottom:6px">Sets finished today</p>' + done.map(function(st){
        const p = st.outOf ? Math.round(st.score / st.outOf * 100) : 0;
        return '<div class="setrow"><span class="setname">' + esc(st.title) + '</span>' +
          '<span class="setscore' + (p >= 80 ? ' good' : p >= 60 ? ' mid' : ' low') + '">' + st.score + '/' + st.outOf + '</span></div>';
      }).join("") + '</div>';
    }
  }

  /* one dot per day, this week */
  html += '<div><p class="muted" style="margin-bottom:6px">This week</p><div class="wkdots">' +
    week.map(function(x){
      const dd = daily[x];
      const on = dd && (dd.answered || dd.secs);
      const lab = new Date(x + "T12:00:00").toLocaleDateString(undefined, {weekday:"narrow"});
      return '<span class="wkdot' + (on ? ' on' : '') + (x === k ? ' today' : '') + '" title="' + esc(fmtDay(x)) +
        (on ? ": " + (dd.answered || 0) + " questions" : ": nothing") + '"><i></i><b>' + esc(lab) + '</b></span>';
    }).join("") + '</div></div>';

  html += '<p class="muted">Day-by-day history, results and mistakes are below.</p></div>';
  return html;
}
/* ---------- self-update: an app left open in a phone tab picks up new versions on its own ---------- */
var updateReady = false, lastUpdateCheck = 0;
function midActivity(){ return ["quiz", "fctest", "learn"].indexOf(view.screen) >= 0; }
function checkForUpdate(){
  if(!/github\.io$/.test(location.hostname)) return;
  if(Date.now() - lastUpdateCheck < 4 * 60000) return;
  lastUpdateCheck = Date.now();
  fetch(location.pathname + "?build=" + Date.now(), {cache:"no-store", credentials:"omit"})
    .then(function(r){ return r.ok ? r.text() : ""; })
    .then(function(t){
      const m = t.match(/var APP_BUILD = "([^"]+)"/);
      if(m && m[1] > APP_BUILD){ updateReady = true; if(!midActivity()) applyUpdate(); }
    }).catch(function(){});
}
function applyUpdate(){
  let last = 0; try{ last = +sessionStorage.getItem("plReloadAt") || 0; sessionStorage.setItem("plReloadAt", String(Date.now())); }catch(e){}
  if(Date.now() - last < 10 * 60000){ updateReady = false; return; }   /* never loop */
  updateReady = false;
  persist();
  try{ pushNow(); }catch(e){}
  setTimeout(function(){ location.reload(); }, 1500);
}
setTimeout(checkForUpdate, 5000);
setInterval(checkForUpdate, 15 * 60000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) checkForUpdate(); });
window.addEventListener("pageshow", function(e){ if(e.persisted){ lastUpdateCheck = 0; checkForUpdate(); } });

/* the parent view keeps itself current */
let liveTimer = null;
function keepLive(){
  if(!ONLINE || MODE !== "parent") return;
  clearInterval(liveTimer);
  liveTimer = setInterval(function(){ if(!document.hidden && view.screen === "daily") syncLoad(); }, 120000);
}
if(ONLINE && MODE === "parent") keepLive();

/* ================= LIFE TO DATE ================= */
function lifeCardHtml(src, daily){
  const log = src.answerLog || [];
  const t = src.totals || {answered:0, correct:0};
  const days = Object.keys(daily).filter(function(k){ return daily[k] && (daily[k].answered || daily[k].secs); }).sort();
  const secs = days.reduce(function(a, k){ return a + (daily[k].secs || 0); }, 0);
  const sets = days.reduce(function(a, k){ return a + ((daily[k].sets || []).length); }, 0);
  const first = days[0];
  const bySubj = {};
  log.forEach(function(a){
    const q = qById(a.i); if(!q) return;
    const b = bySubj[q.subj] || (bySubj[q.subj] = {n:0, c:0});
    b.n += 1; if(a.r === 1) b.c += 1;
  });
  const answered = Math.max(t.answered || 0, log.length);
  const correct = Math.max(t.correct || 0, log.filter(function(a){ return a.r === 1; }).length);
  const pct = answered ? Math.round(correct / answered * 100) : null;
  const hrs = Math.floor(secs / 3600), mins = Math.round((secs % 3600) / 60);
  let html = '<div class="card pad stack"><div><h2>Life to date</h2><p class="muted">' +
    (first ? 'Since ' + esc(fmtDay(first)) : 'Nothing logged yet') + '</p></div>' +
    '<div class="statgrid">' +
      '<div class="stat"><div class="n">' + answered + '</div><div class="l">questions answered</div></div>' +
      '<div class="stat"><div class="n">' + (pct === null ? "–" : pct + "%") + '</div><div class="l">' + correct + ' right</div></div>' +
      '<div class="stat"><div class="n">' + (hrs ? hrs + 'h ' + mins + 'm' : mins + 'm') + '</div><div class="l">time practising</div></div>' +
      '<div class="stat"><div class="n">' + days.length + '</div><div class="l">' + (days.length === 1 ? 'day' : 'days') + ' practised · ' + sets + (sets === 1 ? ' set' : ' sets') + '</div></div>' +
    '</div>';
  const subs = Object.keys(SUBJECTS).filter(function(k){ return bySubj[k]; });
  if(subs.length){
    html += '<div><p class="muted" style="margin-bottom:8px">By subject · % right</p>' + subs.map(function(k){
      const b = bySubj[k], p = Math.round(b.c / b.n * 100), S = SUBJECTS[k];
      return '<div class="trow" style="--tone:' + S.tone + '"><span>' + esc(S.name) + ' <span class="muted">· ' + b.n + '</span></span>' +
        '<span class="mini"><i style="width:' + p + '%;background:' + S.tone + '"></i></span><span class="num">' + p + '%</span></div>';
    }).join("") + '</div>';
  }
  return html + '</div>';
}
