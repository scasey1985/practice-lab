    "Move all plain numbers to the other side.",
    "Divide to finish, then check by substituting."],
    ex:"Solve 7x − 4 = 4x + 11.\nSubtract 4x: 3x − 4 = 11\nAdd 4: 3x = 15\nDivide by 3: x = 5\nCheck: 7(5) − 4 = 31 and 4(5) + 11 = 31 ✓"},
  "inequality": {title:"Solving an inequality", steps:[
    "Solve it exactly like an equation.",
    "Keep the inequality sign pointing the same way — UNLESS you multiply or divide by a negative, which flips it.",
    "On a number line, ≤ and ≥ get a filled dot; < and > get an open one."],
    ex:"Solve 4x + 3 < 23.\nSubtract 3: 4x < 20\nDivide by 4: x < 5\nSo any number below 5 works — 4.9 does, 5 does not."},
  "like-terms": {title:"Collecting like terms", steps:[
    "Like terms have exactly the same variable part (3x and 7x, but not 3x and 3x²).",
    "Add or subtract their coefficients; the variable part stays unchanged.",
    "Terms that are not alike stay separate."],
    ex:"Simplify 8y − 3y + 2y.\n8 − 3 + 2 = 7 → 7y\n\nSimplify 5a + 2b − a.\nOnly the a terms combine: 4a + 2b"},
  "pattern-rate": {title:"Reading a growing pattern", steps:[
    "Subtract each term from the next one — if the gap is always the same, that is the constant rate.",
    "The value at term 1 is where the pattern starts.",
    "A pattern is shrinking if the gap is negative."],
    ex:"Pattern: 7, 11, 15, 19, …\n11 − 7 = 4, 15 − 11 = 4 → constant rate 4\nTerm 1 = 7, so it starts at 7 and adds 4 each time."},
  "pattern-rule-term": {title:"Writing and using a pattern rule", steps:[
    "The rate of change becomes the number multiplied by n.",
    "Find the constant: work out what to add so that n = 1 gives the first term.",
    "Test the rule on a second term before trusting it."],
    ex:"Pattern: 7, 11, 15, 19, …\nRate 4 → start with t = 4n\nn = 1 gives 4, but the term is 7, so add 3 → t = 4n + 3\nCheck n = 3: 4(3) + 3 = 15 ✓\n20th term: 4(20) + 3 = 83"},
  "coding-repeat": {title:"Reading code with a repeat loop", steps:[
    "Work out what one pass through the loop does.",
    "For a closed shape, the turns must add up to 360°: turns × angle = 360.",
    "Trace two or three passes on paper before deciding what it draws."],
    ex:"repeat 6 [ forward 40; turn right 60° ]\n6 × 60 = 360 → the path closes.\nSix equal sides and six equal turns → a regular hexagon.\n\nChange the turn to 72° and repeat to 5: 5 × 72 = 360 → a pentagon."},

  /* ---------- math: data ---------- */
  "choose-graph": {title:"Choosing the right graph", steps:[
    "Parts of a whole → circle graph.",
    "Change over time → line graph (broken-line graph).",
    "Comparing separate categories → bar graph.",
    "Relationship between two variables → scatter plot."],
    ex:"You track the class's average mark each month for a year → change over time → line graph.\nYou split 200 students by favourite sport → parts of a whole → circle graph."},
  "why-percent": {title:"Why percentages beat raw counts", steps:[
    "A count only makes sense next to the size of the group it came from.",
    "Divide the part by the total, then multiply by 100 to get the share.",
    "Compare the shares, not the counts."],
    ex:"School A: 150 of 500 walk to school → 30%\nSchool B: 200 of 1000 walk → 20%\nSchool B has more walkers but a smaller share — the percentage is the fair comparison."},
  "circle-graph-degrees": {title:"Percent → degrees on a circle graph", steps:[
    "A full circle is 360°.",
    "Multiply the percent (as a decimal) by 360.",
    "All the sectors should total 360°."],
    ex:"A category is 15% of the data.\n0.15 × 360 = 54°\n\nGoing the other way: a 72° sector is 72 ÷ 360 = 0.2 = 20%."},
  "circle-graph-count": {title:"Percent of a total", steps:[
    "Turn the percent into a decimal by dividing by 100.",
    "Multiply by the total.",
    "Sanity-check: 50% should be about half."],
    ex:"30% of 240 students chose hockey.\n0.30 × 240 = 72 students"},
  "mean-change": {title:"How adding data changes the mean", steps:[
    "Mean = total ÷ how many values.",
    "Add the new value to the total AND add 1 to the count.",
    "A value far above the old mean pulls it up; one far below pulls it down."],
    ex:"Data 5, 7, 9, 11 → total 32, mean 8.\nAdd 28: total 60, count 5 → mean 12.\nOne unusually large value moved the mean by 4."},
  "median": {title:"Finding the median", steps:[
    "Put the values in order, smallest to largest.",
    "Odd count → the middle value.",
    "Even count → the mean of the two middle values."],
    ex:"Find the median of 12, 4, 9, 15, 6.\nOrder: 4, 6, 9, 12, 15 → middle is 9.\n\nWith 4, 6, 9, 12: middle two are 6 and 9 → (6 + 9) ÷ 2 = 7.5"},
  "misleading-graph": {title:"Spotting a misleading graph", steps:[
    "Check whether the vertical axis starts at zero — a cut axis exaggerates differences.",
    "Check for uneven or unlabelled scales.",
    "Check for pictures scaled in two directions, or a missing source."],
    ex:"Two bars, 52 and 55, on an axis running 50 to 56: one bar looks nearly three times the other.\nRedrawn from 0 to 60, the bars look almost identical — which is the truth."},
  "indep-dep": {title:"Independent or dependent events", steps:[
    "Ask: does the first event change the odds of the second?",
    "No change → independent (coins, dice, drawing WITH replacement).",
    "Change → dependent (drawing WITHOUT replacement, dealing cards)."],
    ex:"Rolling a 4, then rolling again: the die has no memory → independent.\nDrawing a name from a hat and keeping it, then drawing again: fewer names left → dependent."},
  "prob-independent": {title:"Probability of two independent events", steps:[
    "Find each probability separately.",
    "Multiply them.",
    "The answer must be smaller than either one on its own."],
    ex:"P(rolling a 6, then a 6) = 1/6 × 1/6 = 1/36\nP(heads, then a 5 on a die) = 1/2 × 1/6 = 1/12"},
  "prob-dependent": {title:"Probability of two dependent events", steps:[
    "Work out the first probability.",
    "Update the counts — one item is gone from the top AND the bottom.",
    "Multiply the two probabilities, then simplify."],
    ex:"A bag has 4 green and 6 yellow marbles. P(both green, no replacement)?\nFirst: 4/10\nNow 3 green of 9 left → 3/9\n4/10 × 3/9 = 12/90 = 2/15"},
  "data-types": {title:"Types of data", steps:[
    "Qualitative describes a quality or category (colour, sport, yes/no).",
    "Quantitative is a number you can do arithmetic with.",
    "Discrete quantitative data comes in countable steps; continuous can take any value in a range."],
    ex:"Number of pets: quantitative, discrete (you can't own 2.5 dogs).\nMass in kilograms: quantitative, continuous.\nEye colour: qualitative."},

  /* ---------- math: spatial sense ---------- */
  "circumference": {title:"Circumference of a circle", steps:[
    "C = πd, or C = 2πr — pick whichever matches what you were given.",
    "If you were given the radius but want to use πd, double it first.",
    "Answer in a length unit (cm, m)."],
    ex:"A circle has radius 4 cm. Find the circumference.\nC = 2πr = 2 × 3.14 × 4 = 25.12 cm\n\nGiven diameter 9 cm instead: C = 3.14 × 9 = 28.26 cm"},
  "circle-area": {title:"Area of a circle", steps:[
    "A = πr². Square the RADIUS, then multiply by π.",
    "If you were given the diameter, halve it first.",
    "Answer in square units (cm², m²)."],
    ex:"A circle has diameter 12 cm. Find the area.\nr = 12 ÷ 2 = 6\nA = 3.14 × 6² = 3.14 × 36 = 113.04 cm²\n\nCommon slip: squaring the diameter instead of the radius gives a number four times too big."},
  "volume-prism-cyl": {title:"Volume of a prism or cylinder", steps:[
    "Volume = area of the base × height. This works for every prism and cylinder.",
    "Cylinder base is a circle → πr². Triangular base → (base × height) ÷ 2.",
    "Answer in cubic units (cm³)."],
    ex:"A cylinder has radius 5 cm and height 8 cm.\nBase area = 3.14 × 25 = 78.5 cm²\nV = 78.5 × 8 = 628 cm³\n\nA prism with base area 20 cm² and height 6 cm: V = 20 × 6 = 120 cm³"},
  "surface-area-cyl": {title:"Surface area of a cylinder", steps:[
    "Unroll it: two circles plus one rectangle.",
    "The two circles are 2πr². The rectangle's width is the circumference, so it is 2πr × h.",
    "Add the parts. Answer in square units."],
    ex:"Radius 3 cm, height 10 cm.\nTwo circles: 2 × 3.14 × 9 = 56.52\nWrap: 2 × 3.14 × 3 × 10 = 188.4\nTotal = 244.92 cm²"},
  "ml-cm3": {title:"Millilitres and cubic centimetres", steps:[
    "1 mL = 1 cm³ exactly — the number does not change.",
    "1 L = 1000 mL = 1000 cm³.",
    "Capacity is what a container holds; volume is the space something takes up."],
    ex:"A jug holds 1.5 L. What is that in cm³?\n1.5 × 1000 = 1500 cm³ (also 1500 mL)"},
  "area-unit-convert": {title:"Converting area units", steps:[
    "First get the length factor: 1 m = 100 cm, 1 cm = 10 mm.",
    "For AREA, square that factor: 1 m² = 100² = 10 000 cm².",
    "Multiply (going to smaller units) or divide (going to bigger ones)."],
    ex:"Convert 2.4 m² to cm².\n1 m² = 10 000 cm²\n2.4 × 10 000 = 24 000 cm²\n\nAnd 50 000 cm² to m²: 50 000 ÷ 10 000 = 5 m²"},
  "volume-unit-convert": {title:"Converting volume units", steps:[
    "For VOLUME, cube the length factor: 1 m³ = 100³ = 1 000 000 cm³.",
    "1000 cm³ = 1 L.",
    "Decide first whether the answer should be bigger or smaller than the number you started with."],
    ex:"Convert 7500 cm³ to litres.\n7500 ÷ 1000 = 7.5 L\n\nConvert 2 L to cm³: 2 × 1000 = 2000 cm³"},
  "translation": {title:"Translations on the Cartesian plane", steps:[
    "Right adds to x; left subtracts from x.",
    "Up adds to y; down subtracts from y.",
    "The shape does not turn or change size — every point shifts the same way."],
    ex:"Translate (−2, 5) three units left and four units down.\nx: −2 − 3 = −5\ny: 5 − 4 = 1\nImage: (−5, 1)"},
  "reflection": {title:"Reflections on the Cartesian plane", steps:[
    "Reflect in the y-axis → flip the sign of x, keep y.",
    "Reflect in the x-axis → keep x, flip the sign of y.",
    "The point stays the same distance from the mirror line, on the other side."],
    ex:"Reflect (6, −3) in the x-axis.\nx stays 6, y flips → (6, 3)\n\nReflect the same point in the y-axis → (−6, −3)"},
  "rotation": {title:"Rotations about the origin", steps:[
    "90° counter-clockwise: (x, y) → (−y, x).",
    "90° clockwise: (x, y) → (y, −x).",
    "180° either way: (x, y) → (−x, −y).",
    "If you forget, sketch the point and rotate the paper."],
    ex:"Rotate (2, 5) 90° clockwise about the origin.\n(x, y) → (y, −x) → (5, −2)\n\nRotate (2, 5) by 180° → (−2, −5)"},
  "dilation": {title:"Dilations and scale factor", steps:[
    "Multiply every length by the scale factor.",
    "Area is multiplied by the scale factor SQUARED.",
    "A factor above 1 enlarges; between 0 and 1 it shrinks. Angles never change — the shapes stay similar."],
    ex:"A rectangle 4 cm × 6 cm is dilated by a factor of 2.\nSides: 8 cm × 12 cm\nArea: 24 cm² → 96 cm², which is 24 × 2² ✓"},
  "3d-properties": {title:"Faces, edges and vertices", steps:[
    "A prism has two identical parallel bases and rectangles joining them; a pyramid has one base and triangles meeting at a point.",
    "Prisms are named for the base shape.",
    "Count systematically: bases first, then the sides."],
    ex:"A square-based pyramid: 1 square + 4 triangles = 5 faces; 5 vertices (4 corners + the apex); 8 edges.\nA rectangular prism: 6 faces, 8 vertices, 12 edges."},

  /* ---------- math: financial literacy ---------- */
  "exchange-rate": {title:"Converting currency", steps:[
    "Write the rate as a sentence: '1 of THIS buys that much of THAT'.",
    "Multiply when you are converting away from the currency the rate starts with.",
    "Check the direction: is the answer supposed to be bigger or smaller?"],
    ex:"1 CAD = 0.68 EUR. Convert CAD $400.\n400 × 0.68 = €272\n\nGoing back: €272 ÷ 0.68 = CAD $400"},
  "simple-interest": {title:"Simple interest", steps:[
    "Simple interest is always calculated on the ORIGINAL amount.",
    "I = principal × rate × time (rate as a decimal, time in years).",
    "Add the interest to the principal only if the question asks for the total."],
    ex:"$1200 at 4% simple interest for 3 years.\nI = 1200 × 0.04 × 3 = $144\nTotal in the account = 1200 + 144 = $1344"},
  "compound-interest": {title:"Compound interest", steps:[
    "Each year, multiply the CURRENT balance by (1 + rate).",
    "Do it once per compounding period, using the new balance each time.",
    "The result is always a bit more than simple interest at the same rate."],
    ex:"$2000 at 6% compounded annually for 2 years.\nYear 1: 2000 × 1.06 = $2120\nYear 2: 2120 × 1.06 = $2247.20\nSimple interest would have given only $2240 — the extra $7.20 is interest on interest."},
  "unit-price": {title:"Comparing value with unit price", steps:[
    "Divide the price by the quantity to get the cost of one.",
    "Compare the unit prices — lowest wins.",
    "Watch for different units (grams vs kilograms) and convert first."],
    ex:"4 pairs of socks for $17.00, or 6 pairs for $24.60?\n17.00 ÷ 4 = $4.25 each\n24.60 ÷ 6 = $4.10 each\nThe six-pack is better value by 15¢ a pair."},
  "discount-tax": {title:"Discounts then tax", steps:[
    "Take the discount first: multiply by (1 − discount) — 30% off means × 0.70.",
    "Then add tax on the SALE price: multiply by 1.13 for 13% HST.",
    "Do not add the percents together — they apply to different amounts."],
    ex:"A $60 jacket is 20% off, plus 13% HST.\nSale price: 60 × 0.80 = $48\nWith tax: 48 × 1.13 = $54.24"},
  "account-fees": {title:"Comparing account fees", steps:[
    "Work out the total cost of each option for the SAME usage.",
    "Flat fee → one number. Per-transaction → multiply by how many you make.",
    "Notice where the answer flips: the cheaper option depends on usage."],
    ex:"Account X: $5/month flat. Account Y: $1.00 per transaction.\nAt 4 transactions: X = $5.00, Y = $4.00 → Y is cheaper.\nAt 8 transactions: X = $5.00, Y = $8.00 → X is cheaper.\nThe break-even is 5 transactions."},
  "reliable-sources": {title:"Judging a source of financial information", steps:[
    "Ask who made it and what they gain if you follow the advice.",
    "Prefer sources with accountability: government consumer agencies, regulated institutions, established non-profits.",
    "Treat ads, sponsored content and anonymous comments as marketing, not information.",
    "Check the date — rates and rules change."],
    ex:"Comparing a savings account: a federal consumer agency's comparison tool is reliable. A video sponsored by one lender is selling you something, even if the facts in it are true."},
  "goal-factors": {title:"What helps or blocks a savings goal", steps:[
    "Work out the maths first: goal ÷ amount per period = how many periods.",
    "Helpers make the deposit automatic, tracked, or larger.",
    "Blockers reduce the deposit, add fees or interest charges, or move the goal."],
    ex:"Goal $300, saving $20 a week → 15 weeks.\nIf spending cuts it to $12 a week → 25 weeks, ten weeks late.\nAn automatic transfer on payday protects the deposit before it can be spent."},

  /* ---------- science: ecosystems ---------- */
  "biotic-abiotic": {title:"Biotic vs abiotic", steps:[
    "Biotic = living, or once living (plants, animals, bacteria, fungi, a dead log).",
    "Abiotic = never living (water, air, sunlight, temperature, soil minerals, rocks).",
    "Ask: was this ever alive?"],
    ex:"In a forest: maple trees, worms and mushrooms are biotic. Rainfall, soil pH and hours of sunlight are abiotic.\nTricky one: a bird's nest is made of non-living material but built from once-living twigs — the twigs are biotic."},
  "feeding-roles": {title:"Producers, consumers, decomposers", steps:[
    "Producer: makes its own food from sunlight (plants, algae).",
    "Consumer: eats other organisms — herbivore, carnivore or omnivore.",
    "Decomposer: breaks down dead matter and returns nutrients to the soil (fungi, many bacteria)."],
    ex:"Pond: algae = producer, tadpole eating algae = consumer, bacteria breaking down a dead fish = decomposer."},
  "food-chain": {title:"Reading a food chain", steps:[
    "Arrows point in the direction ENERGY moves — from the eaten to the eater.",
    "Only about 10% of the energy passes to the next level, which is why chains are short.",
    "Remove one link and think in both directions: what it ate increases, what ate it declines."],
    ex:"algae → minnow → bass → heron\nIf the minnows die off: algae increase (nothing eating them), bass decline (less food), and herons decline after that."},
  "matter-cycles": {title:"Cycling of matter", steps:[
    "Matter cycles — the same atoms are used over and over.",
    "Energy flows one way, entering as sunlight and leaving as heat.",
    "Decomposers are the step that returns matter to the start of the cycle."],
    ex:"Carbon in the air → taken up by a plant → eaten by a deer → released by breathing, or returned to the soil by decomposers when the deer dies → back to the air. Nothing new is created."},
  "succession": {title:"Primary vs secondary succession", steps:[
    "Ask one question: was there soil to start with?",
    "No soil (bare rock, new lava, glacier retreat) → primary succession, and it starts with lichens and moss.",
    "Soil remains (after fire, flood, or abandoned farmland) → secondary succession, and it is much faster."],
    ex:"A forest fire leaves scorched soil and seeds → secondary succession; grasses appear within a season.\nA new volcanic island has no soil at all → primary succession, taking centuries."},
  "limiting-factors": {title:"Limiting factors and carrying capacity", steps:[
    "A limiting factor is anything in short supply that caps population growth: food, water, space, shelter, nutrients, disease.",
    "Carrying capacity is the population size the ecosystem can sustain over time.",
    "Both biotic and abiotic factors can be limiting."],
    ex:"A deer population grows until winter food runs short. Food is the limiting factor, and the number the woodland can feed through winter is its carrying capacity."},
  "agriculture-impact": {title:"Agriculture and ecosystem balance", steps:[
    "Name the practice, then trace what it changes: habitat, soil, water, biodiversity.",
    "Low diversity means a single pest or disease can spread unchecked.",
    "Restoring strategies: crop rotation, cover crops, buffer strips, reduced tillage, mixed planting."],
    ex:"Planting one crop repeatedly drains the same soil nutrients and invites a specialized pest. Rotating with a legume restores nitrogen and breaks the pest's cycle."},
  "assess-impact": {title:"Assessing an impact (the exam skill)", steps:[
    "Say what the technology or activity does.",
    "Name a specific benefit AND a specific cost — environmental, social or economic.",
    "Weigh them and take a position; a good answer does not just list.",
    "Look across the whole life cycle: making it, using it, disposing of it."],
    ex:"Electric buses: cut tailpipe emissions and street-level noise (benefit), but need mined battery materials and grid electricity that may not be clean (cost). Whether they are a net gain depends on how the local electricity is generated."},
  "two-eyed": {title:"Indigenous knowledges and sustainability", steps:[
    "Two-Eyed Seeing means using the strengths of Indigenous knowledges and Western science together, not ranking one above the other.",
    "Look for practices grounded in long observation and relationship with place: controlled burning, seasonal harvest limits, taking only what is needed.",
    "Credit the specific nation or community when the source names one."],
    ex:"Cultural burning clears undergrowth, returns nutrients and lowers the risk of large wildfires — a practice used for generations that fire science now studies and applies."},

  /* ---------- science: matter ---------- */
  "particle-theory": {title:"The particle theory of matter", steps:[
    "All matter is made of tiny particles.",
    "Particles of one pure substance are all identical; different substances have different particles.",
    "Particles are always moving, and they move faster when heated.",
    "There is space between particles, and they attract each other."],
    ex:"Heating a gas does not make the particles bigger — it makes them move faster, so they hit the container more often and spread further apart. That is why a balloon expands in the sun."},
  "pure-vs-mixture": {title:"Pure substance or mixture", steps:[
    "Pure substance: one kind of particle throughout — an element or a compound.",
    "Mixture: two or more substances physically together, separable without a chemical change.",
    "Ask: could I separate it by filtering, evaporating or picking it apart?"],
    ex:"Table sugar is a pure substance (one compound). Sweet tea is a mixture — evaporate the water and the sugar is left behind, chemically unchanged."},
  "homo-hetero": {title:"Homogeneous or heterogeneous", steps:[
    "Homogeneous: looks the same throughout; you cannot see the separate parts. Solutions are homogeneous.",
    "Heterogeneous: the different parts are visible or settle out.",
    "Test: does a sample from the top look identical to one from the bottom?"],
    ex:"Vinegar is homogeneous. Sand in water is heterogeneous — it settles. Milk looks uniform to the eye but separates under a microscope, which is why it is classed as heterogeneous (a colloid)."},
  "dissolving-rate": {title:"Rate of dissolving vs solubility", steps:[
    "Three things speed up dissolving: heat, stirring, smaller pieces (more surface area).",
    "Rate is how FAST it dissolves; solubility is how MUCH can dissolve.",
    "Explain with particles: more contact and faster movement means more collisions."],
    ex:"Icing sugar in hot, stirred water dissolves in seconds. A sugar cube in cold, still water takes minutes — same total amount dissolves eventually, but far more slowly."},
  "saturation": {title:"Saturated and unsaturated solutions", steps:[
    "Unsaturated: more solute will still dissolve.",
    "Saturated: no more will dissolve at that temperature, and extra sits undissolved.",
    "Solubility usually rises with temperature — so cooling a saturated solution can force solute back out.",
    "Concentration in words: dilute or concentrated. In numbers: grams per 100 mL."],
    ex:"36 g of salt dissolves in 100 mL of water at 20°C. Add a 37th gram and it sits on the bottom — the solution is saturated."},
  "universal-solvent": {title:"Water as the universal solvent", steps:[
    "Water dissolves a wider range of substances than almost any other liquid.",
    "'Universal' is a nickname, not a literal claim — oil and wax do not dissolve in it.",
    "Consequence: water carries nutrients through living things, and pollutants through the environment."],
    ex:"Road salt dissolves in meltwater and travels to a creek — the same property that lets your body move nutrients in blood also moves contaminants into an ecosystem."},
  "separation": {title:"Choosing a separation method", steps:[
    "Find a physical property that differs: size, magnetism, boiling point, solubility, density.",
    "Filtration for an insoluble solid in a liquid. Evaporation to recover a dissolved solid. Distillation to recover BOTH.",
    "Magnetism for magnetic metals. Chromatography for dissolved dyes. Settling or a centrifuge for density."],
    ex:"Separate sand and salt mixed together:\n1. Add water — salt dissolves, sand does not.\n2. Filter → sand stays on the paper.\n3. Evaporate the filtrate → salt is left behind."},
  "element-compound": {title:"Elements and compounds", steps:[
    "Element: one kind of atom only. Its formula has one symbol (Fe, He) — O₂ counts, since both atoms are oxygen.",
    "Compound: two or more DIFFERENT kinds of atom chemically joined (H₂O, NaCl, CO₂).",
    "Count the different capital letters in the formula."],
    ex:"N₂ — one element (two nitrogen atoms).\nNH₃ — a compound (nitrogen and hydrogen).\nA mixture of N₂ and NH₃ is neither; the substances are not joined."},

  /* ---------- science: structures ---------- */
  "structure-types": {title:"Solid, frame and shell structures", steps:[
    "Solid: a solid mass of material, relying on its own weight (dam, brick wall, mountain).",
    "Frame: a skeleton of parts joined together (bicycle, bridge truss, house framing).",
    "Shell: a thin curved outer layer holding its shape with no internal frame (egg, canoe, dome).",
    "Many real structures combine types."],
    ex:"A car: shell body panels over a frame chassis. A concrete dam: solid. A geodesic dome: frame if it is a lattice of struts, shell if it is a continuous curved surface."},
  "centre-gravity": {title:"Centre of gravity and stability", steps:[
    "The centre of gravity is the point where the structure's weight acts.",
    "Lower centre of gravity + wider base = more stable.",
    "A structure tips when its centre of gravity passes outside its base."],
    ex:"A pyramid is hard to tip: heavy, low, wide base. A tall narrow bookshelf tips easily — anchoring it or loading heavy books on the bottom shelf lowers the centre of gravity."},
  "describing-forces": {title:"Describing a force completely", steps:[
    "Magnitude — how big (in newtons).",
    "Direction — which way it pushes or pulls.",
    "Point of application — exactly where it acts on the structure.",
    "Plane of application — the surface or plane it acts in."],
    ex:"A skater standing on a bench: magnitude = their weight in newtons, direction = straight down, point of application = where their feet contact the seat, plane = the horizontal seat surface."},
  "static-dynamic": {title:"Static and dynamic loads", steps:[
    "Static (dead) load: constant and unchanging — the structure's own weight, permanent fixtures.",
    "Dynamic (live) load: changes over time — people, traffic, wind, snow, earthquakes.",
    "Dynamic loads are harder to design for because they vary and can resonate."],
    ex:"A pedestrian bridge: the concrete deck is a static load; a crowd walking in step is a dynamic load — and a notorious one, because rhythmic footfall can set a bridge swaying."},
  "failure": {title:"Why structures fail", steps:[
    "Name the mode: the material was wrong or too weak, a joint or fastener gave way, the load exceeded the design, corrosion or rot weakened it, or fatigue from repeated loading.",
    "Fatigue is the sneaky one — many loads well below the breaking point.",
    "Design responses: safety factors, redundancy, triangulation, inspection schedules."],
    ex:"A paperclip bent open and closed forty times snaps, though one bend does nothing. Tiny cracks grew with each cycle — metal fatigue. It is why aircraft parts are retired by flight hours, not by looking fine."},
  "tension-compression": {title:"Tension, compression, shear and torsion", steps:[
    "Tension pulls apart (a stretched cable). Compression squeezes together (a column).",
    "Shear slides one part past another (a bolt cut sideways). Torsion twists.",
    "In a loaded beam, the top is in compression and the bottom in tension."],
    ex:"A rope bridge: the ropes are in tension, the deck posts in compression.\nCut a loaded beam in half lengthwise and you can see why steel reinforcement in concrete goes near the BOTTOM, where the tension is — concrete is weak in tension."},
  "symmetry": {title:"Symmetry in structures", steps:[
    "Symmetry spreads loads evenly on both sides of a centre line.",
    "It also makes forces easier to predict and the structure easier to build.",
    "Asymmetric designs are possible but need extra bracing or counterweights."],
    ex:"A suspension bridge with equal spans either side of each tower balances the cable pull. A cantilevered balcony is asymmetric, so it needs a counterweight or anchoring back into the building."},
  "material-choice": {title:"Choosing a material", steps:[
    "List what the structure must resist: load, weather, moisture, corrosion, heat, wear.",
    "Then weigh strength, mass, durability, cost, availability and environmental impact.",
    "Suitability always depends on the conditions, not on one 'best' material."],
    ex:"An outdoor bench in Ontario: pressure-treated wood or powder-coated steel handle rain, salt and freeze-thaw. Untreated pine is cheaper and strong enough on day one, and rotted within a few seasons."},
  "maintenance": {title:"Keeping structures safe over time", steps:[
    "Inspect on a schedule, looking for cracks, corrosion, deflection, loose fasteners.",
    "Test without damaging: ultrasound, load testing, strain gauges, sensors.",
    "Repair early — small problems are cheap; structural ones are not.",
    "Design in redundancy so no single part's failure brings the whole thing down."],
    ex:"Ontario bridges are inspected at least every two years, with measurements compared against previous years. A crack that grew is a signal; the same crack unchanged for a decade may not be."},
  "ergonomics": {title:"Ergonomic design", steps:[
    "Ergonomics fits the object to the human body, not the other way around.",
    "Look for neutral posture: back supported, feet flat, screen at eye level, wrists straight.",
    "Watch for repetition, awkward reach, and sustained force — the three sources of strain.",
    "Adjustability beats one fixed 'correct' setting."],
    ex:"A laptop on a low table forces the neck down for hours. Raising the screen to eye level and adding a separate keyboard fixes the posture without buying a new machine."},

  /* ---------- science: heat ---------- */
  "heat-particles": {title:"Heat and particle motion", steps:[
    "Temperature measures the average kinetic energy of particles — how fast they move.",
    "Heat is the energy transferred from warmer to cooler.",
    "Heating makes particles move faster and spread slightly apart; the particles themselves never change size."],
    ex:"In ice, particles vibrate in fixed positions. Heat it and the vibration grows until the particles break free and slide past each other — that is melting."},
  "thermal-expansion": {title:"Thermal expansion", steps:[
    "Heating makes particles move more, so the material takes up more space.",
    "Gases expand most, then liquids, then solids.",
    "Engineers leave room for it: expansion joints, gaps in rails, loops in pipes."],
    ex:"Overhead power lines sag more in summer than winter — the metal expands with heat. Strung tight in July, they could snap when they contract in January cold."},
  "conduction": {title:"Conduction", steps:[
    "Energy passes particle to particle through direct contact, without the material itself flowing.",
    "Metals conduct well; wood, plastic, air and water conduct poorly (they insulate).",
    "Needs matter in contact — no conduction across a vacuum."],
    ex:"A metal pot handle gets hot while a wooden one stays cool. Same stove, same time — different conductors, which is exactly why handles are made of wood or plastic."},
  "convection": {title:"Convection", steps:[
    "Happens in fluids only — liquids and gases.",
    "Heated fluid becomes less dense and rises; cooler fluid sinks to replace it, creating a circulating current.",
    "The fluid itself moves, carrying the energy with it."],
    ex:"A room heater near the floor warms the whole room: warm air rises, cools at the ceiling, sinks down the far wall and returns. Mounted at the ceiling, the warm air would just stay up there."},
  "radiation": {title:"Radiation", steps:[
    "Energy travels as electromagnetic waves and needs no medium — it crosses empty space.",
    "This is how the Sun's energy reaches Earth.",
    "Dark, dull surfaces absorb and emit more; light, shiny surfaces reflect more."],
    ex:"A black car interior on a July afternoon gets far hotter than a white one, and a survival blanket is shiny silver so it reflects body heat back rather than letting it radiate away."},
  "change-of-state": {title:"Changes of state and heating curves", steps:[
    "During a change of state, added energy separates particles instead of speeding them up — so the temperature holds steady.",
    "On a heating graph this shows as a flat plateau at the melting and boiling points.",
    "Between plateaus the temperature climbs steadily."],
    ex:"Heat ice from −20°C: temperature rises to 0°C, then holds flat while the ice melts, then rises to 100°C, then holds flat while it boils. The flat parts are where the state is changing."},
  "greenhouse": {title:"Greenhouse gases and radiated heat", steps:[
    "Sunlight passes through the atmosphere and warms the surface.",
    "The surface radiates that energy back out as infrared.",
    "Greenhouse gases (CO₂, methane, water vapour, nitrous oxide) absorb and re-radiate some of it, slowing its escape to space.",
    "Human sources: burning fossil fuels, agriculture, landfills, some industry."],
    ex:"A parked car works the same way: light comes in through the glass, the seats warm and radiate heat, and the glass traps it. More greenhouse gas is like thicker glass — less heat gets out."},
  "insulation": {title:"Reducing heat loss", steps:[
    "Insulation works by trapping still air, which conducts heat poorly.",
    "Attack all three transfers: insulation slows conduction, sealing gaps stops convection, reflective barriers cut radiation.",
    "Benefits to name: less energy used, lower cost, fewer emissions, steadier indoor temperature."],
    ex:"A thermos: vacuum layer blocks conduction and convection, silvered walls reflect radiation, and the lid stops warm air escaping. All three at once."},
  "renewable": {title:"Renewable and non-renewable energy", steps:[
    "Renewable replenishes on a human timescale: solar, wind, hydro, geothermal, tidal, biomass.",
    "Non-renewable does not: coal, oil, natural gas, uranium.",
    "Weigh both sides — renewables still have land use, material and habitat impacts.",
    "Note where the electricity actually comes from before calling something clean."],
    ex:"Ontario's grid is largely nuclear and hydro, so an electric car charged here produces far fewer emissions over its life than in a region running mostly on coal. Same car, different answer."},

  /* ---------- language: conventions ---------- */
  "semicolon": {title:"Using a semicolon", steps:[
    "A semicolon joins two COMPLETE sentences that are closely related.",
    "Test it: cover the semicolon — both halves must stand alone.",
    "Do not add and, but or so after it; the semicolon replaces them.",
    "It also separates items in a list where the items already contain commas."],
    ex:"Correct: The power went out; we finished the game by candlelight.\nWrong: The power went out; and we finished the game. (conjunction added)\nWrong: The power went out; because of the storm. (second half is a fragment)"},
  "colon-quote": {title:"Colons before a quotation or a list", steps:[
    "What comes BEFORE the colon must be a complete sentence.",
    "What follows can be a quotation, a list, or an explanation.",
    "If the lead-in is 'She said' or 'The reasons are', it is not complete — use a comma or nothing at all."],
    ex:"Correct: The sign made one thing clear: “No skating after dark.”\nWrong: The sign said: “No skating after dark.” (“The sign said” is not a complete sentence)\nCorrect: We needed three things: rope, tape and a flashlight."},
  "conjunctive-adverb": {title:"Punctuating however, therefore, meanwhile", steps:[
    "These words are adverbs, not conjunctions — they cannot join two sentences with only a comma.",
    "Joining two independent clauses: semicolon before, comma after.",
    "Starting a sentence: the word, then a comma.",
    "In the middle of one clause: commas on both sides."],
    ex:"Correct: The rink was full; therefore, we skated at the outdoor pad.\nCorrect: The rink was full. Therefore, we skated outside.\nWrong: The rink was full, therefore we skated outside. (comma splice)"},
  "adverbial-phrase": {title:"Finding an adverbial phrase", steps:[
    "Adverbial phrases answer how, when, where, why, or to what extent about the VERB.",
    "They usually start with a preposition (with, after, before, in, by, during).",
    "Test: can you move the phrase to the front of the sentence and still make sense? Adverbials usually can."],
    ex:"“She finished her essay before the deadline.”\nBefore the deadline tells WHEN she finished → adverbial phrase.\nMove it: “Before the deadline, she finished her essay.” ✓"},
  "indirect-object": {title:"Direct and indirect objects", steps:[
    "Find the verb, then ask 'what?' — that answer is the direct object.",
    "Then ask 'to whom or for whom?' — that answer is the indirect object.",
    "The indirect object comes BEFORE the direct object, with no preposition."],
    ex:"“Dad bought my sister a hoodie.”\nBought what? a hoodie → direct object.\nFor whom? my sister → indirect object.\nRewritten with a preposition: “Dad bought a hoodie for my sister” — now it is a prepositional phrase, not an indirect object."},
  "predicate-adjective": {title:"Predicate adjectives and predicate nouns", steps:[
    "Both follow a LINKING verb (is, are, was, seem, feel, become, look, taste).",
    "Predicate adjective describes the subject: 'The soup is salty.'",
    "Predicate noun renames the subject: 'My cousin is the goalie.'",
    "Action verbs take objects instead — the object is not the subject."],
    ex:"“The music sounded loud.” — sounded is linking, loud describes the music → predicate adjective.\n“The band played loud music.” — played is an action verb, music is the direct object."},
  "complex-sentence": {title:"Simple, compound and complex sentences", steps:[
    "Simple: one independent clause.",
    "Compound: two independent clauses joined by and, but, or, so, or by a semicolon.",
    "Complex: one independent clause plus at least one SUBORDINATE clause.",
    "Subordinate clauses start with words like because, although, when, if, since, while, after — and cannot stand alone."],
    ex:"Simple: The lights went out.\nCompound: The lights went out, and the fridge stopped humming.\nComplex: When the lights went out, the whole street went quiet.\nCombining two ideas with a subordinating word also shows HOW they relate — cause, time, contrast."},
  "dash-ellipsis": {title:"Dashes and ellipses", steps:[
    "A dash (—) marks a sudden break, an interruption, or an emphatic aside.",
    "An ellipsis (…) shows words left out of a quotation, or a trailing-off pause.",
    "A pair of dashes can set off an aside where commas would be too weak."],
    ex:"Dash: He reached for the last cookie — and thought better of it.\nEllipsis (omission): The report said the plan was “ambitious … but underfunded.”\nEllipsis (trailing off): “I thought you said …”"},
  "participle": {title:"Participles", steps:[
    "A participle is formed from a verb but works as a modifier: -ing (present) or -ed/-en (past).",
    "If the word describes a noun, it is a participle. If it IS the action with a helping verb, it is part of the verb.",
    "A participial phrase at the start of a sentence must modify the subject, or it dangles."],
    ex:"Participle: Exhausted from the game, she fell asleep on the bus. (describes she)\nVerb: She was exhausting the goalie with shot after shot. (part of the verb phrase)\nDangling: Running for the bus, the backpack split. (the backpack was not running)"},

  /* ---------- language: reading ---------- */
  "inference": {title:"Making an inference", steps:[
    "Note what the text says explicitly.",
    "Add what you know from experience or elsewhere in the text.",
    "State the conclusion — and be able to point to the evidence behind it.",
    "An inference must be supported. If nothing in the text points to it, it is a guess."],
    ex:"Text: “He kept the porch light on and checked the window every few minutes.”\nStated: light on, repeated checking.\nInference: he is waiting anxiously for someone.\nEvidence: you leave a light on for an arrival, and repeated checking signals worry — the text never uses the word 'worried'."},
  "word-choice-tone": {title:"How word choice creates tone", steps:[
    "Find the loaded words — the ones carrying feeling beyond their plain meaning.",
    "Ask what a neutral synonym would have been, and what changed.",
    "Name the tone in a word or two: uneasy, wry, admiring, bleak.",
    "Then explain the effect on the reader, not just the label."],
    ex:"“The wind picked at the shutters” vs “The wind moved the shutters.”\nPicked suggests something deliberate and irritating — it makes the house feel besieged. Same event, different feeling."},
  "point-of-view": {title:"Identifying point of view", steps:[
    "First person: uses I / we — the narrator is in the story.",
    "Second person: uses you — the reader is addressed directly.",
    "Third person: uses he / she / they.",
    "Then narrow it: third-person LIMITED reports one character's thoughts; OMNISCIENT reports several characters' thoughts."],
    ex:"“She wondered whether he had noticed, but he gave nothing away.”\nThird person (she, he), and we get only her thoughts — his are hidden. Limited.\nAn omniscient narrator would have told us what he was thinking too."},
  "irony": {title:"Recognizing irony", steps:[
    "Irony is a gap between what is said and what is meant, or between what is expected and what happens.",
    "Verbal: the words say one thing and mean another.",
    "Situational: the outcome is the opposite of what was expected.",
    "Dramatic: the reader knows something a character does not."],
    ex:"Verbal: “Perfect timing,” she said as the bus pulled away.\nSituational: the lifeguard who cannot swim.\nDramatic: the reader knows the letter never arrived; the character thinks it was ignored."},
  "main-idea": {title:"Finding the main idea", steps:[
    "Ask what the whole text is about, not what one interesting sentence says.",
    "Check the first and last paragraphs — main ideas often sit there.",
    "Test a candidate: does every paragraph support it? If a big chunk does not, it is too narrow.",
    "Reject options that state something the text never confirms."],
    ex:"An article describes three failed attempts to build a canal, then a successful fourth.\nToo narrow: “The fourth attempt succeeded.”\nToo broad: “Canals are hard to build.”\nMain idea: “Repeated failures produced the engineering knowledge that finally made the canal possible.”"},
  "explicit-detail": {title:"Answering from explicit evidence", steps:[
    "Find the sentence in the text that answers the question and reread it.",
    "Match the answer option to what the text actually SAYS, not what sounds plausible.",
    "Watch for options that reverse the text, or that are true in general but absent here."],
    ex:"Text: “The bridge was not designed for freight; it was built for foot traffic.”\nQuestion: what was the bridge built for?\nThe text states it directly — foot traffic. An option saying “light freight” contradicts the sentence, however reasonable it sounds."},
  "text-form": {title:"Identifying text form and genre", steps:[
    "Narrative: tells a story — characters, setting, events over time.",
    "Expository/informational: explains a topic with facts and examples.",
    "Persuasive: argues a position and wants you to agree.",
    "Procedural: gives steps to follow.",
    "Look at the purpose and the features, not the subject matter."],
    ex:"A piece about the Escarpment could be any of these: a hike memoir (narrative), an explanation of how it formed (expository), an argument against a quarry permit (persuasive), or trail directions (procedural)."},
  "text-pattern": {title:"Identifying the text pattern", steps:[
    "Cause and effect: this happened, so that resulted. Signals: because, as a result, therefore.",
    "Compare and contrast: similarities and differences. Signals: however, whereas, both.",
    "Chronological: ordered in time. Signals: first, then, by 1890.",
    "Problem and solution: an issue, then what was done about it."],
    ex:"“Because the softer shale eroded faster, the hard cap was left standing as a ridge.”\nThe word because plus a result → cause and effect."},

  /* ---------- language: critical thinking ---------- */
  "foreshadowing": {title:"Foreshadowing", steps:[
    "Look for an early detail that seems small but is mentioned deliberately.",
    "Ask whether a later event makes that detail suddenly matter.",
    "Foreshadowing prepares the reader; it is not the same as a flashback (which looks backward) or a symbol (which carries meaning)."],
    ex:"Chapter 2 mentions the smoke detector has been chirping for weeks. Chapter 9 has a kitchen fire nobody was warned about. The early detail made the ending feel inevitable rather than random."},
  "symbolism": {title:"Symbolism", steps:[
    "Find an object, place or image that recurs at meaningful moments.",
    "Ask what idea it is standing in for beyond its literal self.",
    "Repetition at significant points is the signal — one mention is usually just an object.",
    "Support your reading with where it appears."],
    ex:"A character's worn hockey tape appears when she chooses to keep playing, and again when she quits. The tape stands for the effort she has already invested — that is why it shows up at exactly those two decisions."},
  "bias-detect": {title:"Spotting bias", steps:[
    "Separate what can be verified from what is being judged.",
    "Look for loaded words, one-sided sourcing, missing context, and unnamed 'experts'.",
    "Ask who is left out of the account and who benefits from the framing.",
    "Neutral reporting can still be biased through selection — what got left in."],
    ex:"“A handful of complainers derailed the sensible plan” vs “Six residents raised concerns and the plan was postponed.”\nSame facts. The first judges the people and the plan; the second reports what happened."},
  "bias-fix": {title:"Reducing bias in writing", steps:[
    "Replace loaded words with neutral description.",
    "Attribute opinions to whoever holds them, instead of stating them as fact.",
    "Include the substance of the other side — the actual reasons, not a token mention.",
    "Do not 'balance' by adding equally loaded language for the other side."],
    ex:"Before: The reckless proposal was pushed through by developers.\nAfter: The proposal passed 6–3. Residents who opposed it cited traffic and flooding; the developer's submission projected 40 new units."},
  "text-features": {title:"Text features and what they do", steps:[
    "Bibliography / works cited: lists sources so claims can be checked.",
    "Glossary: defines specialized words. Index: locates topics by page.",
    "Headings, captions, sidebars: organize and add context.",
    "Accessible fonts, alt text, contrast: make the text usable by more readers.",
    "Each feature has a job — name the job, not the feature."],
    ex:"Asked what a bibliography contributes, the answer is verification: a reader can go to the sources and judge whether the claim holds — not merely 'it lists books at the end'."},
  "visual-design": {title:"How images and design carry meaning", steps:[
    "Ask what the visual makes you notice first, and what it makes you feel.",
    "Look at scale, colour, cropping, and what is left out of frame.",
    "A picture can clarify AND distort — a pictorial bar scaled in two directions overstates a one-directional difference.",
    "Say what the design contributes, then note its limits."],
    ex:"An infographic doubles a phone icon's height AND width to show 'twice as much'. The area is four times bigger, so the eye reads a much larger gap than the data supports."},
  "connotation": {title:"Connotation vs denotation", steps:[
    "Denotation is the dictionary meaning; connotation is the feeling attached.",
    "Swap the word for a neutral synonym and see what shifts.",
    "Writers steer readers with connotation while keeping the facts technically accurate."],
    ex:"Crowd, mob, gathering, throng — all denote a lot of people. Mob adds threat; gathering sounds harmless. Choosing between them shapes the reader's impression without changing a single fact."},
  "source-eval": {title:"Evaluating and synthesizing sources", steps:[
    "For each source: who made it, when, and what evidence does it offer?",
    "Ask what the creator gains — funding, sales, political position.",
    "Agreement is not proof: two sources may simply be repeating a third.",
    "Synthesize by explaining WHY they differ, not by counting votes."],
    ex:"Two blogs and one peer-reviewed study disagree. Both blogs cite the same press release; the study has data and methods. The right move is to weigh the evidence, not the tally — and to say where the blogs' claim came from."},
  "message": {title:"Identifying the message about a topic", steps:[
    "Separate the topic (what it is about) from the message (what it says about it).",
    "Watch what the text chooses to show and whose experience it follows.",
    "State the message as a claim, not a subject: not 'accessibility', but 'accessibility changes who can take part'.",
    "Point to the choices in the text that carry it."],
    ex:"A documentary on school lunches follows three students through a day.\nTopic: school food programs.\nMessage: a hungry student cannot learn, so lunch is an academic issue and not just a welfare one — carried by pairing empty lunch bags with classroom scenes."},
  "prediction": {title:"Making and adjusting predictions", steps:[
    "Predict using clues in the text plus what you already know.",
    "Read on, then check the prediction against new evidence.",
    "If it is contradicted, revise it AND note which clue misled you.",
    "The point is monitoring your understanding, not being right first time."],
    ex:"You predict the narrator's brother took the money, based on his nervousness. Chapter 10 shows he was away that week.\nRevised: someone with access, and his nervousness had another cause — probably what he knows and is hiding, which is the clue you misread."}
};

/* "What's this asking?" — decodes the question type and points at what to look
   for, without giving the answer away. Keyed by help family. */
const ASK = {
  /* math: number */
  "perfect-squares":"You're being asked whether a number is a perfect square, or what its square root is. A perfect square is a number you get by multiplying a whole number by itself. Run through the squares you know and see if your number is one of them.",
  "sqrt-estimate":"You're not being asked for an exact answer — you're being asked to place a square root between two whole numbers. Find the nearest perfect square below and above, and the root sits between their roots.",
  "frac-to-percent":"You're converting a fraction into a percent. Percent means 'out of 100', so the job is to turn the fraction into a decimal first, then scale it to 100.",
  "decimal-percent":"You're converting a decimal into a percent. The only real risk here is counting decimal places wrong, so slow down on that step.",
  "decimal-fraction":"You're converting a decimal into a fraction, and it has to be in lowest terms. That means two jobs: write the fraction, then simplify it.",
  "rounding-decimals":"You're rounding to a specific place value. The question names the place — find that digit first, then look at only the ONE digit to its right to decide.",
  "compare-decimals":"You're comparing decimals by size. Longer is not bigger — compare place by place, starting with tenths.",
  "powers-of-ten":"You're rewriting a number written with a power of ten into ordinary form. The exponent tells you how far the decimal point moves.",
  "integer-add-sub":"You're adding or subtracting positive and negative numbers. Watch the signs carefully — two minuses in a row change the meaning.",
  "integer-mult-div":"You're multiplying or dividing integers. Do the digits first, then work out the sign separately.",
  "order-of-ops":"You're being tested on the ORDER you do the operations in, not on the arithmetic itself. Work through brackets, exponents, then multiply/divide, then add/subtract.",
  "percent-mental":"You're finding a percent of a number using mental math — no calculator needed. Break the percent into friendly pieces like 10%, 5% and 1%.",
  "proportional":"You're given a rate for one quantity and asked about a different quantity at the same rate. Find the cost or amount for ONE unit first.",
  "add-fractions":"You're adding or subtracting fractions with different denominators. You can't do anything until the denominators match.",

  /* math: algebra */
  "evaluate-expression":"You're given an expression and the value of each variable. Substitute the values in, then follow the order of operations.",
  "solve-one-side":"You're solving for the variable. Peel the operations off one at a time — undo adding/subtracting first, then multiplying/dividing.",
  "solve-both-sides":"The variable appears on BOTH sides of the equals sign. Your first move is to get all the variable terms onto one side.",

  "pattern-rate":"You're being asked how a pattern grows and where it starts. Find the difference between consecutive terms.",
