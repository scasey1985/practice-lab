<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practice Lab</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Practice Lab"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>Practice Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
<style>
  /* ---------- skins: she picks one, it sticks ---------- */
  .app{
    --bg1:#FDF4F7; --bg2:#F2EAFB; --bg3:#FFF8F2;
    --card:#FFFFFF; --card2:#FBF4F8;
    --ink:#3A2340; --ink2:#6B5273; --muted:#95839B;
    --line:#EFE0EA; --line2:#E0CBDA;
    --brand:#B0349B; --brand2:#7A4BD0; --brandsoft:#FBE8F6;
    --math:#8B47C9; --mathsoft:#F1E6FB;
    --sci:#118C86; --scisoft:#DDF2F0;
    --lang:#C43C77; --langsoft:#FCE4EE;
    --fr:#2F5FD0; --frsoft:#E4ECFC;
    --ok:#12805C; --oksoft:#DCF3EA; --okline:#7FCBB0;
    --no:#C23B4E; --nosoft:#FCE4E7; --noline:#EDA3AE;
    --ring:#F0DCEA;
    --shadow:0 2px 4px rgba(122,75,208,.06), 0 14px 30px -18px rgba(122,75,208,.45);
    --glow:0 0 0 4px var(--brandsoft);
  }
  .app[data-skin="lagoon"]{
    --bg1:#EDF8F7; --bg2:#E6F1FB; --bg3:#F4FBF8;
    --card:#FFFFFF; --card2:#F1F8F8;
    --ink:#123037; --ink2:#3D5A61; --muted:#77949C;
    --line:#DBEBEA; --line2:#C2DCDB;
    --brand:#0E7C8B; --brand2:#2A6FB0; --brandsoft:#DCF0F2;
    --math:#2A6FB0; --mathsoft:#E2EDF9;
    --sci:#0E8A72; --scisoft:#DCF2EC;
    --lang:#7A5BC4; --langsoft:#EBE6F9;
    --fr:#C0457E; --frsoft:#FBE5EF;
    --ok:#0F7A5F; --oksoft:#DBF2EA; --okline:#78C8AE;
    --no:#BF4048; --nosoft:#FBE4E6; --noline:#EBA4A9;
    --ring:#D5EAEA;
    --shadow:0 2px 4px rgba(14,124,139,.07), 0 14px 30px -18px rgba(14,124,139,.5);
  }
  .app[data-skin="sunset"]{
    --bg1:#FFF4EC; --bg2:#FDECEA; --bg3:#FFF9F0;
    --card:#FFFFFF; --card2:#FDF3EC;
    --ink:#3E2418; --ink2:#6E4E3D; --muted:#9C8071;
    --line:#F3E1D5; --line2:#E6CBB8;
    --brand:#C4551E; --brand2:#B03A5B; --brandsoft:#FCE7DA;
    --math:#B03A5B; --mathsoft:#FBE3EA;
    --sci:#12796B; --scisoft:#DBF0EC;
    --lang:#C4551E; --langsoft:#FCE7DA;
    --fr:#2A6FB0; --frsoft:#E2EDF9;
    --ok:#12795A; --oksoft:#DBF1E8; --okline:#77C6AC;
    --no:#C0392B; --nosoft:#FBE3E0; --noline:#EDA79E;
    --ring:#F5DECB;
    --shadow:0 2px 4px rgba(196,85,30,.07), 0 14px 30px -18px rgba(196,85,30,.45);
  }
  .app[data-skin="midnight"]{
    --bg1:#171029; --bg2:#0F1226; --bg3:#1C1233;
    --card:#221A3A; --card2:#2B2148;
    --ink:#F0EAFB; --ink2:#C6BAE2; --muted:#9689B5;
    --line:#33284F; --line2:#463868;
    --brand:#E48AD4; --brand2:#A98CF5; --brandsoft:#33234B;
    --math:#B49BF7; --mathsoft:#2C2350;
    --sci:#5FCFC0; --scisoft:#173634;
    --lang:#F08FB8; --langsoft:#3A2036; --fr:#8FB4F7; --frsoft:#1E2A48;
    --ok:#5FD3A6; --oksoft:#15332A; --okline:#2E6B55;
    --no:#F58A93; --nosoft:#361D24; --noline:#7A3A45;
    --ring:#332852;
    --shadow:0 2px 4px rgba(0,0,0,.35), 0 16px 34px -20px #000;
  }
  @media (prefers-color-scheme: dark){
    .app:not([data-skin]){
      --bg1:#171029; --bg2:#0F1226; --bg3:#1C1233;
      --card:#221A3A; --card2:#2B2148;
      --ink:#F0EAFB; --ink2:#C6BAE2; --muted:#9689B5;
      --line:#33284F; --line2:#463868;
      --brand:#E48AD4; --brand2:#A98CF5; --brandsoft:#33234B;
      --math:#B49BF7; --mathsoft:#2C2350;
      --sci:#5FCFC0; --scisoft:#173634;
      --lang:#F08FB8; --langsoft:#3A2036; --fr:#8FB4F7; --frsoft:#1E2A48;
      --ok:#5FD3A6; --oksoft:#15332A; --okline:#2E6B55;
      --no:#F58A93; --nosoft:#361D24; --noline:#7A3A45;
      --ring:#332852;
      --shadow:0 2px 4px rgba(0,0,0,.35), 0 16px 34px -20px #000;
    }
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{
    margin:0;
    font-family:"Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
    font-size:16.5px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    background:#FDF4F7;
  }
  .app{
    min-height:100vh;
    background:
      radial-gradient(1100px 520px at 8% -8%, var(--bg2) 0%, transparent 60%),
      radial-gradient(900px 480px at 96% 4%, var(--bg3) 0%, transparent 55%),
      var(--bg1);
    color:var(--ink);
    padding-bottom:64px;
  }
  .shell{max-width:720px;margin:0 auto;padding:18px 16px 40px}

  h1,h2,h3,.display{font-family:"Baloo 2","Nunito",sans-serif;margin:0;letter-spacing:0;text-wrap:balance;line-height:1.2}
  h1{font-size:1.75rem;font-weight:800}
  h2{font-size:1.3rem;font-weight:700}
  h3{font-size:1.05rem;font-weight:700}
  p{margin:0}
  button{font-family:inherit;font-size:1rem;cursor:pointer}
  :focus-visible{outline:3px solid var(--brand2);outline-offset:3px;border-radius:14px}
  .mono{font-family:"DM Mono",ui-monospace,monospace}
  .muted{color:var(--muted);font-size:.9rem}

  /* ---------- header ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;padding:8px 0 16px;flex-wrap:wrap}
  .hello{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto}
  .hello .sub{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tools{display:flex;gap:8px;flex:0 0 auto;align-items:center}
  @media (max-width:520px){
    .topbar{flex-direction:column;align-items:stretch;gap:12px}
    .tools{justify-content:flex-start;flex-wrap:wrap}
    h1{font-size:1.55rem}
  }
  .icobtn{
    background:var(--card);border:1.5px solid var(--line);color:var(--ink2);
    border-radius:999px;padding:8px 13px;font-size:.85rem;font-weight:700;
    box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;
  }
  .icobtn:hover{border-color:var(--brand);color:var(--brand)}
  .streak{
    display:inline-flex;align-items:center;gap:6px;background:var(--brandsoft);color:var(--brand);
    border-radius:999px;padding:6px 13px;font-weight:700;font-size:.84rem;border:1.5px solid transparent;
  }

  /* ---------- theme sheet ---------- */
  .skins{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
    background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  .skinbtn{
    border:2px solid var(--line);background:var(--card2);border-radius:14px;padding:9px 4px 8px;
    display:flex;flex-direction:column;align-items:center;gap:7px;font-size:.72rem;font-weight:700;color:var(--ink2);
  }
  .skinbtn[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--brandsoft)}
  .swatch{width:34px;height:20px;border-radius:8px;border:1px solid rgba(0,0,0,.08)}

  /* ---------- cards ---------- */
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
  .pad{padding:20px}
  .stack{display:flex;flex-direction:column;gap:14px}
  .row{display:flex;flex-wrap:wrap;gap:10px}

  .primary{
    background:linear-gradient(135deg, var(--brand) 0%, var(--brand2) 100%);
    color:#fff;border:0;border-radius:16px;padding:15px 22px;font-weight:800;font-size:1.02rem;
    font-family:"Baloo 2","Nunito",sans-serif;box-shadow:var(--shadow);
  }
  .primary:hover{filter:brightness(1.06)}
  .primary[disabled]{opacity:.45;cursor:not-allowed;filter:none}
  .soft{
    background:var(--card);border:1.5px solid var(--line2);color:var(--ink2);border-radius:16px;
    padding:12px 18px;font-weight:700;font-size:.94rem;
  }
  .soft:hover{border-color:var(--brand);color:var(--brand)}

  /* ---------- home ---------- */
  .nowcard{
    display:flex;flex-direction:column;gap:3px;text-align:left;width:100%;
    background:linear-gradient(135deg, var(--brand) 0%, var(--brand2) 100%);
    border:0;border-radius:22px;padding:17px 20px;color:#fff;box-shadow:var(--shadow);
  }
  .nowcard:hover{filter:brightness(1.06)}
  .nowlab{font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.85}
  .nowname{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.25rem;line-height:1.25}
  .nowmeta{font-size:.85rem;font-weight:600;opacity:.9}
  .subjects{display:flex;flex-direction:column;gap:12px}
  .subj{
    text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:22px;
    padding:16px 18px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);width:100%;
  }
  .subj:hover{border-color:var(--tone)}
  @media (prefers-reduced-motion: no-preference){.subj{transition:transform .15s ease, border-color .15s ease}.subj:hover{transform:translateY(-2px)}}
  .subj .txt{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-width:0}
  .subj .nm{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.18rem;color:var(--ink)}
  .subj .sm{font-size:.85rem;color:var(--muted);font-weight:600}
  .ringwrap{flex:0 0 54px;width:54px;height:54px;position:relative}
  .ringwrap svg{transform:rotate(-90deg)}
  .ringwrap .val{
    position:absolute;inset:0;display:grid;place-items:center;font-size:.82rem;font-weight:800;
    font-family:"Baloo 2",sans-serif;color:var(--tone);
  }

  .topics{display:flex;flex-direction:column;gap:10px}
  .topic{
    display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;
    background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;
  }
  .topic:hover{border-color:var(--tone)}
  .topic .tn{font-weight:700;color:var(--ink);font-size:1rem}
  .topic .tc{font-size:.78rem;color:var(--muted);font-weight:600}
  .topic .tp{font-family:"Baloo 2",sans-serif;font-weight:700;color:var(--tone);font-size:.95rem;flex:0 0 auto}

  /* ---------- quiz ---------- */
  .qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .dots{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
  .dot{width:100%;height:7px;border-radius:99px;background:var(--ring);flex:1 1 0}
  .dot.ok{background:var(--ok)}
  .dot.no{background:var(--no)}
  .dot.part{background:var(--line2)}
  .dot.now{background:var(--tone)}
  .writewrap textarea{
    width:100%;border:2px solid var(--line2);border-radius:16px;padding:14px 16px;margin-top:16px;
    font-family:inherit;font-size:1rem;line-height:1.55;background:var(--card);color:var(--ink);resize:vertical;
  }
  .writewrap textarea:focus{border-color:var(--brand);outline:none;box-shadow:var(--glow)}
  .writewrap textarea:disabled{opacity:.75}
  .pointlist{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:7px;font-size:.94rem;color:var(--ink2)}
  .tag{
    display:inline-block;font-size:.74rem;font-weight:800;letter-spacing:.02em;
    padding:5px 11px;border-radius:999px;background:var(--tonesoft);color:var(--tone);
  }
  .passage{
    background:var(--card2);border:1.5px solid var(--line);border-radius:16px;padding:15px 17px;
    max-height:240px;overflow-y:auto;font-size:.97rem;line-height:1.7;margin-bottom:14px;
  }
  .passage h4{margin:2px 0 8px;font-family:"Baloo 2",sans-serif;font-size:1rem}
  .passage p{margin:0 0 10px}
  .passage .kind{font-size:.72rem;color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .qtext{font-size:1.2rem;font-weight:700;line-height:1.45;margin:12px 0 0;color:var(--ink)}

  .helprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .hbtn{
    background:var(--card2);border:1.5px solid var(--line2);color:var(--ink2);border-radius:999px;
    padding:9px 15px;font-size:.87rem;font-weight:700;display:inline-flex;align-items:center;gap:7px;
  }
  .hbtn:hover{border-color:var(--brand);color:var(--brand)}
  .hbtn[aria-expanded="true"]{background:var(--brandsoft);border-color:var(--brand);color:var(--brand)}
  .panel{
    margin-top:12px;background:var(--card2);border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;
  }
  .panel h3{margin-bottom:8px}
  .panel .steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:7px;font-size:.96rem;color:var(--ink2)}
  .worked{margin-top:13px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px}
  .wlabel{display:block;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .wbody{font-family:"DM Mono",ui-monospace,monospace;font-size:.87rem;line-height:1.8;color:var(--ink);overflow-x:auto}

  .choices{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .choice{
    display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--card);border:2px solid var(--line2);border-radius:16px;padding:14px 15px;color:var(--ink);
    font-size:1rem;line-height:1.45;
  }
  .choice:hover:not(:disabled){border-color:var(--tone);background:var(--tonesoft)}
  .choice .k{
    flex:0 0 27px;height:27px;border-radius:9px;background:var(--card2);color:var(--muted);
    display:grid;place-items:center;font-weight:800;font-size:.85rem;font-family:"Baloo 2",sans-serif;
  }
  .choice.correct{border-color:var(--okline);background:var(--oksoft)}
  .choice.correct .k{background:var(--ok);color:#fff}
  .choice.wrong{border-color:var(--noline);background:var(--nosoft)}
  .choice.wrong .k{background:var(--no);color:#fff}
  .choice:disabled{cursor:default;opacity:1}
  .numrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .numrow input{
    flex:1 1 170px;font-family:"DM Mono",monospace;font-size:1.15rem;padding:14px 16px;
    border:2px solid var(--line2);border-radius:16px;background:var(--card);color:var(--ink);
  }
  .numrow input:focus{border-color:var(--brand);outline:none;box-shadow:var(--glow)}

  /* ---------- feedback ---------- */
  .fb{border-radius:18px;padding:16px 18px;margin-top:16px;border:2px solid var(--line)}
  .fb.ok{background:var(--oksoft);border-color:var(--okline)}
  .fb.no{background:var(--nosoft);border-color:var(--noline)}
  .verdict{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.15rem;margin-bottom:4px}
  .fb.ok .verdict{color:var(--ok)}
  .fb.no .verdict{color:var(--no)}
  .fb .why{font-size:.97rem;color:var(--ink2)}
  .solbox{
    margin-top:13px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;
  }
  .solbox .wlabel{margin-bottom:9px}
  .solline{font-size:.95rem;line-height:1.75;color:var(--ink)}
  .solline .em{font-weight:700}
  @media (prefers-reduced-motion: no-preference){
    .fb{animation:rise .22s ease-out}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .fb{animation-fill-mode:both}
  }

  /* ---------- results ---------- */
  .scorewrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .bigring{flex:0 0 108px;width:108px;height:108px;position:relative}
  .bigring svg{transform:rotate(-90deg)}
  .bigring .val{position:absolute;inset:0;display:grid;place-items:center;flex-direction:column;text-align:center}
  .bigring .n{font-family:"Baloo 2",sans-serif;font-size:1.9rem;font-weight:800;color:var(--brand);line-height:1}
  .reviewlist{display:flex;flex-direction:column;gap:8px}
  .revrow{display:flex;align-items:center;gap:10px;font-size:.93rem;color:var(--ink2)}

  /* ---------- progress ---------- */
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{background:var(--card2);border:1.5px solid var(--line);border-radius:16px;padding:13px 15px}
  .stat .n{font-family:"Baloo 2",sans-serif;font-size:1.5rem;font-weight:800;color:var(--brand);line-height:1.1}
  .stat .l{font-size:.8rem;color:var(--muted);font-weight:700}
  .coderow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:.88rem}
  .mini{height:8px;border-radius:99px;background:var(--ring);overflow:hidden}
  .mini i{display:block;height:100%;border-radius:99px}
  .num{font-family:"DM Mono",monospace;font-size:.78rem;color:var(--muted);text-align:right;white-space:nowrap}
  .sep{height:1.5px;background:var(--line);border-radius:2px;margin:2px 0}
  .danger{background:none;border:1.5px solid var(--line2);color:var(--no);border-radius:14px;padding:10px 15px;font-size:.88rem;font-weight:700}
  .savenote{font-size:.78rem;color:var(--muted);text-align:center;margin-top:20px;font-weight:600}

  /* ---------- daily log ---------- */
  .banner{
    background:var(--brandsoft);border:1.5px solid var(--brand);color:var(--brand);
    border-radius:18px;padding:14px 16px;font-weight:700;font-size:.92rem;
  }
  .chart{display:flex;flex-direction:column;gap:9px}
  .bars{display:flex;align-items:flex-end;gap:2px;height:132px}
  .barcol{
    flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;
    background:none;border:0;padding:0;cursor:pointer;
  }
  .barwrap{flex:1 1 auto;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .bar{
    display:block;width:100%;max-width:26px;background:var(--brand);
    border-radius:4px 4px 0 0;min-height:0;
  }
  .bar.zero{height:3px !important;background:var(--ring)}
  .barcol.sel .bar{background:var(--brand2)}
  .barcol:hover .bar{filter:brightness(1.12)}
  .barlab{font-size:.66rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .barnote{
    font-size:.84rem;color:var(--ink2);font-weight:700;border-top:1.5px solid var(--line);padding-top:9px;
  }
  .dayrow{background:var(--card2);border:1.5px solid var(--line);border-radius:16px;padding:13px 15px}
  .bar.acc{background:var(--ok)}
  .fixcard{
    display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;
    background:var(--card);border:1.5px solid var(--brand);border-radius:22px;padding:15px 18px;box-shadow:var(--shadow);
  }
  .fixtxt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .fixname{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1.1rem;color:var(--ink)}
  .fixmeta{font-size:.84rem;color:var(--muted);font-weight:600}
  .fixgo{background:var(--brandsoft);color:var(--brand);font-weight:800;border-radius:999px;padding:7px 15px;font-size:.88rem;flex:0 0 auto}
  .fixstats{display:flex;gap:18px;font-size:.9rem;color:var(--ink2)}
  .fixstats b{font-family:"Baloo 2",sans-serif;font-size:1.25rem;color:var(--brand);margin-right:3px}
  .fixedtag{font-size:.72rem;font-weight:800;color:var(--ok);background:var(--oksoft);padding:3px 9px;border-radius:999px}
  .wrow.isfixed{opacity:.72}
  .sgroup{display:flex;flex-direction:column;gap:8px}
  .sh{font-size:.9rem;color:var(--ink2);margin-top:4px}
  .sh.good{color:var(--ok)}
  .sh.work{color:var(--brand)}
  .srow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(60px,1fr) auto;gap:10px;align-items:center;font-size:.86rem}
  .sname{color:var(--ink);font-weight:700;min-width:0;line-height:1.3}

   q:"A pattern starts at 6 and increases by 3 each term (term 1 = 6). Which equation gives the value of term n?",
   choices:["t = 6n + 3","t = 3n + 3","t = 3n + 6","t = n + 3"], a:1,
   why:"Check n = 1: 3(1) + 3 = 6 ✓. Check n = 2: 3(2) + 3 = 9 ✓. The 3 is the rate, and the +3 shifts the line so term 1 lands on 6."},
  {id:"m-a-12", subj:"math", topic:"algebra", code:"C3.1", type:"mc",
   q:"A program says: repeat 4 [ move forward 60; turn right 90° ]. What shape does it draw?",
   choices:["A triangle","A square","A rectangle that is not a square","An octagon"], a:1,
   why:"Four equal sides with four 90° turns closes a square. The repeat count and the turn angle have to agree: 360 ÷ 90 = 4."},
  {id:"m-a-13", subj:"math", topic:"algebra", code:"C3.2", type:"mc",
   q:"A program says: repeat 4 [ move forward 60; turn right 90° ], which draws a square. You change the turn to 120° and the repeat count to 3. What does it draw now?",
   choices:["It draws a triangle","It draws nothing","It draws a square with rounded corners","It repeats forever"], a:0,
   why:"3 turns of 120° add to 360°, so the path closes — an equilateral triangle."},

  /* ============ MATH — DATA (Strand D) ============ */
  {id:"m-d-01", subj:"math", topic:"data", code:"D1.3", type:"mc",
   q:"You want to show how a school's 400 students are divided among four bus routes. Which graph is best suited?",
   choices:["Line graph","Circle graph","Scatter plot","Histogram"], a:1,
   why:"A circle graph shows parts of a whole. A line graph is for change over time, and a scatter plot is for the relationship between two variables."},
  {id:"m-d-02", subj:"math", topic:"data", code:"D1.1", type:"mc",
   q:"Why are percentages often used instead of raw counts when comparing two schools of different sizes?",
   choices:["Percentages are always smaller numbers","Percentages show the share of each group, so different-sized groups can be compared fairly","Percentages remove outliers","Percentages are required on circle graphs"], a:1,
   why:"120 students out of 300 and 200 out of 1000 are very different shares (40% vs 20%) even though the second count is larger. Percentages make the comparison fair."},
  {id:"m-d-03", subj:"math", topic:"data", code:"D1.3", type:"num",
   q:"On a circle graph, a category makes up 25% of the data. How many degrees is its sector?", a:90,
   why:"25% of 360° = 0.25 × 360 = 90°."},
  {id:"m-d-04", subj:"math", topic:"data", code:"D1.3", type:"num",
   q:"In a survey of 360 students, one category takes up 20% of the circle graph. How many students is that?", a:72,
   why:"20% of 360 = 0.20 × 360 = 72 students."},
  {id:"m-d-05", subj:"math", topic:"data", code:"D1.5", type:"num",
   q:"The data set 4, 6, 8, 10, 12 has a mean of 8. A new value, 26, is added. What is the new mean?", a:11,
   why:"The new total is 40 + 26 = 66, spread over 6 values: 66 ÷ 6 = 11. One large value pulls the mean up noticeably."},
  {id:"m-d-06", subj:"math", topic:"data", code:"D1.5", type:"num",
   q:"What is the median of 3, 7, 7, 9, 12, 15?", a:8,
   why:"With six values the median is the mean of the two middle ones: (7 + 9) ÷ 2 = 8."},
  {id:"m-d-07", subj:"math", topic:"data", code:"D1.6", type:"mc",
   q:"A bar graph makes a small difference between two bars look enormous. What is the most likely reason?",
   choices:["The bars are different colours","The vertical axis does not start at zero","The graph has a title","The data is in percentages"], a:1,
   why:"Truncating the vertical axis exaggerates differences. It is the most common way a graph misleads without containing a single false number."},
  {id:"m-d-08", subj:"math", topic:"data", code:"D2.1", type:"mc",
   q:"You draw one marble from a bag and do NOT put it back, then draw a second. These two events are:",
   choices:["Independent, because each draw is separate","Dependent, because the first draw changes what is left","Impossible to compare","Always equally likely"], a:1,
   why:"Without replacement, the first draw changes both the number of marbles and the mix, so the second probability depends on the first."},
  {id:"m-d-09", subj:"math", topic:"data", code:"D2.2", type:"mc",
   q:"You flip a fair coin twice. What is the theoretical probability of getting two heads?",
   choices:["1/2","1/3","1/4","2/3"], a:2,
   why:"The flips are independent: 1/2 × 1/2 = 1/4. The four equally likely outcomes are HH, HT, TH, TT."},
  {id:"m-d-10", subj:"math", topic:"data", code:"D2.2", type:"mc",
   q:"A bag holds 3 red and 5 blue marbles. You draw two without replacement. What is the probability both are red?",
   choices:["3/28","9/64","1/4","3/8"], a:0,
   why:"First draw: 3/8. After a red is removed, second draw: 2/7. Multiply: 6/56 = 3/28."},
  {id:"m-d-11", subj:"math", topic:"data", code:"D1.2", type:"mc",
   q:"Which of these is continuous quantitative data?",
   choices:["Number of siblings each student has","Favourite sport","Height of each student in centimetres","Bus route number"], a:2,
   why:"Height can take any value in a range, so it is continuous. Counts like siblings are discrete, and sport and route number are qualitative labels."},

  /* ============ MATH — SPATIAL SENSE (Strand E) ============ */
  {id:"m-s-01", subj:"math", topic:"spatial", code:"E2.3", type:"num",
   q:"A circle has a diameter of 10 cm. What is its circumference, in cm? (Use π ≈ 3.14, answer to one decimal place.)", a:31.4, tol:0.15,
   why:"C = πd = 3.14 × 10 = 31.4 cm."},
  {id:"m-s-02", subj:"math", topic:"spatial", code:"E2.3", type:"num",
   q:"A circle has a radius of 6 cm. What is its circumference, in cm? (Use π ≈ 3.14, one decimal place.)", a:37.7, tol:0.2,
   why:"C = 2πr = 2 × 3.14 × 6 = 37.68, which rounds to 37.7 cm."},
  {id:"m-s-03", subj:"math", topic:"spatial", code:"E2.5", type:"num",
   q:"A circle has a radius of 5 cm. What is its area, in cm²? (Use π ≈ 3.14.)", a:78.5, tol:0.3,
   why:"A = πr² = 3.14 × 25 = 78.5 cm². Note that the radius is squared, not doubled."},
  {id:"m-s-04", subj:"math", topic:"spatial", code:"E2.5", type:"num",
   q:"A circle has a diameter of 14 cm. What is its area, in cm²? (Use π ≈ 3.14, one decimal place.)", a:153.9, tol:0.4,
   why:"Halve the diameter first: r = 7. A = 3.14 × 49 = 153.86 ≈ 153.9 cm². Forgetting to halve is the usual trap."},
  {id:"m-s-05", subj:"math", topic:"spatial", code:"E2.7", type:"num",
   q:"A cylinder has a radius of 3 cm and a height of 10 cm. What is its volume, in cm³? (Use π ≈ 3.14.)", a:282.6, tol:0.6,
   why:"V = area of base × height = πr²h = 3.14 × 9 × 10 = 282.6 cm³."},
  {id:"m-s-06", subj:"math", topic:"spatial", code:"E2.7", type:"num",
   q:"A triangular prism has a base area of 12 cm² and a height of 9 cm. What is its volume, in cm³?", a:108,
   why:"V = base area × height = 12 × 9 = 108 cm³. Every prism and cylinder works this way."},
  {id:"m-s-07", subj:"math", topic:"spatial", code:"E2.6", type:"num",
   q:"A cylinder has a radius of 2 cm and a height of 5 cm. What is its total surface area, in cm²? (Use π ≈ 3.14, one decimal place.)", a:87.9, tol:0.4,
   why:"Two circles plus the rectangle that wraps around: 2πr² = 25.12, and 2πrh = 62.8. Total ≈ 87.9 cm²."},
  {id:"m-s-08", subj:"math", topic:"spatial", code:"E2.1", type:"num",
   q:"A container holds 250 mL of water. What is that volume in cm³?", a:250,
   why:"1 mL is exactly 1 cm³, so the number does not change — only the unit does."},
  {id:"m-s-09", subj:"math", topic:"spatial", code:"E2.2", type:"num",
   q:"Convert 3.5 m² to cm².", a:35000,
   why:"1 m = 100 cm, so 1 m² = 100 × 100 = 10 000 cm². 3.5 × 10 000 = 35 000 cm². Area units convert by the square of the length factor."},
  {id:"m-s-10", subj:"math", topic:"spatial", code:"E2.2", type:"num",
   q:"Convert 4500 cm³ to litres.", a:4.5,
   why:"1000 cm³ = 1 L, so 4500 ÷ 1000 = 4.5 L."},
  {id:"m-s-11", subj:"math", topic:"spatial", code:"E1.4", type:"mc",
   q:"Point A is at (3, −2). It is translated 4 units right and 5 units up. Where does it land?",
   choices:["(7, 3)","(7, −7)","(−1, 3)","(3, 3)"], a:0,
   why:"Right adds to x: 3 + 4 = 7. Up adds to y: −2 + 5 = 3."},
  {id:"m-s-12", subj:"math", topic:"spatial", code:"E1.4", type:"mc",
   q:"Point B is at (−5, 2). It is reflected in the y-axis. Where does it land?",
   choices:["(5, 2)","(−5, −2)","(5, −2)","(2, −5)"], a:0,
   why:"A reflection in the y-axis flips the sign of x only: (−5, 2) → (5, 2)."},
  {id:"m-s-13", subj:"math", topic:"spatial", code:"E1.4", type:"mc",
   q:"Point C is at (4, 1). It is rotated 90° counter-clockwise about the origin. Where does it land?",
   choices:["(1, 4)","(−1, 4)","(−4, −1)","(1, −4)"], a:1,
   why:"A 90° counter-clockwise rotation sends (x, y) to (−y, x): (4, 1) → (−1, 4)."},
  {id:"m-s-14", subj:"math", topic:"spatial", code:"E1.3", type:"mc",
   q:"A square with 5 cm sides is dilated by a scale factor of 3. What happens to its side length and its area?",
   choices:["Sides ×3, area ×3","Sides ×3, area ×9","Sides ×9, area ×3","Sides ×3, area ×6"], a:1,
   why:"Sides become 15 cm. Area goes from 25 cm² to 225 cm² — the scale factor squared."},
  {id:"m-s-15", subj:"math", topic:"spatial", code:"E1.1", type:"mc",
   q:"Which solid has 5 faces, 6 vertices, and 9 edges?",
   choices:["Square-based pyramid","Triangular prism","Cylinder","Rectangular prism"], a:1,
   why:"A triangular prism has 2 triangular faces + 3 rectangular faces = 5 faces, with 3 vertices at each end and 9 edges."},

  /* ============ MATH — FINANCIAL LITERACY (Strand F) ============ */
  {id:"m-f-01", subj:"math", topic:"financial", code:"F1.1", type:"num",
   q:"1 Canadian dollar buys 0.74 US dollars. How many US dollars do you get for CAD $100?", a:74,
   why:"100 × 0.74 = 74 USD."},
  {id:"m-f-02", subj:"math", topic:"financial", code:"F1.1", type:"num",
   q:"1 US dollar costs 1.35 Canadian dollars. What does USD $250 cost in Canadian dollars?", a:337.5, tol:0.01,
   why:"250 × 1.35 = CAD $337.50."},
  {id:"m-f-03", subj:"math", topic:"financial", code:"F1.4", type:"num",
   q:"You put $800 in an account paying 3% SIMPLE interest per year. How much interest do you earn in 2 years, in dollars?", a:48,
   why:"Simple interest is calculated on the original amount only: 800 × 0.03 = $24 per year, × 2 years = $48."},
  {id:"m-f-04", subj:"math", topic:"financial", code:"F1.4", type:"num",
   q:"You put $1000 in an account paying 5% interest COMPOUNDED annually. What is the balance after 2 years, in dollars?", a:1102.5, tol:0.01,
   why:"Year 1: 1000 × 1.05 = $1050. Year 2: 1050 × 1.05 = $1102.50. The second year earns interest on the interest."},
  {id:"m-f-05", subj:"math", topic:"financial", code:"F1.4", type:"mc",
   q:"Over a long period, why does compound interest grow faster than simple interest at the same rate?",
   choices:["The interest rate rises each year","Interest is earned on interest already added, not just on the original amount","Compound interest is taxed less","Banks add a bonus each year"], a:1,
   why:"Compounding means each year's interest is calculated on a larger balance, so the growth accelerates."},
  {id:"m-f-06", subj:"math", topic:"financial", code:"F1.5", type:"mc",
   q:"Which is the better value: 3 granola bars for $5.40, or 5 for $8.75?",
   choices:["3 for $5.40","5 for $8.75","They are identical","Not enough information"], a:1,
   why:"Unit prices: $5.40 ÷ 3 = $1.80 each; $8.75 ÷ 5 = $1.75 each. The five-pack is 5¢ cheaper per bar."},
  {id:"m-f-07", subj:"math", topic:"financial", code:"F1.5", type:"num",
   q:"A $48 hoodie is 25% off. HST of 13% is then added to the sale price. What is the final cost, in dollars?", a:40.68, tol:0.01,
   why:"25% off $48 = $36. Then 36 × 1.13 = $40.68. Tax applies to the discounted price, not the original."},
  {id:"m-f-08", subj:"math", topic:"financial", code:"F1.6", type:"mc",
   q:"Account A charges a flat $4.00 per month with unlimited transactions. Account B charges $0.75 per transaction with no monthly fee. If you make 6 transactions a month, which is cheaper and by how much?",
   choices:["Account A, by $0.50","Account B, by $0.50","Account A, by $4.50","They cost the same"], a:0,
   why:"Account B costs 6 × $0.75 = $4.50; Account A costs a flat $4.00. Account A is cheaper by $0.50 — but only at this number of transactions. Below 6 transactions, B wins."},
  {id:"m-f-09", subj:"math", topic:"financial", code:"F1.2", type:"mc",
   q:"You are researching how to save for a used bike. Which is the most reliable source of information?",
   choices:["A sponsored video from a company selling loans","A financial guide published by a bank's education site or a government consumer agency","A comment on a social media post","An ad promising fast returns"], a:1,
   why:"Reliable sources are ones with accountability and no direct stake in your decision. Sponsored content and ads exist to sell you something."},
  {id:"m-f-10", subj:"math", topic:"financial", code:"F1.3", type:"mc",
   q:"You are saving $15 a week toward a $240 goal. Which factor would most directly interfere with reaching it on schedule?",
   choices:["Setting up an automatic transfer on payday","Unplanned spending that cuts your weekly deposit to $8","Tracking your balance in a notebook","Telling a friend about your goal"], a:1,
   why:"Cutting the deposit nearly in half stretches a 16-week goal to about 30 weeks. The other three options support the goal rather than interfering with it."},

  /* ============ SCIENCE — INTERACTIONS IN THE ENVIRONMENT (Strand B) ============ */
  {id:"s-b-01", subj:"science", topic:"ecosystems", code:"B2.2", type:"mc",
   q:"Which of these is an ABIOTIC component of a pond ecosystem?",
   choices:["Frogs","Algae","Water temperature","Bacteria"], a:2,
   why:"Abiotic means non-living. Temperature, sunlight, water, soil and air are abiotic; frogs, algae and bacteria are all biotic."},
  {id:"s-b-02", subj:"science", topic:"ecosystems", code:"B2.3", type:"mc",
   q:"Which organism is acting as a decomposer?",
   choices:["A hawk eating a mouse","A fungus breaking down a fallen log","A maple tree making sugar from sunlight","A deer eating leaves"], a:1,
   why:"Decomposers break down dead material and return nutrients to the soil. The hawk and deer are consumers; the maple is a producer."},
  {id:"s-b-03", subj:"science", topic:"ecosystems", code:"B2.4", type:"mc",
   q:"In the food chain grass → grasshopper → frog → snake, what do the arrows represent?",
   choices:["The direction energy is transferred","Which animal is largest","The order organisms appeared","Who eats whom, pointing at the prey"], a:0,
   why:"Arrows point in the direction energy flows — from the organism being eaten toward the one eating it."},
  {id:"s-b-04", subj:"science", topic:"ecosystems", code:"B2.4", type:"mc",
   q:"In that same food chain, a disease wipes out most of the frogs. What is the most likely short-term result?",
   choices:["Grasshoppers increase and snakes decrease","Grasshoppers decrease and snakes increase","Nothing changes","Grass disappears immediately"], a:0,
   why:"Removing frogs takes pressure off grasshoppers, so their numbers rise, while snakes lose a food source and decline. Altering one link affects the whole chain."},
  {id:"s-b-05", subj:"science", topic:"ecosystems", code:"B2.5", type:"mc",
   q:"Why does the cycling of matter support sustainability in an ecosystem?",
   choices:["It creates new atoms as needed","The same nutrients are reused again and again rather than running out","It removes all waste from the system permanently","It stops energy from being lost"], a:1,
   why:"Matter cycles: carbon, nitrogen and water are used, released and reused. Energy, unlike matter, flows through and is lost as heat."},
  {id:"s-b-06", subj:"science", topic:"ecosystems", code:"B2.6", type:"mc",
   q:"Bare rock left behind by a retreating glacier is slowly colonized by lichens, then mosses, then small plants. This is an example of:",
   choices:["Secondary succession","Primary succession","Eutrophication","Bioaccumulation"], a:1,
   why:"Primary succession starts where there is no soil at all. Secondary succession happens where soil remains — after a fire or a farm is abandoned."},
  {id:"s-b-07", subj:"science", topic:"ecosystems", code:"B2.7", type:"mc",
   q:"The largest number of a species an ecosystem can support over time is called its:",
   choices:["Biodiversity","Carrying capacity","Biomass","Succession rate"], a:1,
   why:"Carrying capacity is set by limiting factors — food, water, shelter, space, disease — that cap how many individuals the ecosystem can sustain."},
  {id:"s-b-08", subj:"science", topic:"ecosystems", code:"B2.8", type:"mc",
   q:"A farm plants one single crop across all of its fields, year after year. What is a likely ecological drawback?",
   choices:["Reduced biodiversity and greater vulnerability to a single pest or disease","Increased soil depth","Higher rainfall","More species of pollinators"], a:0,
   why:"Monoculture reduces habitat variety and lets a pest specialized to that crop spread easily. Crop rotation and mixed planting are common strategies to restore balance."},
  {id:"s-b-09", subj:"science", topic:"ecosystems", code:"B1.2", type:"mc",
   q:"A city wants to reduce the environmental impact of road salt on nearby creeks. Which action most directly mitigates the negative impact?",
   choices:["Salting more often so less is needed each time","Using calibrated spreaders and pre-wetting to apply less salt for the same result","Widening the roads","Plowing after sunset"], a:1,
   why:"Mitigation means reducing the harm at its source. Applying less salt for the same de-icing effect cuts what runs into the creek."},
  {id:"s-b-10", subj:"science", topic:"ecosystems", code:"B1.3", type:"mc",
   q:"'Two-Eyed Seeing' refers to:",
   choices:["Using two microscopes at once","Bringing Indigenous knowledge and Western science together, using the strengths of both","Studying an ecosystem in two seasons","Comparing two ecosystems"], a:1,
   why:"The approach, credited to Mi'kmaw Elder Albert Marshall, describes learning to see with the strengths of Indigenous knowledges in one eye and Western science in the other."},

  /* ============ SCIENCE — PURE SUBSTANCES AND MIXTURES (Strand C) ============ */
  {id:"s-c-01", subj:"science", topic:"matter", code:"C2.1", type:"mc",
   q:"According to the particle theory of matter, which statement is TRUE?",
   choices:["Particles are motionless in a solid","All particles of one substance are identical, and they are always moving","Particles expand when heated","Particles of a gas are heavier than particles of a solid"], a:1,
   why:"Particles of a given substance are identical and are in constant motion. Heating makes them move faster and spread further apart — the particles themselves do not expand."},
  {id:"s-c-02", subj:"science", topic:"matter", code:"C2.2", type:"mc",
   q:"Which of these is a PURE SUBSTANCE?",
   choices:["Ocean water","Distilled water","Air","Steel"], a:1,
   why:"Distilled water is one kind of particle throughout. Ocean water, air and steel are all mixtures of different substances."},
  {id:"s-c-03", subj:"science", topic:"matter", code:"C2.3", type:"mc",
   q:"Which mixture is HETEROGENEOUS?",
   choices:["Salt dissolved in water","Italian salad dressing that separates","Clear apple juice","Air"], a:1,
   why:"In a heterogeneous mixture you can see the different parts. A solution like salt water looks uniform throughout, making it homogeneous."},
  {id:"s-c-04", subj:"science", topic:"matter", code:"C2.4", type:"mc",
   q:"Which change would make sugar dissolve FASTER in water?",
   choices:["Using colder water","Using larger sugar crystals","Stirring the mixture","Adding more sugar"], a:2,
   why:"Stirring, heating, and crushing into smaller pieces all increase the rate of dissolving by bringing more particle surfaces into contact more often."},
  {id:"s-c-05", subj:"science", topic:"matter", code:"C2.5", type:"mc",
   q:"A saturated solution is one in which:",
   choices:["No more solute will dissolve at that temperature","The solvent has evaporated","The solute is heavier than the solvent","The solution is coloured"], a:0,
   why:"At saturation the solvent holds as much dissolved solute as it can at that temperature. Extra solute settles at the bottom undissolved."},
  {id:"s-c-06", subj:"science", topic:"matter", code:"C2.6", type:"mc",
   q:"Water is called the 'universal solvent' because:",
   choices:["It dissolves absolutely everything","It dissolves a very wide range of substances, more than most other liquids","It is found everywhere on Earth","It has no taste"], a:1,
   why:"Water dissolves an unusually large number of substances, which is why it carries nutrients in living things and pollutants in the environment. It does not literally dissolve everything."},
  {id:"s-c-07", subj:"science", topic:"matter", code:"C2.7", type:"mc",
   q:"Which method would best separate salt from salt water and recover the water?",
   choices:["Filtration","Distillation","Using a magnet","Sifting"], a:1,
   why:"The salt is dissolved, so a filter will not catch it. Distillation boils off the water and condenses it back, leaving the salt behind."},
  {id:"s-c-08", subj:"science", topic:"matter", code:"C2.7", type:"mc",
   q:"Which method best separates a mixture of iron filings and sand?",
   choices:["A magnet","Evaporation","Chromatography","Dissolving in water"], a:0,
   why:"Iron is magnetic and sand is not, so a magnet exploits a physical property difference — the basis of every separation technique."},
  {id:"s-c-09", subj:"science", topic:"matter", code:"C2.8", type:"mc",
   q:"Which of these is a COMPOUND rather than an element?",
   choices:["Copper (Cu)","Oxygen (O₂)","Carbon dioxide (CO₂)","Gold (Au)"], a:2,
   why:"A compound contains two or more different kinds of atoms chemically combined. O₂ is two atoms of the same element, so it is still an element."},
  {id:"s-c-10", subj:"science", topic:"matter", code:"C1.1", type:"mc",
   q:"Smartphones contain metals mined in small quantities from ore. What is a key social and environmental impact to assess?",
   choices:["Phones are getting thinner each year","Mining and disposal can damage ecosystems and affect the health and rights of communities near the sites","Phone screens reflect sunlight","Batteries take time to charge"], a:1,
   why:"Assessing impact means looking at the whole life cycle — extraction, use and disposal — including effects on the communities where materials are mined and e-waste ends up."},

  /* ============ SCIENCE — STRUCTURES (Strand D) ============ */
  {id:"s-d-01", subj:"science", topic:"structures", code:"D2.1", type:"mc",
   q:"A concrete dam is an example of which type of structure?",
   choices:["Frame structure","Shell structure","Solid structure","Mechanical structure"], a:2,
   why:"A solid structure is made from a solid mass of material relying on its own weight. A bicycle is a frame structure; an egg or a car body is a shell structure."},
  {id:"s-d-02", subj:"science", topic:"structures", code:"D2.2", type:"mc",
   q:"Why is a race car designed to sit very low to the ground?",
   choices:["To reduce its mass","To lower its centre of gravity and make it more stable in turns","To increase friction with the air","To make it lighter to steer"], a:1,
   why:"A lower centre of gravity means the car can tilt further before its weight falls outside its base, so it is far less likely to roll."},
  {id:"s-d-03", subj:"science", topic:"structures", code:"D2.3", type:"mc",
   q:"To describe a force acting on a structure completely, you need its magnitude, its point of application, its plane of application, and its:",
   choices:["Colour","Direction","Temperature","Cost"], a:1,
   why:"Magnitude (how big), direction (which way), point of application (where it acts), and plane of application together describe the force."},
  {id:"s-d-04", subj:"science", topic:"structures", code:"D2.3", type:"mc",
   q:"The weight of a bridge's own beams and deck is an example of a:",
   choices:["Dynamic load","Static load","Torsion force","Shear failure"], a:1,
   why:"A static (dead) load is constant and unchanging. Traffic, wind and crowds are dynamic (live) loads that vary over time."},
  {id:"s-d-05", subj:"science", topic:"structures", code:"D2.5", type:"mc",
   q:"A metal bracket is bent back and forth thousands of times and finally snaps, even though no single bend was strong enough to break it. This failure is caused by:",
   choices:["Metal fatigue","Corrosion","Torsion","Buckling"], a:0,
   why:"Repeated loading below the breaking strength creates tiny cracks that grow with each cycle — fatigue. It is a major reason structures are inspected on a schedule."},
  {id:"s-d-06", subj:"science", topic:"structures", code:"D2.5", type:"mc",
   q:"When a beam bends downward under a load, the top of the beam is squeezed and the bottom is stretched. These two internal forces are:",
   choices:["Compression on top, tension on the bottom","Tension on top, compression on the bottom","Torsion on top, shear on the bottom","Both compression"], a:0,
   why:"The squeezing force is compression and the stretching force is tension. Recognizing which parts of a structure are in which lets engineers choose materials that handle each well."},
  {id:"s-d-07", subj:"science", topic:"structures", code:"D2.4", type:"mc",
   q:"Why is symmetry common in bridges and towers?",
   choices:["It makes them cheaper to paint","It helps distribute forces evenly so no one side carries much more load","It is required by law","It reduces the mass by half"], a:1,
   why:"A symmetrical design spreads loads evenly on both sides of the centre line, which improves stability and simplifies the engineering."},
  {id:"s-d-08", subj:"science", topic:"structures", code:"D2.6", type:"mc",
   q:"You are choosing material for an outdoor bench in Ontario. Which property matters MOST beyond strength?",
   choices:["Its colour","Its resistance to moisture and freeze-thaw cycles","Whether it floats","How it smells"], a:1,
   why:"Suitability depends on the conditions the material will face. Ontario benches face rain, road salt and repeated freezing and thawing."},
  {id:"s-d-09", subj:"science", topic:"structures", code:"D2.7", type:"mc",
   q:"Which practice do engineers use to keep an existing bridge safe over its lifetime?",
   choices:["Scheduled inspections that look for cracks, corrosion and deflection","Repainting it a brighter colour","Adding decorative railings","Increasing the speed limit"], a:0,
   why:"Assessing and maintaining safety means regular monitoring for early signs of failure, then repairing before a small problem becomes a structural one."},
  {id:"s-d-10", subj:"science", topic:"structures", code:"D1.2", type:"mc",
   q:"Which change to a student workspace best reflects good ergonomic design?",
   choices:["Placing the screen at eye level with the chair adjusted so feet rest flat","Using the smallest possible desk","Working on a bed for comfort","Keeping the room dark"], a:0,
   why:"Ergonomic design fits the space to the body to reduce strain — neutral neck position, supported back, and feet flat on the floor."},

  /* ============ SCIENCE — HEAT (Strand E) ============ */
  {id:"s-e-01", subj:"science", topic:"heat", code:"E2.1", type:"mc",
   q:"When a solid is heated, particle theory says its particles:",
   choices:["Get larger","Vibrate faster and move slightly further apart","Stop moving","Turn into different particles"], a:1,
   why:"Heat is energy of particle motion. Faster vibration pushes particles a little further apart, which is why solids expand — the particles themselves do not grow."},
  {id:"s-e-02", subj:"science", topic:"heat", code:"E2.3", type:"mc",
   q:"Why are gaps left between sections of a concrete bridge deck?",
   choices:["To drain rain water","To allow for thermal expansion in hot weather","To reduce the cost of concrete","To let air circulate underneath"], a:1,
   why:"The deck expands when heated and contracts when cooled. Expansion joints give it room to move instead of cracking or buckling."},
  {id:"s-e-03", subj:"science", topic:"heat", code:"E2.4", type:"mc",
   q:"A metal spoon left in a pot of hot soup becomes hot at the handle. This is heat transfer by:",
   choices:["Conduction","Convection","Radiation","Evaporation"], a:0,
   why:"Conduction transfers energy through direct particle-to-particle contact within a material, and metals do it well."},
  {id:"s-e-04", subj:"science", topic:"heat", code:"E2.5", type:"mc",
   q:"Baseboard heaters are installed near the floor rather than the ceiling because:",
   choices:["Warm air is denser and sinks","Warm air rises and cool air sinks, setting up a convection current that circulates heat through the room","Heat only travels upward by conduction","Radiation works better near the floor"], a:1,
   why:"Warmed air becomes less dense and rises; cooler air sinks to replace it. That circulating loop is convection, and it heats the whole room."},
  {id:"s-e-05", subj:"science", topic:"heat", code:"E2.6", type:"mc",
   q:"Two identical buckets of water sit in the sun, one in a black container and one in a white one. What happens, and why?",
   choices:["The black one warms faster, because dark surfaces absorb more radiation","The white one warms faster, because light surfaces attract heat","They warm identically","The black one warms faster because of convection"], a:0,
   why:"Radiation travels as waves that need no medium. Dark, dull surfaces absorb more of it; light, shiny surfaces reflect more."},
  {id:"s-e-06", subj:"science", topic:"heat", code:"E2.3", type:"mc",
   q:"Ice at 0°C is heated steadily and its temperature is graphed over time. During melting, the graph shows:",
   choices:["A steady rise","A flat section, because the energy is going into changing state rather than raising temperature","A sudden drop","A rise then a fall"], a:1,
   why:"During a change of state the added energy separates particles rather than speeding them up, so the temperature holds steady until melting finishes."},
  {id:"s-e-07", subj:"science", topic:"heat", code:"E2.7", type:"mc",
   q:"How do greenhouse gases affect heat in the atmosphere?",
   choices:["They block sunlight from reaching the ground","They absorb and re-radiate heat energy radiated from Earth's surface, keeping more of it in the atmosphere","They cool the atmosphere by reflecting radiation into space","They convert heat into light"], a:1,
   why:"Sunlight passes through and warms the surface. The surface radiates heat back out, and greenhouse gases absorb and re-radiate some of it, slowing its escape to space."},
  {id:"s-e-08", subj:"science", topic:"heat", code:"E2.8", type:"mc",
   q:"Which is a major source of greenhouse gas emissions from human activity?",
   choices:["Burning fossil fuels for transportation and heating","Planting trees","Ocean waves","Snowfall"], a:0,
   why:"Burning fossil fuels releases carbon dioxide. Agriculture, landfills and some industrial processes are other significant human sources."},
  {id:"s-e-09", subj:"science", topic:"heat", code:"E1.1", type:"mc",
   q:"Adding insulation to an attic reduces heat loss. What is the main social and environmental benefit?",
   choices:["The house looks better","Less energy is needed for heating, which lowers both costs and emissions","The attic becomes usable space","It prevents conduction entirely"], a:1,
   why:"Insulation slows heat transfer out of the house, so less fuel or electricity is burned to maintain the temperature — saving money and reducing emissions."},
  {id:"s-e-10", subj:"science", topic:"heat", code:"E1.2", type:"mc",
   q:"Which pair correctly identifies a renewable and a non-renewable energy source?",
   choices:["Wind (renewable), natural gas (non-renewable)","Coal (renewable), solar (non-renewable)","Oil (renewable), wind (non-renewable)","Natural gas (renewable), coal (non-renewable)"], a:0,
   why:"Renewable sources — wind, solar, hydro — replenish on a human timescale. Fossil fuels like coal, oil and natural gas do not."},

  /* ============ LANGUAGE — CONVENTIONS (B3) ============ */
  {id:"l-c-01", subj:"language", topic:"conventions", code:"B3.3", type:"mc",
   q:"Which sentence uses a semicolon correctly?",
   choices:["The rink was closed; so we went home.","The rink was closed; we went home.","The rink was closed; and dark.","The rink was closed; because of the storm."], a:1,
   why:"A semicolon joins two complete, closely related sentences. The other options attach a fragment or add a conjunction that a semicolon is meant to replace."},
  {id:"l-c-02", subj:"language", topic:"conventions", code:"B3.3", type:"mc",
   q:"Which sentence uses a colon correctly to introduce a quotation?",
   choices:["Coach said: “be early.”","Her rule was simple: “Late is a decision.”","She asked: if we were ready.","We packed: sticks, tape and water bottles, and left."], a:1,
   why:"A colon introducing a quotation must follow a complete sentence. “Her rule was simple” stands alone; “Coach said” does not."},
  {id:"l-c-03", subj:"language", topic:"conventions", code:"B3.3", type:"mc",
   q:"Which sentence punctuates the conjunctive adverb correctly?",
   choices:["The bus was late, however, we still made it.","The bus was late; however, we still made it.","The bus was late however we still made it.","The bus was late; however we still made it."], a:1,
   why:"When a conjunctive adverb like <em>however</em> joins two independent clauses, use a semicolon before it and a comma after it."},
  {id:"l-c-04", subj:"language", topic:"conventions", code:"B3.2", type:"mc",
   q:"In “The goalie stopped the puck <b>with a quick glove save</b>,” the bolded group of words is:",
   choices:["An adverbial phrase","A predicate noun","An indirect object","A participle"], a:0,
   why:"It modifies the verb <em>stopped</em> by telling how, so it functions as an adverbial phrase."},
  {id:"l-c-05", subj:"language", topic:"conventions", code:"B3.2", type:"mc",
   q:"In “Mira handed <b>her brother</b> the map,” the bolded words are the:",
   choices:["Direct object","Indirect object","Predicate adjective","Subject"], a:1,
   why:"The map is what was handed (direct object); her brother is to whom it was handed (indirect object)."},
  {id:"l-c-06", subj:"language", topic:"conventions", code:"B3.2", type:"mc",
   q:"In “The ice felt <b>slick</b>,” the bolded word is a:",
   choices:["Predicate adjective","Predicate noun","Adverb","Direct object"], a:0,
   why:"After a linking verb like <em>felt</em>, an adjective describing the subject is a predicate adjective."},
  {id:"l-c-07", subj:"language", topic:"conventions", code:"B3.1", type:"mc",
   q:"Which of these is a COMPLEX sentence?",
   choices:["Mira checked the time and zipped her bag.","Because the snow was falling hard, Mira checked the time.","Mira checked the time; the bus was late.","Mira checked the time."], a:1,
   why:"A complex sentence has an independent clause plus at least one subordinate clause. “Because the snow was falling hard” cannot stand alone."},
  {id:"l-c-08", subj:"language", topic:"conventions", code:"B3.1", type:"mc",
   q:"Combine into ONE effective complex sentence: “The truck slowed down. Mira recognized her neighbour.”",
   choices:["The truck slowed down and Mira recognized her neighbour.","When the truck slowed down, Mira recognized her neighbour.","The truck slowed down, Mira recognized her neighbour.","The truck slowed down; Mira recognized her neighbour."], a:1,
   why:"Adding the subordinating conjunction <em>when</em> creates a subordinate clause and shows the relationship in time between the two ideas. Option 3 is a comma splice."},
  {id:"l-c-09", subj:"language", topic:"conventions", code:"B3.3", type:"mc",
   q:"In “She reached for the door handle — and stopped,” the dash is used to:",
   choices:["Show an omission from a quotation","Mark a sudden break or pause for effect","Join two words into a compound","Replace a comma in a list"], a:1,
   why:"A dash signals an abrupt break or emphasis. An ellipsis (…) is what signals omitted words or a trailing-off pause."},
  {id:"l-c-10", subj:"language", topic:"conventions", code:"B3.2", type:"mc",
   q:"In “<b>Shivering</b> at the bus stop, Mira checked her phone,” the bolded word is:",
   choices:["A verb in the past tense","A participle acting as a modifier","A predicate noun","An indirect object"], a:1,
   why:"<em>Shivering</em> is formed from a verb but is working as a modifier describing Mira, which makes it a participle."},

  /* ============ LANGUAGE — READING (C) ============ */
  {id:"l-r-01", subj:"language", topic:"reading", code:"C3.2", type:"mc", passage:"p1",
   q:"Why does Mira think about Coach Devlin's rule while she waits?",
   choices:["She is deciding whether to quit the team","She is worried that arriving late will be judged as her own choice, not bad luck","She has forgotten what time the tryout starts","She is planning to tell the coach about the snow"], a:1,
   why:"This is an inference from implicit evidence. The rule “Late is a decision” matters to her precisely because she can feel it being applied to a situation she did not choose."},
  {id:"l-r-02", subj:"language", topic:"reading", code:"C1.5", type:"mc", passage:"p1",
   q:"The snow is described as coming down “in the loose, weightless way that fools people into thinking it is harmless.” This word choice mainly serves to:",
   choices:["Explain the science of snowfall","Create tension by hinting the snow is more of a threat than it appears","Show that Mira dislikes winter","Slow the pace so the reader relaxes"], a:1,
   why:"“Fools” frames the snow as deceptive. The line tells the reader to expect trouble before Mira admits it herself."},
  {id:"l-r-03", subj:"language", topic:"reading", code:"C1.6", type:"mc", passage:"p1",
   q:"From what point of view is this story told?",
   choices:["First person","Second person","Third person, limited to Mira","Third person, all-knowing about every character"], a:2,
   why:"The narrator uses “she” and “her” but reports only Mira's thoughts — we never learn what the sighing woman or Mr. Okafor is thinking."},
  {id:"l-r-04", subj:"language", topic:"reading", code:"C3.1", type:"mc", passage:"p1",
   q:"“A woman beside her kept checking her phone and sighing, as though sighing were a form of transit.” This line is an example of:",
   choices:["Foreshadowing","Irony used for a wry, humorous effect","Symbolism","Allegory"], a:1,
   why:"The narrator points out the gap between what the woman is doing and what would actually help. That gap, stated dryly, is verbal irony."},
  {id:"l-r-05", subj:"language", topic:"reading", code:"C2.6", type:"mc", passage:"p1",
   q:"Which sentence best states the main idea of the passage?",
   choices:["A careful plan is disrupted by something outside a character's control, and rescued by an unexpected offer of help","Winter weather in Ontario is dangerous for young athletes","A girl misses her tryout because of a snowstorm","Buses are unreliable in bad weather"], a:0,
   why:"The passage moves from plan, to disruption, to rescue. Option 3 states an outcome the text never confirms — she gets a ride."},
  {id:"l-r-06", subj:"language", topic:"reading", code:"C2.6", type:"mc", passage:"p2",
   q:"Which sentence best states the main idea of the article?",
   choices:["The Niagara Escarpment is a mountain range in Ontario","The Niagara Escarpment is a long rock ridge shaped by erosion, and its steep slope helped preserve it","Dolostone is the hardest rock in Ontario","UNESCO protects land in Ontario"], a:1,
   why:"The article explains what the escarpment is, how it formed, and why it stayed forested. The other options are details or misstatements."},
  {id:"l-r-07", subj:"language", topic:"reading", code:"C1.1", type:"mc", passage:"p2",
   q:"According to the article, the escarpment formed because:",
   choices:["Rock was pushed up from below by pressure","A hard layer of dolostone resisted erosion while softer rock beneath it wore away","A glacier carved it out in a single event","Rivers deposited rock in a long line"], a:1,
   why:"The article states directly that it “was not pushed up” and that the ridge is the edge of a hard layer left standing as softer rock eroded."},
  {id:"l-r-08", subj:"language", topic:"reading", code:"C3.2", type:"mc", passage:"p2",
   q:"The article says the slope is “difficult to farm and expensive to build on.” What can you infer from this?",
   choices:["Nobody has ever lived near the escarpment","The land was left alone largely for practical and economic reasons, not only for conservation ones","Farming is banned on the escarpment","The forests there were planted deliberately"], a:1,
   why:"The text implies the forest survived because clearing it was not worth the cost — an inference from evidence, not something the article says outright."},
  {id:"l-r-09", subj:"language", topic:"reading", code:"C1.2", type:"mc", passage:"p2",
   q:"Which text form best describes this passage?",
   choices:["Expository — it explains a topic using facts and examples","Narrative — it tells a story with characters","Persuasive — it argues for a position","Procedural — it gives steps to follow"], a:0,
   why:"The passage explains what the escarpment is and how it formed. It has no characters, no argument, and no instructions."},
  {id:"l-r-10", subj:"language", topic:"reading", code:"C1.3", type:"mc", passage:"p2",
   q:"Which text pattern is used in the second paragraph?",
   choices:["Chronological order","Cause and effect","Problem and solution","Question and answer"], a:1,
   why:"The paragraph explains a cause (hard rock resists erosion while soft rock wears away) and its effect (a long step in the landscape)."},

  /* ============ LANGUAGE — CRITICAL THINKING & MEDIA (C3) ============ */
  {id:"l-t-01", subj:"language", topic:"critical", code:"C3.1", type:"mc",
   q:"A story mentions in chapter one that the family's canoe has a slow leak. In chapter six, it sinks. The mention in chapter one is an example of:",
   choices:["Symbolism","Foreshadowing","Allegory","Flashback"], a:1,
   why:"Foreshadowing plants an early detail that hints at a later event, so the ending feels earned rather than random."},
  {id:"l-t-02", subj:"language", topic:"critical", code:"C3.1", type:"mc",
   q:"Throughout a novel, a character's grandmother's watch appears at every moment of hard decision. The watch most likely functions as:",
   choices:["A symbol of inherited responsibility","A red herring","A simile","An adverbial phrase"], a:0,
   why:"A symbol is an object that carries meaning beyond itself. Its repeated appearance at decision points is what signals the meaning."},
  {id:"l-t-03", subj:"language", topic:"critical", code:"C3.5", type:"mc",
   q:"Which sentence from an article shows the clearest sign of bias?",
   choices:["The council voted 6–3 to approve the arena.","Construction is scheduled to begin in April.","Only a handful of stubborn holdouts opposed the obviously necessary arena.","Two residents spoke against the proposal at the meeting."], a:2,
   why:"“Stubborn holdouts” and “obviously necessary” are loaded words that judge rather than report. The others state verifiable facts neutrally."},
  {id:"l-t-04", subj:"language", topic:"critical", code:"C3.5", type:"mc",
   q:"How could a writer best reduce bias in the sentence above?",
   choices:["Remove the sentence entirely","Replace the loaded words with neutral description and include the reasons the opponents gave","Add more adjectives on the other side to balance it","Put the sentence in quotation marks"], a:1,
   why:"Neutral wording plus the actual substance of the opposing view lets readers weigh the issue themselves. Piling on adjectives for the other side just doubles the bias."},
  {id:"l-t-05", subj:"language", topic:"critical", code:"C1.3", type:"mc",
   q:"What is the purpose of a bibliography at the end of an informational text?",
   choices:["To define difficult words","To list the sources the writer used, so readers can verify and follow up","To summarize the main ideas","To thank people who helped"], a:1,
   why:"A bibliography credits sources and makes claims checkable. A glossary defines words; an abstract or summary condenses ideas."},
  {id:"l-t-06", subj:"language", topic:"critical", code:"C1.4", type:"mc",
   q:"An infographic about screen time uses a phone-shaped bar that grows taller for each age group. What does this design choice most contribute?",
   choices:["It makes the numbers more precise","It makes the comparison instantly readable, though the shape can also exaggerate the difference","It removes the need for a title","It proves the data is accurate"], a:1,
   why:"Visual design shapes how quickly and how strongly a message lands. A pictorial bar reads fast, but scaling an image in two dimensions can overstate a one-dimensional difference."},
  {id:"l-t-07", subj:"language", topic:"critical", code:"C1.5", type:"mc",
   q:"Two reports describe the same event. One says protesters “gathered”; the other says they “swarmed.” This difference is an example of:",
   choices:["Word choice shaping the reader's impression","A spelling variation","A difference in text form","Foreshadowing"], a:0,
   why:"“Swarmed” carries connotations of threat and disorder that “gathered” does not. Elements of style like word choice quietly steer interpretation."},
  {id:"l-t-08", subj:"language", topic:"critical", code:"C3.3", type:"mc",
   q:"You have three sources on a topic and two disagree with the third. The best next step is to:",
   choices:["Go with the majority automatically","Check who created each source, when, and what evidence each one offers before deciding","Use whichever one is shortest","Discard all three and start over"], a:1,
   why:"Synthesizing means evaluating each source's authority, currency and evidence. Two agreeing sources can both be wrong, or can be repeating each other."},
  {id:"l-t-09", subj:"language", topic:"critical", code:"C3.6", type:"mc",
   q:"A short film shows a school adding ramps, captioning and quiet rooms, then follows three students through a normal day. The message conveyed is most likely about:",
   choices:["The cost of school renovations","Accessibility as something that changes who can fully take part","The history of school architecture","How to design a quiet room"], a:1,
   why:"The film pairs the changes with their effect on real students, which is how a text conveys a message about a topic like accessibility or inclusion."},
  {id:"l-t-10", subj:"language", topic:"critical", code:"C2.3", type:"mc",
   q:"You predicted a mystery's culprit halfway through, but new evidence in chapter ten contradicts you. What should a strong reader do?",
   choices:["Keep the original prediction and ignore the new evidence","Adjust the prediction to fit the new evidence and note what caused the change","Stop reading","Skip to the end to check"], a:1,
   why:"Predicting is a monitoring strategy, not a guessing game. Revising a prediction when evidence contradicts it is the part that builds comprehension."}
];

/* Worked examples. Each family gets steps plus a fully solved example on

    ex:"Estimate √30.\n25 < 30 < 36, so √25 = 5 and √36 = 6 → √30 is between 5 and 6.\n30 is closer to 25 than to 36, so √30 ≈ 5.5 (a bit under). Actual: 5.48."},
  "frac-to-percent": {title:"Fraction → percent", steps:[

  "decimal-fraction": {title:"Decimal → fraction in lowest terms", steps:[
    "Read the last decimal place to get the denominator: tenths → /10, hundredths → /100, thousandths → /1000.",
    "Write the digits over that denominator.",
    "Divide top and bottom by their greatest common factor."],

  "rounding-decimals": {title:"Rounding decimals", steps:[
    "Find the place you are rounding to and underline that digit.",
    "Look at the ONE digit to its right — nothing further.",
    "5 or more rounds up; 4 or less leaves it alone. Drop everything after."],
    ex:"Round 8.3862 to the nearest hundredth.\nHundredths digit is 8 (8.38|62). Next digit is 6 → round up.\n8.38 → 8.39"},
  "compare-decimals": {title:"Comparing decimals", steps:[
    "Line the numbers up by place value, or pad with zeros so they have the same number of digits.",

    ex:"Order 0.34, 0.3, 0.309 from greatest to least.\nPad: 0.340, 0.300, 0.309\nTenths all 3 → compare hundredths: 4, 0, 0 → 0.340 is biggest.\nThen thousandths: 0.309 > 0.300.\nAnswer: 0.34, 0.309, 0.3"},
  "powers-of-ten": {title:"Expanded form with powers of ten", steps:[
    "The exponent tells you how many zeros follow the 1: 10³ = 1000, 10⁶ = 1 000 000.",
    "Multiply the front number by that value.",
    "In practice, move the decimal point right by the exponent."],
    ex:"Write 6.2 × 10⁴ in standard form.\n10⁴ = 10 000\n6.2 × 10 000 = 62 000"},
  "integer-add-sub": {title:"Adding and subtracting integers", steps:[
    "Picture a number line: adding moves right, subtracting moves left.",
    "Subtracting a negative flips to adding: −(−5) becomes +5.",
    "Two numbers with different signs partly cancel; the bigger one decides the sign."],
    ex:"Calculate −9 + 4.\nStart at −9, move 4 right → −5.\n\nCalculate −3 − (−8).\nRewrite: −3 + 8 = 5."},
  "integer-mult-div": {title:"Multiplying and dividing integers", steps:[
    "Multiply or divide the digits as usual, ignoring signs.",
    "Same signs → positive. Different signs → negative.",
    "Count the negatives: an even number of them gives a positive."],
    ex:"Calculate (−9) × 4.\n9 × 4 = 36; signs differ → −36.\n\nCalculate (−36) ÷ (−9).\n36 ÷ 9 = 4; signs match → +4."},
  "order-of-ops": {title:"Order of operations", steps:[
    "Brackets first.",
    "Then exponents.",
    "Then multiplication and division, left to right as they appear.",
    "Then addition and subtraction, left to right."],
    ex:"Calculate 20 − 3 × (6 − 4)² ÷ 2.\nBrackets: (6 − 4) = 2\nExponent: 2² = 4\nMultiply/divide left to right: 3 × 4 = 12, then 12 ÷ 2 = 6\nSubtract: 20 − 6 = 14"},
  "percent-mental": {title:"Percents by mental math", steps:[
    "10% is the number with the decimal moved one place left.",

    ex:"4 kg of pears cost $9.00. What do 7 kg cost?\n$9.00 ÷ 4 = $2.25 per kg\n$2.25 × 7 = $15.75"},
  "add-fractions": {title:"Adding and subtracting fractions", steps:[

    "Rewrite each fraction with that denominator.",

  "evaluate-expression": {title:"Evaluating an expression", steps:[
